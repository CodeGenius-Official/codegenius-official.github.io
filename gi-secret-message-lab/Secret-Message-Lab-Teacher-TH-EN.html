let lang='th', current=0, renderedStage=0, soundOn=false, soundBusy=false, audio=null, nodes=[];

const state={intro:null,morse:'A',index:initialLab('index'),slice:initialLab('slice'),mission:{front:'XX',command:'GO TO BASE',back:'ZZ'},peer:{start:'',stop:'',result:null},shift:{added:false,start:'2',stop:'12',result:null},exit:[false,false,false]};
const stages=[
{short:['เปิดภารกิจ','The mission'],title:['หุ่นยนต์รอคำสั่งจากเรา','A robot needs your message'],lead:['ในข้อความนี้ มีคำสั่งซ่อนอยู่ เราจะให้ Python เลือกเฉพาะส่วนที่ต้องการได้อย่างไร?','There is an instruction inside this message. How can Python pick only the part we need?'],tag:'MISSION 01',steps:[['เปิดไฟล์ mission_starter.py แล้วลองรัน','Open mission_starter.py and run it.'],['ดูความต่างระหว่าง “หนึ่งตัวอักษร” กับ “ข้อความหนึ่งช่วง”','Compare one character with a piece of text.'],['วันนี้เราจะเขียนโค้ด สร้างข้อความ แล้วให้เพื่อนลองแก้','Today: code a message, make your own, and let a partner decode it.']],check:['เปิดไฟล์ได้ และบอกได้ว่าเราต้องเลือกหนึ่งตัวหรือหลายตัว','The file opens. You can say when you need one character or several.'],teacher:['ใช้เกร็ดหรือเกมเปิดบทเรียน แล้วกลับไปลงมือใน starter','Use a fact or game to introduce the lesson, then open the starter.'],support:['ถ้านักเรียนยังไม่เข้าใจ ให้ชี้ทีละตัว แล้วถามว่าหนึ่งตัวพอเป็นคำสั่งทั้งประโยคหรือไม่','Point to one character at a time. Ask whether one character can carry the whole instruction.']},
{short:['เลือกหนึ่งตัว','Pick one'],title:['ตัวที่อยู่ถัดจาก K คืออะไร?','Which character comes after K?'],lead:['นับตำแหน่งจาก 0 เลือก index แล้วคาดการณ์ก่อนกด Run','Count from 0. Choose an index, then predict before you press Run.'],tag:'MISSION 02 · INDEXING',steps:[['ชี้ตำแหน่งที่ต้องการใน X7K2Q แล้วตั้งค่า index','Point to the character you want in X7K2Q. Set index.'],['แทน key = "" ด้วยนิพจน์ indexing ของเรา','Replace key = "" with your indexing expression.'],['คาดการณ์ รัน Python แล้วจดผล KEY ลงใบงาน','Predict, run Python, and record KEY on your worksheet.']],check:['ได้ KEY: 2 จากโค้ดที่เลือกตัวอักษร ไม่ใช่พิมพ์คำตอบลงไปตรง ๆ','Your code selects KEY: 2. You did not type the answer directly.'],teacher:['เริ่มจาก word = "CAT" และ word[0] → C เพียงตัวอย่างเดียว แล้วกลับมาที่ X7K2Q ให้เด็กเลือกเอง','Model word = "CAT" and word[0] → C once. Return to X7K2Q and let students choose.'],support:['index เป็นตำแหน่ง ไม่ใช่ตัวอักษร ถ้าเกิด IndexError ให้ตรวจว่าค่าน้อยกว่าความยาวข้อความ','An index is a position, not a character. For IndexError, check that it is smaller than the text length.']},
{short:['ตัดข้อความ','Cut a message'],title:['เก็บคำสั่ง ทิ้งตัวรบกวน','Keep the command. Leave the noise.'],lead:['เลือกตั้งแต่ start และหยุดก่อน stop ช่องว่างก็นับเป็นหนึ่งตำแหน่ง','Keep start. Stop before stop. A space counts as one position too.'],tag:'MISSION 03 · SLICING',steps:[['หาช่วง MEET AT ROOF โดยไม่ติด X หรือ Z','Find MEET AT ROOF without any X or Z.'],['เขียน order = message[start:stop] แล้วคาดการณ์และรัน','Write order = message[start:stop]. Predict and run.'],['ลด stop ลง 1 ลองรัน แล้วคืนค่าที่เก็บคำสั่งครบ','Reduce stop by 1. Run, then restore the complete command.']],check:['ได้คำสั่งครบ และอธิบายได้ว่าทำไม stop ต้องอยู่หลัง F','The command is complete. You can explain why stop goes after F.'],teacher:['เริ่มสั้น ๆ ด้วย word = "CAT" และ word[0:2] → "CA" แล้วใช้จอนี้ชี้ start/stop','Start with word = "CAT" and word[0:2] → "CA". Use this screen to point at start/stop.'],support:['ถ้าหายตัวท้าย ให้ชี้ตัวสุดท้ายที่อยากเก็บ แล้วขยับ stop ไปทางขวาอีกหนึ่งตำแหน่ง','If the last character is missing, point to it and move stop one position right.']},
{short:['สร้างของเรา','Make yours'],title:['ออกแบบภารกิจให้เพื่อน','Make a mission for a friend'],lead:['เลือกคำสั่งของเราเอง เติมตัวรบกวน แล้วเขียนโค้ดตัดข้อความใน Python','Choose your own command, add noise, and write the Python slice that extracts it.'],tag:'MISSION 04 · CREATE',steps:[['เขียน my_message ใหม่ ใช้ A–Z, 0–9 และช่องว่าง รวมไม่เกิน 24 ตัว','Write a new my_message: A–Z, 0–9 and spaces, at most 24 characters.'],['มีตัวรบกวนหน้าและหลังด้านละ 1–3 ตัว เลือก my_start / my_stop เอง','Add 1–3 noise characters on each side. Choose my_start / my_stop.'],['เขียน my_order เป็น slice แล้วรัน แล้วบันทึกไฟล์','Write your own slice for my_order. Run it. Save your file.']],check:['ไฟล์ของเราแสดงคำสั่งที่เลือกได้จริง ก่อนแลกกับเพื่อน','Your own file extracts your chosen command before you swap.'],teacher:['ช่องออกแบบบนจอเป็นตัวอย่างของห้องเรียน ไม่แทนการเขียนโค้ดของนักเรียน เด็กเลือกคำสั่งและขอบเขตของตัวเอง','The on-screen designer is a class example, not a replacement for student code. Students choose their own command and boundaries.'],support:['คิดไม่ออกใช้ GO TO BASE หรือ BRING 2 STARS ได้ แต่ยังต้องเลือกตัวรบกวนและเขียน slice เอง','If stuck, offer GO TO BASE or BRING 2 STARS. Students still choose the noise and write the slice.']},
{short:['แลกกันลอง','Swap & decode'],title:['ให้เพื่อนเป็นคนถอดข้อความ','Let your partner decode it'],lead:['ให้ดูเฉพาะข้อความกับคำใบ้ เพื่อนต้องทาย start / stop ก่อนเห็นผล','Share only the message and clues. Your partner predicts start / stop before seeing the result.'],tag:'MISSION 05 · PEER TEST',steps:[['ปิดเฉลยและหน้าจอ ให้ดูเฉพาะ SHARE ONLY บนใบงาน','Cover the answer and hide your screen. Show only SHARE ONLY on the worksheet.'],['เพื่อนบอก start / stop ผู้สร้างจดค่า ใส่ในสำเนาไฟล์ แล้วรัน','The decoder predicts both bounds. The maker records them, enters them in a copy, and runs.'],['เทียบผล แก้ถ้ายังไม่ตรง แล้วสลับผู้สร้างกับผู้ถอดข้อความ','Compare and repair if needed. Swap maker and decoder halfway.']],check:['ทั้งสองคนได้ทาย รัน และอธิบายขอบเขตของข้อความ','Both students have predicted, run, and explained their boundaries.'],teacher:['ใช้สำเนาไฟล์สำหรับลองค่าของเพื่อน ไม่เขียนทับไฟล์ของกันและกัน ถ้ามีคนเดียว ครูเป็นผู้ถอดข้อความภายใต้กติกาเดียวกัน','Test a partner’s values in a copy. Do not overwrite each other’s files. With one learner, the teacher is the decoder under the same rules.'],support:['ถ้าติดตัวรบกวนท้ายหนึ่งตัว ถามว่า “ต้องขยับขอบไหน และไปทางไหน?” ไม่บอกตัวเลขทันที','If one trailing noise character appears, ask which boundary should move and in which direction. Do not give the number first.']},
{short:['เปลี่ยนแล้วทดสอบ','Change & retest'],title:['เพิ่มตัวหน้า 1 ตัว จะเกิดอะไรขึ้น?','One new character. What changes?'],lead:['คำสั่งต้องเหมือนเดิม แต่ตำแหน่งเลื่อนไป ลองคาดการณ์ทั้งสองขอบ','Keep the same command. Its positions have moved. Predict both new boundaries.'],tag:'MISSION 06 · DEBUG',steps:[['จดค่าเดิม แล้วเติมตัวอักษรหนึ่งตัวหน้าสุดของ my_message','Record the old bounds. Add one letter at the very front of my_message.'],['คาดการณ์ my_start / my_stop ใหม่ เปลี่ยนทั้งคู่แล้วรัน','Predict new my_start / my_stop. Change both and run.'],['เช็กว่า MY ORDER เหมือนเดิม และ KEY / ORDER เดิมยังทำงาน','Check that MY ORDER is unchanged and the earlier KEY / ORDER still work.']],check:['อธิบายได้ว่าทำไมทั้ง start และ stop เพิ่มขึ้นหนึ่ง','You can explain why start and stop both increase by one.'],teacher:['ข้อความหลังเพิ่มมีได้ถึง 25 ตัว แล้วกลับไปแก้ไฟล์ของนักเรียน','The revised message may have up to 25 characters. Then revise student files.'],support:['เปลี่ยนแค่ start จะทำให้หายตัวท้าย ลองเลื่อนช่องตัวอักษรทั้งแถวไปทางขวาหนึ่งตำแหน่ง','Changing only start loses the last character. Shift the entire row of characters one place right.']},
{short:['Quiz และส่งผลงาน','Quiz & submit'],title:['โชว์โค้ดที่เราอธิบายได้','Show code you can explain'],lead:['ปิดตัวอย่าง ทำโจทย์สั้นในใบงานด้วยตัวเอง แล้วบันทึกผลงาน','Close the examples. Try the worksheet’s short new puzzle on your own, then save your work.'],tag:'MISSION 07 · FINISH',steps:[['ตอบโจทย์ท้ายใบงานเอง จะชี้หรืออธิบายปากเปล่าก็ได้','Answer the exit puzzle yourself. Pointing or speaking is fine.'],['รันไฟล์สุดท้ายอีกครั้ง เช็กชื่อและที่บันทึก','Run the final file once more. Check its name and location.'],['ส่งไฟล์หรือภาพโค้ด พร้อมใบงาน ตามช่องทางของคลาส','Submit the file or a code image, plus the worksheet, through your class’s usual channel.']],check:['มีไฟล์ที่เปิดรันได้ และรู้ว่าเรื่องไหนยังอยากฝึกต่อ','Your saved file opens and runs. You know what you want to practise next.'],teacher:['บันทึกว่านักเรียนต้องได้รับความช่วยเหลือตรงไหน ไม่ใช้คะแนนเกมแทนหลักฐานการเขียนโค้ด','Note where each student needed help. A game score does not replace coding evidence.'],support:['ถามสั้น ๆ ว่า start รวมไหม และ stop รวมไหม ให้เด็กชี้โค้ดของตัวเองประกอบ','Ask: Is start included? Is stop included? Have students point to their own code.']}
];

let traceTimer=null,traceCursor=-1,traceCollected='';
function visualBoard(){
 const rows=[

function traceHTML(){return `<section class="trace-lab" aria-labelledby="traceTitle"><h3 id="traceTitle">${tr('เครื่องสแกนทีละตำแหน่ง','The character scanner')}</h3><p class="small">${tr('รันเพื่อตรวจคำตอบก่อน แล้วค่อยดูว่าแต่ละตัวถูกเก็บหรือข้าม','Run to check your prediction first. Then inspect which characters are kept or skipped.')}</p><div class="trace-controls"><button id="traceNext">${tr('เดินทีละตัว →','Step one character →')}</button><button id="tracePlay" aria-pressed="false">${tr('เล่นภาพเคลื่อนไหว','Animate')}</button><button id="traceReset">${tr('เริ่มภาพใหม่','Restart trace')}</button></div><div id="traceScreen" role="status" aria-live="polite"></div><p class="trace-note">${tr('ภาพอธิบายผลการเลือก ไม่ใช่ขั้นตอนการทำงานภายในของ Python','A visual explanation of the selection, not Python’s internal execution algorithm.')}</p></section>`;}
function stopTrace(){clearTimeout(traceTimer);traceTimer=null;const p=$('tracePlay');if(p){p.setAttribute('aria-pressed','false');p.textContent=tr('เล่นภาพเคลื่อนไหว','Animate');}}
function traceData(){const mode=current===1?'index':'slice',d=state[mode];return {mode,d,result:d.result?evaluate(d.packet,mode==='index'?d.index:d.start,d.stop,mode):null};}
function resetTraceView(){if(!$('traceScreen'))return;traceCursor=-1;traceCollected='';const {result}=traceData(),enabled=!!result&&!result.error;for(const id of ['traceNext','tracePlay','traceReset'])$(id).disabled=!enabled;$('traceScreen').textContent=enabled?tr('พร้อมแล้ว เริ่มที่ตำแหน่ง 0','Ready. Begin at position 0.'):tr('คาดการณ์ แล้ว Run ด้วยค่าที่ถูกต้องเพื่อเปิดเครื่องสแกน','Predict, then Run with valid values to unlock the scanner.');}
function stepTrace(){const {mode,d,result}=traceData();if(!result||result.error)return false;if(traceCursor>=d.packet.length-1)return false;traceCursor++;const i=traceCursor,a=intValue(mode==='index'?d.index:d.start),b=intValue(d.stop),keep=mode==='index'?i===a:i>=a&&i<b;if(keep)traceCollected+=d.packet[i];const done=i===d.packet.length-1;const why=mode==='index'?tr(keep?'ตรงกับ index':'ไม่ตรงกับ index',keep?'Matches index':'Does not match index'):tr(keep?'start ≤ ตำแหน่ง < stop':i<a?'อยู่ก่อน start':'อยู่ที่ stop หรือหลัง stop',keep?'start ≤ position < stop':i<a?'Before start':'At stop or after stop');$('traceScreen').innerHTML=`<div class="trace-frame"><div class="trace-character trace-pulse"><small>${tr('ตำแหน่ง','Position')} ${i}</small>${esc(d.packet[i]===' '?'␣':d.packet[i])}</div><div class="trace-description"><b>${keep?tr('เก็บ ↓','KEEP ↓'):tr('ข้าม →','SKIP →')}</b><p>${esc(why)}</p></div></div><div class="trace-strip" aria-hidden="true">${[...d.packet].map((c,n)=>`<span class="trace-dot ${n<=i?'visited':''} ${n===i?'active':''}">${esc(c===' '?'␣':c)}</span>`).join('')}</div><div class="trace-result">${tr('เก็บแล้ว','Collected')}: ${esc(JSON.stringify(traceCollected))}</div>${done?`<p class="small">✓ ${tr('ครบทุกตำแหน่ง ผลตรงกับ Run','All positions checked. This matches Run.')}</p>`:''}`;$('traceNext').disabled=done;if(done){stopTrace();$('tracePlay').disabled=true;}return !done;}
function playTrace(){if(stepTrace())traceTimer=setTimeout(playTrace,800);}
document.addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(id==='traceNext'){stopTrace();stepTrace();}if(id==='traceReset'){stopTrace();resetTraceView();}if(id==='tracePlay'){if(traceTimer){stopTrace();return;}if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){stepTrace();return;}$('tracePlay').setAttribute('aria-pressed','true');$('tracePlay').textContent=tr('พักภาพ','Pause');playTrace();}});

v class="hint">${tr('กลับไปทำข้อความตัวอย่างให้ถูกต้องก่อนทดลอง','Fix the example message before this experiment.')}</div><button class="primary gap-top" data-step="3">${tr('กลับไปสร้างข้อความ','Back to the designer')}</button>`}</section>`}

const quizQuestions=[
 {code:'word = "ROBOT"\nword[2]',q:['ผลลัพธ์คืออะไร?','What is the result?'],options:['"R"','"O"','"B"','"T"'],correct:2,hint:['เริ่มนับตำแหน่งตัวแรกจาก 0','Count the first character as position 0.'],why:['R อยู่ที่ 0, O ที่ 1 และ B ที่ 2 ดังนั้น word[2] ได้ "B"','R is at 0, O at 1 and B at 2, so word[2] returns "B".']},
 {code:'word = "PLANET"\nword[1:4]',q:['slice นี้เก็บข้อความใด?','Which text does this slice keep?'],options:['"PLAN"','"LANE"','"ANE"','"LAN"'],correct:3,hint:['เก็บตำแหน่ง start แล้วหยุดก่อน stop','Keep the start position; stop before the stop position.'],why:['เก็บตำแหน่ง 1, 2, 3 คือ L, A, N ไม่เก็บตำแหน่ง 4 จึงได้ "LAN"','Positions 1, 2 and 3 are L, A and N. Position 4 is excluded, giving "LAN".']},
 {code:'word = "MOON"\nword[2:2]',q:['เมื่อขอบเท่ากัน ผลคืออะไร?','When both bounds are equal, what is the result?'],options:['"O"','""','"ON"','IndexError'],correct:1,hint:['มีตำแหน่งใดที่มากกว่าหรือเท่ากับ 2 แต่น้อยกว่า 2 หรือไม่?','Can a position be at least 2 and also less than 2?'],why:['ไม่มีตำแหน่งอยู่ในช่วงนี้ จึงได้ข้อความว่าง "" ไม่ใช่ IndexError','No position is inside this range, so the result is the empty string "", not IndexError.']},
 {code:'message = "XGONZ"\nmessage[1:4]  # "GON"\nmessage = "QXGONZ"',q:['เพิ่ม Q ที่หน้า ต้องใช้ slice ใดเพื่อให้ได้ "GON" เหมือนเดิม?','After adding Q at the front, which slice still returns "GON"?'],options:['message[2:5]','message[2:4]','message[1:5]','message[1:4]'],correct:0,hint:['ตัวอักษรเดิมทุกตัวเลื่อนไปทางขวาหนึ่งตำแหน่ง','Every original character moves one position right.'],why:['ทั้งสองขอบเพิ่ม 1 จาก [1:4] เป็น [2:5] จึงเก็บ G, O, N ครบ','Both bounds increase by 1: [1:4] becomes [2:5], keeping G, O and N.']},
 {code:'word = "SUN"\nword[1:99]',q:['เมื่อ stop เกินความยาว ผลคืออะไร?','What happens when stop is beyond the text length?'],options:['IndexError','"SUN"','"UN"','""'],correct:2,hint:['Python จำกัดปลาย slice ให้พอดีข้อความ แต่ index นอกข้อความจะเกิด error','Python clips slice bounds to the text; a single out-of-range index is different.'],why:['slice เริ่มที่ตำแหน่ง 1 และเก็บจนสุดข้อความ จึงได้ "UN" ไม่เกิด IndexError','The slice begins at position 1 and keeps the rest of the text: "UN". It does not raise IndexError.']}
];
const quizState={current:0,picks:Array(5).fill(null),checked:Array(5).fill(false)};
function quizHTML(){const q=quizQuestions[quizState.current],n=quizState.current,pick=quizState.picks[n],checked=quizState.checked[n],score=quizQuestions.filter((x,i)=>quizState.checked[i]&&quizState.picks[i]===x.correct).length;return `<section class="quiz-box" id="quizBox" aria-labelledby="quizTitle"><p class="quiz-count">${tr('ข้อ','Question')} ${n+1} / ${quizQuestions.length} · ${tr('ตอบถูก','Correct')}: ${score} / ${quizQuestions.length}</p><h2 id="quizTitle" tabindex="-1">${tr('ลองคิดเองก่อนดูเฉลย','Think first. Then check.')}</h2><pre class="quiz-code">${esc(q.code)}</pre><p><strong>${esc(txt(q.q))}</strong></p><div class="quiz-options" role="group" aria-label="${tr('ตัวเลือกคำตอบ','Answer choices')}">${q.options.map((o,i)=>`<button data-quiz-pick="${i}" aria-pressed="${pick===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="quiz-controls"><button id="quizCheck" class="primary" ${pick===null?'disabled':''}>${tr('ตรวจคำตอบ','Check answer')}</button><button id="quizPrev" ${n===0?'disabled':''}>${tr('← ข้อก่อน','← Previous')}</button><button id="quizNext" ${n===quizQuestions.length-1?'disabled':''}>${tr('ข้อถัดไป →','Next →')}</button><button id="quizRestart">${tr('เริ่มแบบฝึกหัดใหม่','Restart quiz')}</button></div><div class="quiz-feedback" role="status" aria-live="polite">${checked?`<strong>${pick===q.correct?tr('✓ ตอบถูก','✓ Correct'):tr('ลองอีกครั้งได้','You can try again')}</strong><p>${esc(txt(q.why))}</p>`:''}</div><details><summary>${tr('ขอคำใบ้','Show hint')}</summary><p class="details-body">${esc(txt(q.hint))}</p></details><p class="quiz-help">${tr('แบบฝึกหัดนี้ใช้ฝึก ไม่แทนไฟล์ Python ของเรา คะแนนอยู่ในแท็บนี้เท่านั้น','This is practice, not a replacement for your Python file. Scores stay in this tab only.')}</p></section>`;}
function updateQuiz(focusId){const box=$('quizBox');if(!box)return;box.outerHTML=quizHTML();if(focusId)$(focusId)?.focus({preventScroll:true});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.quizPick!==undefined){quizState.picks[quizState.current]=Number(b.dataset.quizPick);quizState.checked[quizState.current]=false;updateQuiz();document.querySelector(`[data-quiz-pick="${b.dataset.quizPick}"]`)?.focus({preventScroll:true});return;}if(b.id==='quizCheck'){quizState.checked[quizState.current]=true;updateQuiz('quizCheck');}if(b.id==='quizNext'||b.id==='quizPrev'){quizState.current+=b.id==='quizNext'?1:-1;updateQuiz('quizTitle');}if(b.id==='quizRestart'){quizState.current=0;quizState.picks.fill(null);quizState.checked.fill(false);updateQuiz('quizTitle');}if(b.id==='openQuiz'){navigate(6);$('quizTitle').focus();$('quizBox').scrollIntoView({block:'start',behavior:'instant'});}});

function exitView(){const checks=[['ฉันชี้ได้ว่า index เลือกตัวไหน','I can point to the character chosen by an index.'],['ฉันอธิบายได้ว่า start รวม และ stop ไม่รวม','I can explain: start is included, stop is excluded.'],['ฉันสร้างข้อความเอง แก้ขอบเขต แล้วรันทดสอบได้','I made my own message, changed its bounds, and tested it.']];return `<section class="panel panel-focus"><div class="panel-label"><span class="dot"></span>${tr('ดูโค้ดของเรา แล้วเช็กตัวเอง','Look at your code. Check for yourself.')}</div>${quizHTML()}<h2>${tr('วันนี้ฉันทำอะไรได้แล้วบ้าง?','What can I do now?')}</h2><div class="exit-list">${checks.map((p,i)=>`<label><input type="checkbox" data-exit="${i}" ${state.exit[i]?'checked':''}>${esc(txt(p))}</label>`).join('')}</div><p class="small muted gap-top">${tr('ข้อที่ยังไม่มั่นใจ บอกครูได้เลย ไม่ต้องติ๊กให้ครบ','Tell your teacher what you are unsure about. You do not have to tick every box.')}</p><div class="save-note"><strong>${tr('ก่อนปิดเครื่อง: Save → Run → ส่งผลงาน','Before closing: Save → Run → Submit')}</strong><p class="small">mission_NAME.py + ${tr('ใบงาน · ใช้ชื่อสมมติและช่องทางส่งงานของคลาส','worksheet · use a fictional name and your class’s submission method')}</p></div><div class="hint gap-top">${tr('ผลงานของเราไม่ใช่แค่คำตอบ แต่คือโค้ดที่เพื่อนลองใช้ได้ และเราอธิบายได้ว่าทำไมมันทำงาน','Your result is more than an answer. It is code a partner can try, and you can explain why it works.')}</div></section>`}

function refreshIntro(){let r=state.intro===null?null:state.intro==='one'?{value:'M',help:tr('หนึ่งตัวบอกคำสั่งทั้งประโยคไม่ได้ เราต้องเลือกหลายตัวต่อกัน','One character cannot carry the whole instruction. We need several in a row.')}:{value:'MEET AT ROOF',help:tr('ถูกทางแล้ว! เราจะใช้ slice เลือกข้อความหนึ่งช่วง แต่เริ่มจากเลือกหนึ่งตัวให้เป็นก่อน','That is the idea! A slice selects a piece of text. First, learn to pick one character.')};setOutput('introOutput',r,tr('ลองเลือกดู หุ่นยนต์จะได้รับอะไร?','Make a choice. What will the robot receive?'));}
function validPacket(p,max=25){return p.length>0&&p.length<=max&&/^[A-Z0-9 ]+$/.test(p)}
function intValue(s){return /^\d+$/.test(String(s).trim())?Number(s):null;}
function evaluate(p,a,b,mode){if(!validPacket(p))return {error:tr('ตรวจข้อความก่อน','Check the message first'),help:tr('กิจกรรมนี้ใช้ A–Z, 0–9 และช่องว่าง 1–25 ตัว','Use 1–25 A–Z, 0–9 or space characters for this activity.')};let start=intValue(a);if(start===null||!Number.isSafeInteger(start))return {error:tr('ใส่ตำแหน่งเป็นจำนวนเต็มตั้งแต่ 0','Enter a whole-number position from 0')};if(mode==='index'){if(start>=p.length)return {error:'IndexError',help:tr(`ตำแหน่งสุดท้ายคือ ${p.length-1} ค่านี้อยู่นอกข้อความ`,`The final index is ${p.length-1}. This position is outside the text.`)};return {value:p[start],help:tr('หนึ่งตำแหน่ง เลือกหนึ่งตัวอักษร','One index selects one character.')};}let stop=intValue(b);if(stop===null||!Number.isSafeInteger(stop))return {error:tr('ใส่ start และ stop เป็นจำนวนเต็มตั้งแต่ 0','Enter whole-number start and stop values from 0')};let value=p.slice(start,stop);return {value,help:stop>p.length||start>p.length?tr('Python ตัด slice ที่เกินความยาวให้พอดี แต่กิจกรรมนี้เน้นขอบเขตที่มองเห็น','Python clips slices beyond the text length. This activity focuses on the visible boundaries.'):value===''?tr('ได้ข้อความว่าง เพราะไม่มีตัวอักษรอยู่ในช่วงที่เลือก','An empty string: no characters are inside this range.'):tr('เก็บ start และทุกตัวก่อน stop','Include start and every character before stop.')};}
function refreshLab(){stopTrace();let mode=current===1?'index':'slice',d=state[mode],valid=validPacket(d.packet),a=intValue(mode==='index'?d.index:d.start),b=intValue(d.stop);$('validation').textContent=valid?'':tr('ใช้ A–Z, 0–9 และช่องว่าง รวม 1–25 ตัว','Use A–Z, 0–9 and spaces, 1–25 characters.');$('run').disabled=!valid;let list='';if(valid){for(let i=0;i<d.packet.length+(mode==='slice'?1:0);i++){let last=i===d.packet.length,chosen=mode==='index'&&a===i,inside=mode==='slice'&&a!==null&&b!==null&&i>=a&&i<b&&!last;list+=`<div class="tile ${chosen?'chosen':''} ${inside?'in-range':''} ${d.result&&!last&&!chosen&&!inside?'cut-out':''} ${d.result&&(chosen||inside)?'delivered':''} ${last?'last':''} ${mode==='slice'&&a===i?'start':''} ${mode==='slice'&&b===i?'stop':''}"><span class="position">${i}</span><button data-position="${i}" aria-label="${esc(mode==='index'?tr(`ตำแหน่ง ${i}: ${d.packet[i]===' '?'ช่องว่าง':d.packet[i]}`,`Index ${i}: ${d.packet[i]===' '?'space':d.packet[i]}`):tr(`เลือก ${d.pick} = ${i}${last?' ขอบท้ายข้อความ':` ขอบก่อน${d.packet[i]===' '?'ช่องว่าง':d.packet[i]}`}`,`Set ${d.pick} to ${i}${last?', end boundary':`, boundary before ${d.packet[i]===' '?'space':d.packet[i]}`}`))}" ${chosen?'aria-pressed="true"':''}>${last?'│':d.packet[i]===' '?'␣':esc(d.packet[i])}</button></div>`;}}$('tokens').innerHTML=list;resetTraceView();
 $('expression').textContent=mode==='index'?`signal = ${JSON.stringify(d.packet)}\nindex = ${d.index||'?'}\nkey = signal[index]\nprint(key)`:`message = ${JSON.stringify(d.packet)}\nstart = ${d.start||'?'}\nstop = ${d.stop||'?'}\norder = message[start:stop]\nprint(order)`;
 $('expression').hidden=!d.showCode;
 const result=d.result?evaluate(d.packet,mode==='index'?d.index:d.start,d.stop,mode):null;setOutput('labOutput',result);
 $('liveToggle').disabled=!d.hasRun;$('liveToggle').setAttribute('aria-pressed',String(d.live));$('liveToggle').textContent=d.live?tr('ทดลองสด: เปิด','Live experiment: on'):tr('ทดลองสด: ปิด','Live experiment: off');$('liveHelp').textContent=d.hasRun?(d.live?tr('ผลเปลี่ยนทันที ลองทีละขอบ แล้วอธิบายสิ่งที่สังเกตเห็น','Results update instantly. Move one boundary at a time and explain what you notice.'):tr('เปิดทดลองสดเพื่อเลื่อนตำแหน่งแล้วเห็นผลทันที','Turn on live experiments to move a position and see the result immediately.')):tr('คาดการณ์แล้วกด Run หนึ่งครั้งก่อน จึงเปิดทดลองสดได้','Predict and press Run once to unlock live experiments.');
 for(const field of mode==='index'?['index']:['start','stop']){const slider=$(field+'Slider');slider.max=String(Math.max(0,d.packet.length-(mode==='index'?1:0)));slider.value=d[field];slider.disabled=!valid;}
 if(mode==='slice'&&$('discoveries')){if(result&&!result.error){if(result.value.length===1&&a!==null&&b===a+1)d.discoveries.one=true;if(a!==null&&b===a)d.discoveries.empty=true;if(d.packet==='XXMEET AT ROOFZZ'&&result.value==='MEET AT ROOF')d.discoveries.command=true;}const found=[['one',tr('ช่วงกว้าง 1 → ได้ 1 ตัว','A range of 1 → 1 character'),tr('ลองเก็บแค่ 1 ตัว','Try keeping just 1 character')],['empty',tr('ขอบเท่ากัน → ข้อความว่าง','Equal bounds → empty text'),tr('ลอง start เท่ากับ stop','Try equal start and stop')],['command',tr('stop อยู่หลังตัวสุดท้าย','stop is after the final character'),tr('ลองตัดคำสั่งให้ครบ','Try extracting the whole command')]];$('discoveries').innerHTML=`<span class="small muted">${tr('ชวนลอง · ใช้แทนตัวอย่างทบทวน','Try it · in place of review examples')}</span><div>${found.map(([k,yes,no])=>`<span class="discovery-stamp ${d.discoveries[k]?'found':''}">${d.discoveries[k]?'✓':'○'} ${esc(d.discoveries[k]?yes:no)}</span>`).join('')}</div>`;}
 const cmp=$('changeCompare');if(result&&!result.error&&d.previous!==null){cmp.hidden=false;cmp.innerHTML=`<span>${tr('ก่อนเปลี่ยน','Before')}<code>${esc(JSON.stringify(d.previous))}</code></span><span aria-hidden="true">→</span><span>${tr('ตอนนี้','Now')}<code>${esc(JSON.stringify(result.value))}</code></span>`;}else cmp.hidden=true;
}
function rememberLab(d,mode){if(d.result){const old=evaluate(d.packet,mode==='index'?d.index:d.start,d.stop,mode);if(!old.error)d.previous=old.value;}}

function packet(){return state.mission.front+state.mission.command+state.mission.back}
function missionValid(){let m=state.mission;return /^[A-Z0-9]{1,3}$/.test(m.front)&&/^[A-Z0-9]{1,3}$/.test(m.back)&&/^[A-Z0-9]+(?:[ A-Z0-9]*[A-Z0-9])?$/.test(m.command)&&packet().length<=24;}
function refreshMission(){let m=state.mission;$('missionPacket').textContent=packet()||tr('ข้อความจะปรากฏตรงนี้','Your message will appear here');$('missionCount').textContent=packet().length;$('commandCount').textContent=m.command.length;$('makeCard').disabled=!missionValid();$('missionValidation').textContent=missionValid()?'':tr('ตัวรบกวนใช้ A–Z/0–9 ด้านละ 1–3 ตัว คำสั่งไม่ว่างและไม่ขึ้นต้น/ลงท้ายด้วยช่องว่าง รวมทั้งข้อความไม่เกิน 24 ตัว','Noise: 1–3 A–Z/0–9 characters on each side. Add a command with no leading/trailing space. Keep the whole message within 24 characters.');}
function refreshPeer(){let r=state.peer.result?evaluate(packet(),state.peer.start,state.peer.stop,'slice'):null;if(r&&!r.error){r.help=r.value===state.mission.command?tr('ตรงกับคำสั่งที่ผู้สร้างตั้งใจไว้แล้ว ลองอธิบายขอบเขต แล้วสลับบทบาท','It matches the maker’s command. Explain the boundaries, then swap roles.'):tr('ยังไม่ตรงกับคำสั่ง ลองหาตัวที่เกินหรือหาย แล้วแก้ขอบเขต','Not the intended command yet. Find the extra or missing character, then adjust the bounds.');}setOutput('peerOutput',r,tr('ให้เพื่อนบอกทั้งสองค่าก่อน','Let the decoder give both values first'));}
function refreshShift(){let d=state.shift,trace=$('shiftTrace');if(trace){const p=(d.added?'Q':'')+packet(),a=intValue(d.start),b=intValue(d.stop);trace.innerHTML=[...p].map((c,i)=>`<span class="trace-tile ${d.added&&i===0?'inserted':''} ${d.result&&a!==null&&b!==null&&i>=a&&i<b?'kept':''}"><small>${i}</small><b>${c===' '?'␣':esc(c)}</b></span>`).join('');}let r=d.result?evaluate('Q'+packet(),d.start,d.stop,'slice'):null;if(r&&!r.error){r.help=r.value===state.mission.command?tr('คำสั่งเหมือนเดิมแล้ว เพราะทั้งสองขอบเลื่อนไปหนึ่งตำแหน่ง','The command is unchanged. Both boundaries moved one position.'):tr('คำสั่งยังไม่เหมือนเดิม ตรวจทั้ง start และ stop อีกครั้ง','The command has changed. Check both start and stop again.');}setOutput('shiftOutput',r,d.added?tr('ทายค่าใหม่ทั้งสองขอบก่อน','Predict both new boundaries first'):tr('เพิ่ม Q ก่อน แล้วลองแก้ขอบเขต','Add Q first, then adjust the boundaries'));}
function resetDependent(){state.peer={start:'',stop:'',result:null};state.shift={added:false,start:String(state.mission.front.length),stop:String(state.mission.front.length+state.mission.command.length),result:null};}
function navigate(i){if(!Number.isInteger(i)||i<0||i>=stages.length)return;stopTones();current=i;$('status').textContent='';render(true);}
function notify(th,en){$('status').textContent=tr(th,en);}
function stopTones(){for(let n of nodes){try{n.stop()}catch{}}nodes=[];}
function updateSound(){$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?tr('ปิดเสียง','Turn sound off'):tr('เปิดเสียง','Turn sound on'));$('soundLabel').textContent=soundOn?tr('เสียงเปิด','Sound on'):tr('เสียงปิด','Sound off');$('fullscreen').setAttribute('aria-label',tr('เต็มจอ','Full screen'));}
async function toggleSound(){
 if(soundBusy)return;soundBusy=true;$('sound').disabled=true;
 try{
  if(soundOn){soundOn=false;stopTones();try{await audio?.close()}catch{}audio=null;return;}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('unsupported');audio=new A();await audio.resume();soundOn=true;notify('เปิดเสียงแล้ว ปิดได้ทุกเมื่อ','Sound is on. You can mute it at any time.');
 }catch{
  soundOn=false;stopTones();try{await audio?.close()}catch{}audio=null;notify('อุปกรณ์นี้ยังเล่นเสียงไม่ได้ ใช้ภาพและข้อความได้ตามปกติ','Audio is not available here. All visual activities still work.');
 }finally{soundBusy=false;$('sound').disabled=false;updateSound();}
}
function tone(freq=540,duration=.07,offset=0){if(!soundOn||!audio)return;const start=audio.currentTime+offset,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.06,start+.008);gain.gain.setValueAtTime(.06,start+Math.max(.01,duration-.015));gain.gain.linearRampToValueAtTime(0,start+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+duration+.01);nodes.push(osc);osc.onended=()=>{nodes=nodes.filter(n=>n!==osc);osc.disconnect();gain.disconnect();};}
function resetCurrent(){stopTones();if(current===1)state.index=initialLab('index');if(current===2)state.slice=initialLab('slice');if(current===3){state.mission={front:'XX',command:'GO TO BASE',back:'ZZ'};resetDependent();}if(current===5)state.shift={added:false,start:String(state.mission.front.length),stop:String(state.mission.front.length+state.mission.command.length),result:null};render();notify('เริ่มช่วงนี้ใหม่แล้ว','This stage has been reset.');}
let resetInvoker=null;
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target||target.disabled)return;if(target.dataset.step!==undefined){navigate(Number(target.dataset.step));return;}if(target.dataset.position!==undefined){const mode=current===1?'index':'slice',d=state[mode],p=target.dataset.position;rememberLab(d,mode);if(mode==='index'){d.index=p;$('index').value=p;}else{d[d.pick]=p;$(d.pick).value=p;}d.result=d.live||null;refreshLab();document.querySelector(`[data-position="${p}"]`)?.focus({preventScroll:true});return;}const a=target.dataset.action;if(!a)return;
 if(a==='intro-one'||a==='intro-range'){state.intro=a==='intro-one'?'one':'range';document.querySelectorAll('[data-action^="intro-"]').forEach(b=>b.setAttribute('aria-pressed',String(b===target)));refreshIntro();tone();}
 if(a==='morse-swap'){state.morse=state.morse==='A'?'N':'A';$('morsePattern').textContent=state.morse==='A'?'· −':'− ·';$('morseLetter').textContent=state.morse;stopTones();}
 if(a==='morse-play'){if(!soundOn){notify('กดเปิดเสียงก่อน แล้วเลือกฟังอีกครั้ง','Turn sound on, then choose Listen again.');return;}stopTones();let dot=.16,dash=.48,gap=.16;if(state.morse==='A'){tone(600,dot);tone(600,dash,dot+gap)}else{tone(600,dash);tone(600,dot,dash+gap)}}
 if(a==='reset'){resetInvoker=target;$('resetDialog').showModal();$('cancelReset').focus();}
 if(a==='model-cat'||a==='model-mission'){state.index={...initialLab('index'),packet:a==='model-cat'?'CAT':'X7K2Q'};render();}
 if(a==='pick-start'||a==='pick-stop'){state.slice.pick=a==='pick-start'?'start':'stop';document.querySelectorAll('[data-action^="pick-"]').forEach(b=>b.setAttribute('aria-pressed',String(b===target)));refreshLab();}
 if(a==='run'){let d=state[current===1?'index':'slice'];d.result=true;d.hasRun=true;refreshLab();tone();}
 if(a==='live'){let d=state[current===1?'index':'slice'];if(d.hasRun){d.live=!d.live;if(d.live)d.result=true;refreshLab();}}
 if(a==='code'){let d=state[current===1?'index':'slice'];d.showCode=!d.showCode;target.setAttribute('aria-expanded',String(d.showCode));target.textContent=d.showCode?tr('ซ่อนโค้ดตัวอย่าง','Hide example code'):tr('ดูโค้ดของค่าที่เลือก','Show code for these values');refreshLab();}
 if(a==='shorter'||a==='longer'){let d=state.slice,n=intValue(d.stop);if(n!==null&&(a==='longer'||n>0)){rememberLab(d,'slice');d.stop=String(n+(a==='longer'?1:-1));$('stop').value=d.stop;d.result=d.live||null;refreshLab();}else notify('stop ต้องมากกว่า 0 จึงจะลดได้','stop must be greater than 0 to reduce it.');}
 if(a==='make-card'&&missionValid()){resetDependent();navigate(4);}
 if(a==='peer-run'&&missionValid()){state.peer.result=true;refreshPeer();tone();}
 if(a==='add-noise'&&!state.shift.added){state.shift.added=true;state.shift.result=null;render();$('shiftStart').focus();}

});
document.addEventListener('input',e=>{let id=e.target.id;if(['indexSlider','startSlider','stopSlider'].includes(id)){let field=id.replace('Slider',''),mode=current===1?'index':'slice',d=state[mode];rememberLab(d,mode);d[field]=e.target.value;$(field).value=e.target.value;d.result=d.live||null;refreshLab();return;}if(['packet','index','start','stop'].includes(id)&&(current===1||current===2)){let mode=current===1?'index':'slice',d=state[mode];rememberLab(d,mode);d[id]=e.target.value;d.result=d.live||null;refreshLab();}if(['front','command','back'].includes(id)){state.mission[id]=e.target.value;resetDependent();refreshMission();}if(id==='peerStart'||id==='peerStop'){state.peer[id==='peerStart'?'start':'stop']=e.target.value;state.peer.result=null;refreshPeer();}if(id==='shiftStart'||id==='shiftStop'){state.shift[id==='shiftStart'?'start':'stop']=e.target.value;state.shift.result=null;refreshShift();}if(e.target.dataset.exit!==undefined)state.exit[Number(e.target.dataset.exit)]=e.target.checked;});
$('langTh').addEventListener('click',()=>{lang='th';$('status').textContent='';render()});$('langEn').addEventListener('click',()=>{lang='en';$('status').textContent='';render()});$('prev').addEventListener('click',()=>navigate(current-1));$('next').addEventListener('click',()=>navigate(current+1));$('sound').addEventListener('click',toggleSound);$('cancelReset').addEventListener('click',()=>{$('resetDialog').close();resetInvoker?.focus()});$('confirmReset').addEventListener('click',()=>{$('resetDialog').close();resetCurrent();document.querySelector('[data-action="reset"]')?.focus()});$('resetDialog').addEventListener('cancel',()=>{resetInvoker?.focus()});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('unsupported');}catch{notify('อุปกรณ์นี้ยังใช้เต็มจอไม่ได้ ใช้หน้าจอปกติต่อได้','Full screen is unavailable here. You can keep using this view.')}});document.addEventListener('fullscreenchange',()=>$('fullscreen').setAttribute('aria-pressed',String(!!document.fullscreenElement)));window.addEventListener('pagehide',()=>{stopTones();try{audio?.close()}catch{}});
