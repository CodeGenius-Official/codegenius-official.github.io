    ]

function getGrade(p){
  if(p>=90) return {grade:"A",label:"ดีเยี่ยม",color:"#00b3c5",bg:"#CCF2F6",result:"→ Certified Teacher"};
  if(p>=75) return {grade:"B",label:"ดี",color:"#0055AA",bg:"#E8F4FF",result:"→ Certified Teacher"};
  if(p>=65) return {grade:"C",label:"ไม่ผ่าน — มีแผนพัฒนา",color:"#9A6F00",bg:"#FFF3CD",result:"→ Coaching + Re-audit"};
  return          {grade:"D",label:"ไม่ผ่าน — เลิกจ้าง",color:"#cc2200",bg:"#FFE8E5",result:"→ แจ้งเลิกจ้าง"};
}
const scBg = v => v===5?"#2DB87A":v===3?"#F5A623":v===1?"#ff5c3f":v==="na"?"#aaa":"#e8e8e8";

// ── Google Sheet integration ──────────────────────────────────────
// วาง Apps Script URL ที่นี่หลัง deploy
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4KVgsPV-_aHOCXoLN9V778LjCc8xfQtNTcaoGl4j32_-vcnUWBTmDuW20ZrSeW416/exec";
const scTx = v => v===5?"🟢 โดดเด่น (5)":v===3?"🟡 ยังต้องพัฒนา (3)":v===1?"🔴 ปรับปรุงด่วน (1)":v==="na"?"N/A":"—";

function App(){
  const [scores,setScores]   = useState({});
  const [fb,setFb]           = useState({});
  const [overall,setOverall] = useState("");
  const [name,setName]       = useState("");
  const [branch,setBranch]   = useState("");
  const [adate,setAdate]     = useState("");
  const [atype,setAtype]     = useState("onsite");
  const [open,setOpen]       = useState({});
  const [view,setView]       = useState(false);
  const [saveStatus,setSaveStatus] = useState(null); // null | "saving" | "ok" | "error"

  const saveToSheet = async () => {
    if(APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE"){
      alert("⚠️ ยังไม่ได้ตั้งค่า Apps Script URL\nดูคำแนะนำในไฟล์ CG_AuditScript.gs");
      return;
    }
    setSaveStatus("saving");
    try {
      const payload = {
        teacherName: name,
        branch,
        auditDate: adate,
        auditType: atype,
        grade: grade?.grade || "",
        scoreTotal: calc.tot,
        scoreMax: calc.mx,
        scorePct: calc.pct,
        scores,
        feedback: fb,
        catScores: calc.cs,
        overallFeedback: overall,
      };
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload),
      });
      setSaveStatus("ok");
    } catch(err) {
      setSaveStatus("error");
    }
    setTimeout(() => setSaveStatus(null), 4000);
  };

  const todayStr = new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
  const today = adate ? new Date(adate).toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"}) : todayStr;

  const calc = useMemo(()=>{
    let tot=0,mx=0,na=0; const cs={};
    RUBRIC.forEach(s=>{
      let ct=0,cm=0;
      s.items.forEach(it=>{
        const v=scores[it.id];
        if(v==="na"||v===undefined) na++;
        else{tot+=v;mx+=5;ct+=v;cm+=5;}
      });
      cs[s.cat]={tot:ct,mx:cm,pct:cm>0?ct/cm*100:null};
    });
    return{tot,mx,pct:mx>0?tot/mx*100:0,ans:20-na,na,cs};
  },[scores]);

  const grade = calc.mx>0?getGrade(calc.pct):null;

  const doPrint = () => {
    window.print();
  };

  // ── VIEW MODE ──────────────────────────────────────────────
  if(view){
    const atLabel = atype==="onsite"?"📍 Onsite":atype==="online"?"📹 Online":"📍📹 ทั้งคู่";
    return (
      <div style={{minHeight:"100vh",background:"#eee"}}>
        {/* toolbar */}
        <div id="toolbar" style={{background:"#223549",padding:"10px 16px",display:"flex",gap:10,alignItems:"center",position:"sticky",top:0,zIndex:10}}>
          <button onClick={()=>setView(false)}
            style={{padding:"7px 16px",background:"white",color:"#223549",border:"none",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:13}}>
            ← แก้ไข
          </button>
          <div style={{flex:1,color:"white",fontWeight:600,fontSize:14}}>📋 ผลประเมิน — {name||"ไม่ระบุชื่อ"}</div>
          <button onClick={saveToSheet} disabled={saveStatus==="saving"}
            style={{padding:"7px 16px",border:"none",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:13,
              background:saveStatus==="ok"?"#2DB87A":saveStatus==="error"?"#ff5c3f":saveStatus==="saving"?"#aaa":"#ffd456",
              color:saveStatus?"white":"#223549"}}>
            {saveStatus==="saving"?"⏳ บันทึก...":saveStatus==="ok"?"📨 ส่งคำขอแล้ว — ตรวจ Sheet":saveStatus==="error"?"❌ Error":"💾 บันทึกลง Sheet"}
          </button>
          <button onClick={doPrint}
            style={{padding:"7px 18px",background:"#00b3c5",color:"white",border:"none",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:13}}>
            🖨️ Print / Save PDF
          </button>
        </div>

        {/* report */}
        <div style={{padding:16,maxWidth:760,margin:"0 auto"}}>
          <div id="print-area" style={{background:"white",borderRadius:10,padding:"24px 28px",boxShadow:"0 2px 16px rgba(0,0,0,0.1)"}}>

            {/* report header */}
            <div style={{borderBottom:"3px solid #00b3c5",paddingBottom:12,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
              <div>
                <div style={{fontSize:11,color:"#00b3c5",fontWeight:700,letterSpacing:1}}>CODE GENIUS{branch ? " — "+branch : ""}</div>
                <div style={{fontSize:22,fontWeight:800}}>Audit Report</div>
                <div style={{fontSize:12,color:"#888"}}>Teacher Evaluation Check Sheet</div>
              </div>
              {grade&&<div style={{textAlign:"right"}}>
                <div style={{fontSize:56,fontWeight:900,color:grade.color,lineHeight:1}}>{grade.grade}</div>
                <div style={{fontSize:13,fontWeight:600,color:grade.color}}>{grade.label}</div>
              </div>}
            </div>

            {/* meta grid */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
              {[["ชื่อครู",name||"—"],["สาขา",branch||"—"],["รูปแบอ",atLabel],["วันที่",today],
                ["คะแนน",`${calc.tot}/${calc.mx}`],["เปอร์เซ็นต์",`${calc.pct.toFixed(1)}%`],["ข้อที่ประเมิน",`${calc.ans}/20`]
              ].map(([k,v])=>(
                <div key={k} style={{background:"#F8FEFF",borderRadius:6,padding:"8px 12px",borderLeft:"3px solid #CCF2F6"}}>
                  <div style={{fontSize:10,color:"#888"}}>{k}</div>
                  <div style={{fontSize:13,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>

            {/* grade bar */}
            {grade&&<div style={{background:grade.bg,border:`1.5px solid ${grade.color}`,borderRadius:8,padding:"10px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:grade.color}}>{grade.grade} — {grade.label}</div>
                <div style={{fontSize:12,color:"#666"}}>{grade.result}</div>
              </div>
              <div style={{display:"flex",gap:5}}>
                {[["A","≥90%","#00b3c5"],["B","75–89%","#0055AA"],["C","65–74%","#9A6F00"],["D","<65%","#cc2200"]].map(([g,r,c])=>(
                  <div key={g} style={{padding:"3px 9px",borderRadius:5,fontSize:11,background:grade.grade===g?c:"#eee",color:grade.grade===g?"white":"#aaa",fontWeight:600}}>{g} {r}</div>
                ))}
              </div>
            </div>}

            {/* cat summary */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:16}}>
              {RUBRIC.map(s=>{
                const c=calc.cs[s.cat];
                return <div key={s.cat} style={{background:s.light,borderRadius:8,padding:"8px 6px",borderTop:`3px solid ${s.color}`,textAlign:"center"}}>
                  <div style={{fontSize:9,color:s.textColor,fontWeight:700}}>หมวด {s.cat}</div>
                  <div style={{fontSize:17,fontWeight:900,color:s.textColor}}>{c.mx>0?`${c.tot}/${c.mx}`:"N/A"}</div>
                  <div style={{fontSize:10,color:s.textColor}}>{c.mx>0?`${c.pct.toFixed(0)}%`:""}</div>
                </div>;
              })}
            </div>

            {/* items */}
            {RUBRIC.map(s=>(
              <div key={s.cat} style={{marginBottom:12}}>
                <div style={{background:s.color,color:"white",borderRadius:"6px 6px 0 0",padding:"7px 12px",fontSize:12,fontWeight:700}}>
                  หมวด {s.cat}: {s.title}
                </div>
                {s.items.map((it,ii)=>{
                  const v=scores[it.id]; const f=fb[it.id];
                  return <div key={it.id} style={{padding:"8px 12px",background:ii%2===0?s.light:"white",borderBottom:"1px solid #eee",display:"flex",gap:10,alignItems:"flex-start"}}>
                    <div style={{flexShrink:0,width:30,height:30,borderRadius:6,background:v!==undefined?scBg(v):"#eee",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:v==="na"?9:13,fontWeight:800}}>
                      {v==="na"?"N/A":v??"-"}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:600}}>{it.id} {it.title}</div>
                      <div style={{fontSize:11,color:v!==undefined?scBg(v):"#aaa",fontWeight:500}}>{scTx(v)}</div>
                      {f&&<div style={{fontSize:11,color:"#555",marginTop:4,fontStyle:"italic",borderLeft:"2px solid #CCF2F6",paddingLeft:8,background:"#F8FEFF",padding:"4px 8px",borderRadius:"0 4px 4px 0"}}>{f}</div>}
                    </div>
                  </div>;
                })}
              </div>
            ))}

            {/* overall fb */}
            {overall&&<div style={{background:"#F8FEFF",border:"1px solid #CCF2F6",borderRadius:8,padding:"12px 16px",marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:700,color:"#007A87",marginBottom:6}}>💬 ข้อเสนอแนะภาพรวม</div>
              <div style={{fontSize:12,color:"#333",whiteSpace:"pre-wrap"}}>{overall}</div>
            </div>}

            {/* signature */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,marginTop:24,paddingTop:16,borderTop:"1px solid #eee"}}>
              {["Code Genius's Signature","Auditee's Signature"].map(l=>(
                <div key={l} style={{textAlign:"center"}}>
                  <div style={{height:50,borderBottom:"1px solid #999",marginBottom:6}}></div>
                  <div style={{fontSize:11,color:"#888"}}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:14,fontSize:10,color:"#bbb",textAlign:"center"}}>
              Code Genius Teacher Audit Program — {today}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── EDIT MODE ──────────────────────────────────────────────
  return (
    <div style={{maxWidth:720,margin:"0 auto",padding:"16px 12px",fontFamily:"'Sarabun','Prompt',system-ui,sans-serif",color:"#223549"}}>

      {/* header */}
      <div style={{background:"linear-gradient(135deg,#00b3c5,#007A87)",borderRadius:12,padding:"16px 20px",marginBottom:16,color:"white"}}>
        <div style={{fontSize:11,opacity:.8,letterSpacing:1}}>CODE GENIUS</div>
        <div style={{fontSize:18,fontWeight:700,margin:"4px 0 2px"}}>Teacher Audit Calculator</div>
        <div style={{fontSize:12,opacity:.85}}>กรอกคะแนนแต่ละข้อ → คำนวณเกรดอัตโนมัติ</div>
      </div>

      {/* meta */}
      <div style={{background:"#F8FEFF",border:"1px solid #CCF2F6",borderRadius:10,padding:"12px 16px",marginBottom:16}}>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:10}}>
          <div style={{flex:1,minWidth:160}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>ชื่อครู</div>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="กรอกชื่อครู..."
              style={{width:"100%",border:"1px solid #ccc",borderRadius:6,padding:"6px 10px",fontSize:13,boxSizing:"border-box"}}/>
          </div>
          <div style={{flex:1,minWidth:160}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>สาขา</div>
            <select value={branch} onChange={e=>setBranch(e.target.value)}
              style={{width:"100%",border:"1px solid #ccc",borderRadius:6,padding:"6px 10px",fontSize:13,background:"white",boxSizing:"border-box"}}>
              <option value="">-- เลือกสาขา --</option>
              <option>Emquartier (HQ)</option>
              <option>Nichada</option>
              <option>Central Rama 9</option>
              <option>Bangna</option>
              <option>The Walk Kaset-Nawamin</option>
              <option>Korat</option>
              <option>Ubon Ratchathani</option>
            </select>
          </div>
          <div style={{flex:1,minWidth:160}}>
            <div style={{fontSize:11,color:"#888",marginBottom:4}}>วันที่ Audit</div>
            <input type="date" value={adate} onChange={e=>setAdate(e.target.value)}
              style={{width:"100%",border:"1px solid #ccc",borderRadius:6,padding:"6px 10px",fontSize:13,boxSizing:"border-box"}}/>
          </div>
        </div>
        <div>
          <div style={{fontSize:11,color:"#888",marginBottom:4}}>รูปแบบ Audit</div>
          <div style={{display:"flex",gap:6}}>
            {[["onsite","📍 Onsite"],["online","📹 Online"],["both","ทั้งคู่"]].map(([v,l])=>(
              <button key={v} onClick={()=>setAtype(v)}
                style={{padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12,fontWeight:500,background:atype===v?"#00b3c5":"#eee",color:atype===v?"white":"#555"}}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* score bar */}
      <div style={{background:grade?grade.bg:"#F5F5F5",border:`1.5px solid ${grade?grade.color:"#ccc"}`,borderRadius:12,padding:"14px 18px",marginBottom:18,display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:36,fontWeight:800,color:grade?.color||"#ccc",lineHeight:1}}>{grade?.grade||"—"}</div>
          <div style={{fontSize:10,color:"#888",marginTop:2}}>เกรด</div>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:grade?.color||"#888"}}>{grade?`${calc.pct.toFixed(1)}% — ${grade.label}`:"ยังไม่มีคะแนน"}</div>
          <div style={{fontSize:12,color:"#666",marginTop:2}}>{grade?.result||"กรอกคะแนนเพื่อดูผล"}</div>
          <div style={{fontSize:11,color:"#999",marginTop:4}}>{calc.tot}/{calc.mx} คะแนน • ประเมินแล้ว {calc.ans} ข้อ{calc.na>0?` • N/A ${calc.na} ข้อ`:""}</div>
        </div>
        {calc.ans>0&&(
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <button onClick={()=>setView(true)}
              style={{padding:"8px 16px",background:"#223549",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:12,whiteSpace:"nowrap"}}>
              👁 ดูผลประเมิน
            </button>
            <button onClick={()=>{setView(true);setTimeout(doPrint,400);}}
              style={{padding:"8px 16px",background:"#00b3c5",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:12,whiteSpace:"nowrap"}}>
              🖨️ Export PDF
            </button>
          </div>
        )}
      </div>

      {/* sticky action bar */}
      {calc.ans>0&&(
        <div id="sticky-bar" style={{position:"sticky",top:0,zIndex:20,background:"white",borderBottom:"1px solid #CCF2F6",padding:"8px 0",marginBottom:8,display:"flex",gap:8,justifyContent:"flex-end"}}>
          <span style={{fontSize:12,color:"#888",alignSelf:"center",marginRight:"auto"}}>
            {calc.ans} ข้อ • {calc.mx>0?`${calc.pct.toFixed(1)}%`:"—"}
            {grade&&<span style={{marginLeft:6,fontWeight:700,color:grade.color}}>{grade.grade} — {grade.label}</span>}
          </span>
          <button onClick={saveToSheet}
            disabled={saveStatus==="saving"}
            style={{padding:"7px 16px",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13,
              background: saveStatus==="ok"?"#2DB87A":saveStatus==="error"?"#ff5c3f":saveStatus==="saving"?"#aaa":"#ffd456",
              color: saveStatus?"white":"#223549"}}>
            {saveStatus==="saving"?"⏳ กำลังบันทึก...":saveStatus==="ok"?"📨 ส่งคำขอแล้ว — ตรวจ Sheet":saveStatus==="error"?"❌ บันทึกไม่สำเร็จ":"💾 บันทึกลง Sheet"}
          </button>
          <button onClick={()=>setView(true)}
            style={{padding:"7px 16px",background:"#223549",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>
            👁 ดูผลประเมิน
          </button>
          <button onClick={()=>{setView(true);setTimeout(doPrint,400);}}
            style={{padding:"7px 16px",background:"#00b3c5",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>
            🖨️ Export PDF
          </button>
        </div>
      )}

      {/* rubric sections */}
      {RUBRIC.map(s=>{
        const cs=calc.cs[s.cat];
        return (
          <div key={s.cat} style={{marginBottom:14,borderRadius:10,overflow:"hidden",border:`1px solid ${s.color}30`}}>
            <div style={{background:s.color,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{color:"white",fontWeight:700,fontSize:13}}>หมวด {s.cat}: {s.title}</div>
                <div style={{color:"rgba(255,255,255,.8)",fontSize:11}}>{s.sub}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:"white",fontWeight:800,fontSize:18,lineHeight:1}}>{cs.mx>0?`${cs.tot}/${cs.mx}`:"—"}</div>
                <div style={{color:"rgba(255,255,255,.8)",fontSize:10}}>{cs.mx>0?`${cs.pct.toFixed(0)}%`:""}</div>
              </div>
            </div>
            {s.items.map((it,ii)=>{
              const score=scores[it.id]; const isOpen=open[it.id];
              const bg2 = score===5?"#2DB87A":score===3?"#F5A623":score===1?"#ff5c3f":score==="na"?"#aaa":"#e8e8e8";
              return (
                <div key={it.id} style={{background:ii%2===0?s.light:"white",borderTop:ii>0?"1px solid #eee":"none",padding:"10px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:12,color:s.textColor}}>{it.id}</span>
                        <span style={{fontSize:13,fontWeight:600}}>{it.title}</span>
                        {it.na&&<span style={{fontSize:10,background:"#eee",color:"#888",padding:"1px 6px",borderRadius:4}}>{it.na}</span>}
                      </div>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                        {[{v:5,e:"🟢",l:"5"},{v:3,e:"🟡",l:"3"},{v:1,e:"🔴",l:"1"},{v:"na",e:"—",l:"N/A"}].map(opt=>{
                          const sel=score===opt.v;
                          const ob=opt.v===5?"#2DB87A":opt.v===3?"#F5A623":opt.v===1?"#ff5c3f":"#888";
                          return <button key={opt.v} onClick={()=>setScores(p=>({...p,[it.id]:sel?undefined:opt.v}))}
                            style={{padding:"4px 10px",borderRadius:6,border:`1.5px solid ${sel?ob:"#ddd"}`,background:sel?ob:"white",color:sel?"white":"#666",cursor:"pointer",fontSize:12,fontWeight:sel?700:400}}>
                            {opt.e} {opt.l}
                          </button>;
                        })}
                        <button onClick={()=>setOpen(p=>({...p,[it.id]:!p[it.id]}))}
                          style={{padding:"4px 8px",borderRadius:6,border:"1px solid #ddd",background:"white",color:"#888",cursor:"pointer",fontSize:11}}>
                          {isOpen?"▲ ซ่อน":"▼ ดูเกณฑ์"}
                        </button>
                      </div>
                      <textarea value={fb[it.id]||""} onChange={e=>setFb(p=>({...p,[it.id]:e.target.value}))}
                        placeholder={`หลักฐาน / ข้อเสนอแนะ — ${it.id} ${it.title}`} rows={2}
                        style={{marginTop:6,width:"100%",border:fb[it.id]?"1.5px solid #00b3c5":"1px solid #e0e0e0",borderRadius:6,padding:"5px 8px",fontSize:11,color:"#333",resize:"vertical",fontFamily:"'Sarabun','Prompt',sans-serif",background:fb[it.id]?"#F8FEFF":"#FAFAFA"}}/>
                    </div>
                    <div style={{width:36,height:36,borderRadius:8,flexShrink:0,background:bg2,color:score!==undefined?"white":"#ccc",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:score==="na"?9:14}}>
                      {score==="na"?"N/A":score??"?"}
                    </div>
                  </div>
                  {isOpen&&(
                    <div style={{marginTop:8,borderRadius:8,overflow:"hidden",border:"1px solid #eee"}}>
                      {[{l:"🟢 5 — โดดเด่น",t:it.s5,bg:"#E8FBF3",c:"#007A60"},{l:"🟡 3 — ทำได้ แต่ยังต้องพัฒนา",t:it.s3,bg:"#FFFBEC",c:"#9A6F00"},{l:"🔴 1 — ปรับปรุงด่วน",t:it.s1,bg:"#FFF5F3",c:"#B32200"}].map(r=>(
                        <div key={r.l} style={{background:r.bg,padding:"6px 10px",borderTop:"1px solid #eee"}}>
                          <div style={{fontSize:10,fontWeight:700,color:r.c,marginBottom:2}}>{r.l}</div>
                          <div style={{fontSize:11,color:"#555"}}>{r.t}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}

      {/* overall feedback */}
      <div style={{background:"white",border:"1px solid #ddd",borderRadius:12,padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>💬 ข้อเสนอแนะภาพรวม</div>
        <textarea value={overall} onChange={e=>setOverall(e.target.value)}
          placeholder="บันทึก feedback รวม จุดเด่น จุดที่ต้องพัฒนา..." rows={4}
          style={{width:"100%",border:overall?"1.5px solid #00b3c5":"1px solid #ddd",borderRadius:8,padding:"8px 10px",fontSize:12,color:"#333",resize:"vertical",fontFamily:"'Sarabun','Prompt',sans-serif",background:overall?"#F8FEFF":"#FAFAFA"}}/>
      </div>

      {calc.ans>0&&(
        <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
          <button onClick={saveToSheet} disabled={saveStatus==="saving"}
            style={{flex:1,minWidth:160,padding:12,border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:14,
              background:saveStatus==="ok"?"#2DB87A":saveStatus==="error"?"#ff5c3f":saveStatus==="saving"?"#ccc":"#ffd456",
              color:saveStatus?"white":"#223549"}}>
            {saveStatus==="saving"?"⏳ กำลังบันทึก...":saveStatus==="ok"?"📨 ส่งคำขอแล้ว — ตรวจ Sheet":saveStatus==="error"?"❌ ลองใหม่อีกครั้ง":"💾 บันทึกลง Google Sheet"}
          </button>
          <button onClick={()=>setView(true)} style={{flex:1,minWidth:140,padding:12,background:"#223549",color:"white",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:14}}>
            👁 ดูผลประเมิน
          </button>
          <button onClick={()=>{setView(true);setTimeout(doPrint,400);}} style={{flex:1,minWidth:140,padding:12,background:"#00b3c5",color:"white",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:14}}>
            🖨️ Export PDF
          </button>
        </div>
      )}

      <div style={{fontSize:10,color:"#bbb",textAlign:"center",marginBottom:16}}>
        Code Genius — Teacher Audit Program • {calc.ans} ข้อที่ประเมิน
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
