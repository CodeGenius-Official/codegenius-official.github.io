const strings={th:{title:'ภารกิจผู้เฝ้าถ้ำ',ice:'ครูเป็นมังกร',missions:'โจทย์เสริม',back:'เปิดสื่อหลัก',intro:'<b>เล่นพร้อมกันทั้งห้อง</b><p>มังกรเริ่มหลับ ตื่นเมื่อค่า ≥ 120 และจำว่าตื่นจนกด A<br>คิดกับเพื่อนก่อน ชูท่าหลับหรือตื่นพร้อมกัน แล้วครูกดเฉลย ไม่แข่งความเร็วและไม่ตัดใครออก</p>',question:'หลังคำสั่งนี้ มังกรจะหลับหรือตื่น?',sleep:'หลับ',awake:'ตื่น',reveal:'เฉลย',next:'ใบถัดไป',reset:'เริ่มใหม่',before:'ก่อนคำสั่ง',after:'หลังคำสั่ง',correct:'ทายถูก! ',wrong:'ลองอธิบายใหม่: ',pick:'เลือกคำตอบก่อนดูเฉลย',pending:'ยังไม่เฉลย',resetWhy:'A รีเซ็ตให้หลับ',wakeWhy:'ค่าแตะหรือเกิน120 จึงตื่น',stayWhy:'มังกรจำว่าตื่น แม้ค่าจะลดลงแล้ว',sleepWhy:'ค่ายังต่ำกว่า120 และมังกรยังไม่เคยตื่น',choose:'เลือกการ์ด',answer:'แนวคำตอบสำหรับครู',note:'ใช้ค่าจำลอง ไม่ใช้ไมโครโฟน ไม่แข่งตะโกน • อายุ7ปีใช้ simulator โดยไม่จับบอร์ด • ภาพนี้เป็นแบบจำลอง ไม่ใช่หลักฐานว่าโค้ดของนักเรียนทำงานแล้ว • ทุกโจทย์ต้องกลับไปทดสอบโปรเจกต์ของตนเอง'},en:{title:'Cave Keepers',ice:'Human Dragon',missions:'Extra missions',back:'Open main lesson',intro:'<b>Play together</b><p>The dragon starts asleep. It wakes at ≥ 120 and stays awake until A resets it.<br>Discuss with a partner, show asleep or awake together, then reveal. No speed race and nobody is eliminated.</p>',question:'After this instruction, is the dragon asleep or awake?',sleep:'Asleep',awake:'Awake',reveal:'Reveal',next:'Next card',reset:'Restart',before:'Before instruction',after:'After instruction',correct:'Correct! ',wrong:'Try explaining again: ',pick:'Choose before revealing',pending:'Not revealed yet',resetWhy:'A resets the dragon to asleep',wakeWhy:'The value reaches or exceeds 120',stayWhy:'The dragon remembers being awake even after the value drops',sleepWhy:'The value is below 120 and the dragon has not woken yet',choose:'Choose a mission',answer:'Teacher answer guide',note:'Simulated values only. No microphone and no shouting contest. Age 7: simulator only, no board handling. This model does not prove student code works. Test every mission in your own project.'}};
const missions={th:[['ตื่นง่าย','เปลี่ยน threshold เป็น60 ในโปรเจกต์ของตนเอง ทายและทดสอบ59 →60 →0 แล้ว reset สลับหน้าที่คนแก้โค้ดและคนทดสอบ คนละหนึ่งรอบ','หลับ →ตื่น →ยังตื่น หลัง reset จึงหลับ เพราะเปลี่ยนแค่ threshold ไม่ได้เปลี่ยนกฎจำสถานะ'],['หลับลึก','เปลี่ยน threshold เป็น180 ทดสอบ179 →180 →0 แล้ว reset เปรียบเทียบกับการ์ดแรก อธิบายว่าอะไรเปลี่ยน อะไรเหมือนเดิม','หลับ →ตื่น →ยังตื่น ค่า180ต้องสูงกว่าค่า60จึงปลุกได้ แต่ทั้งคู่ยังจำสถานะเหมือนกัน'],['นักสืบ threshold','คู่Aเลือก80,120หรือ160แล้วซ่อนโค้ด คู่Bขอทดสอบได้ไม่เกิน4ค่า ต้องresetก่อนทุกคำถาม ทายค่า threshold แล้วเปิดโค้ดพิสูจน์ สลับบทบาท','ลอง120ก่อน: ถ้าหลับคือ160 ถ้าตื่นลอง80หลังreset: ตื่นคือ80 หลับคือ120 การresetทำให้แต่ละการทดลองเริ่มเงื่อนไขเดียวกัน']],en:[['Light sleeper','Change threshold to 60 in your own project. Predict and test 59 →60 →0, then reset. Swap builder and tester roles so each learner has a turn.','Asleep →awake →still awake. Reset returns to asleep. Only the threshold changed, not the memory rule.'],['Deep sleeper','Change threshold to 180. Test 179 →180 →0, then reset. Compare with the first mission. Explain what changed and what stayed the same.','Asleep →awake →still awake. A threshold of 180 needs a larger input than 60; the memory rule is unchanged.'],['Threshold detective','Partner A secretly chooses 80,120 or160. Partner B requests up to 4 test values. Reset before EVERY test. Guess the threshold, reveal the code to verify, then swap roles.','Try 120 first. Asleep means 160. If awake, reset and try 80: awake means 80, asleep means 120. Reset gives each test the same starting state.']]};
let lang='th',mode='ice',i=0,awake=false,shown=false,guess=null;const sequence=[119,120,0,'A',121];const $=id=>document.getElementById(id);function step(state,input){return input==='A'?false:state||input>=120}function render(){let s=strings[lang];document.documentElement.lang=lang;for(let id of ['title','ice','missions','back','question','sleep','awake','reveal','next','reset'])$(id).textContent=s[id];$('lang').textContent=lang==='th'?'EN':'ไทย';$('intro').innerHTML=s.intro;$('note').textContent=s.note;$('game').hidden=mode!=='ice';$('mission').hidden=mode==='ice';$('progress').textContent=`${i+1} / ${sequence.length}`;$('value').textContent=sequence[i];$('state').textContent=`${shown?s.after:s.before}: ${awake?s.awake:s.sleep}`;$('reveal').disabled=shown;$('next').disabled=!shown||i===sequence.length-1;$('sleep').disabled=shown;$('awake').disabled=shown;$('result').textContent=shown?feedback():s.pending;$('chooseLabel').textContent=s.choose;$('answerLabel').textContent=s.answer;let m=missions[lang][+$('choice').value];$('mtitle').textContent=m[0];$('mtext').textContent=m[1];$('answer').textContent=m[2]}
let prior=false;function feedback(){let s=strings[lang],x=sequence[i],reason=x==='A'?s.resetWhy:prior?s.stayWhy:x>=120?s.wakeWhy:s.sleepWhy;return (guess===awake?s.correct:s.wrong)+reason}function restart(){i=0;awake=false;shown=false;guess=null;prior=false;render()}$('sleep').onclick=()=>{guess=false;$('result').textContent=strings[lang].sleep};$('awake').onclick=()=>{guess=true;$('result').textContent=strings[lang].awake};$('reveal').onclick=()=>{if(guess===null){$('result').textContent=strings[lang].pick;return}prior=awake;awake=step(awake,sequence[i]);shown=true;render();$('value').classList.remove('pulse');void $('value').offsetWidth;$('value').classList.add('pulse')};$('next').onclick=()=>{if(!shown||i===sequence.length-1)return;i++;shown=false;guess=null;render()};$('reset').onclick=restart;$('lang').onclick=()=>{lang=lang==='th'?'en':'th';render()};$('ice').onclick=()=>{mode='ice';render()};$('missions').onclick=()=>{mode='missions';render()};$('choice').onchange=()=>{document.querySelector('details').open=false;render()};render();
