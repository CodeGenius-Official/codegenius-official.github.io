right:10px;top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stepDot{border:3px solid var(--line);border-radius:8px;background:white;padding:8px;font-weight:900;text-align:center}.stepDot.on{background:#fff1a8}@keyframes dash{to{stroke-dashoffset:-64}}.teacherPanel details{border:3px solid var(--line);border-radius:8px;background:white;padding:10px}.teacherPanel a{color:#0a6572;font-weight:900}@media(max-width:1100px){header{align-items:flex-start}.logoBlock{width:132px;height:66px}.logoBlock img{width:103px;height:103px}.intro,.quizGrid,.reviewGrid{grid-template-columns:1fr}.choiceGrid,.resultsGrid{grid-template-columns:1fr}.qnav{grid-template-columns:repeat(3,1fr)}.scene{min-height:520px}.svgScene{height:min(70vw,520px);min-height:470px}}@media(max-width:560px){header{gap:10px;padding:8px}.topBtns{width:100%;margin-left:0}.btn{min-height:46px;padding:8px 10px}main{padding:10px}.checkList{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

function openSubmit(){txt('confirmTitle',state.practice?S('ส่งคำตอบรอบฝึก?','Submit practice answers?'):c().confirmTitle);txt('confirmText',state.practice?S('จะดูผลรอบฝึกนี้ คะแนนครั้งแรกยังคงเดิม','See feedback for this practice round. Your first score stays unchanged.'):c().confirmText);if(state.answers.filter(Boolean).length<6){txt('statusBox',c().completeFirst);return}const l=$('confirmList');l.replaceChildren();state.answers.forEach((a,i)=>{const d=document.createElement('div');d.className='checkItem';d.textContent=`${i+1}: ${c().answered}`;l.appendChild(d)});$('submitDialog').showModal()}
function confirmSubmit(){if(state.practice)state.practiceSnapshot=state.answers.slice();if(!state.submitted){state.firstSnapshot=state.answers.slice();state.firstScore=state.firstSnapshot.reduce((n,a,i)=>n+(a===QUESTIONS[i].correct?1:0),0);state.submitted=true}$('submitDialog').close();show('results');renderResults()}
function renderResults(){txt('resultsTitle',state.practice&&state.practiceSnapshot?S('ผลรอบฝึกสำหรับทบทวน','Practice results for review'):c().results);const snap=state.practice&&state.practiceSnapshot?state.practiceSnapshot:(state.firstSnapshot||state.answers), score=state.firstScore ?? snap.reduce((n,a,i)=>n+(a===QUESTIONS[i].correct?1:0),0);txt('scoreTitle',`${c().score}: ${score}/6`+(state.practice&&state.practiceSnapshot?S(' · รอบฝึก: ',' · Practice: ')+snap.reduce((n,a,i)=>n+(a===QUESTIONS[i].correct?1:0),0)+'/6':''));const ps=$('parentSummary');ps.replaceChildren();const p=document.createElement('p');p.textContent=c().parentIntro;ps.appendChild(p);const tiles=$('resultTiles');tiles.replaceChildren();const rec=$('practiceList');rec.replaceChildren();let misses=0;QUESTIONS.forEach((q,i)=>{const good=snap[i]===q.correct;const b=document.createElement('button');b.type='button';b.className='skillCard '+(good?'good':'review');const tag=document.createElement('span');tag.className='pill';tag.textContent=good?c().ok:c().reviewPill;const title=document.createElement('b');title.textContent=qtext(q,'Concept');const detail=document.createElement('span');detail.textContent=`${c().your}: ${snap[i]}. ${opt(q,snap[i])} | ${c().correct}: ${q.correct}. ${opt(q,q.correct)}`;b.append(tag,title,detail);b.addEventListener('click',()=>{state.reviewIndex=i;state.step=0;show('reviewShell');renderReview()});tiles.appendChild(b);if(!good){misses++;const item=document.createElement('div');item.className='practiceItem';item.textContent=qtext(q,'Practice');rec.appendChild(item)}});if(!misses){const item=document.createElement('div');item.className='practiceItem';item.textContent=c().allGood;rec.appendChild(item)}}
function S(th,en){return state.lang==='th'?th:en}function svgEl(tag,attrs,text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));if(text)el.textContent=text;return el}function baseSvg(){return svgEl('svg',{viewBox:'0 0 1000 560',class:'svgScene',role:'img'})}function addCard(svg,x,y,w,h,cls,label,size=25){svg.appendChild(svgEl('rect',{x,y,width:w,height:h,rx:20,class:'svgCard '+cls}));svg.appendChild(svgEl('text',{x:x+w/2,y:y+h/2+8,'text-anchor':'middle','font-size':size},label))}function addText(svg,x,y,label,size=26){svg.appendChild(svgEl('text',{x,y,'text-anchor':'middle','font-size':size},label))}function trail(q,active){const wrap=document.createElement('div');wrap.className='trail';q.steps.forEach((s,i)=>{const d=document.createElement('div');d.className='stepDot '+(i<=active?'on':'');d.textContent=s[state.lang==='th'?0:1];wrap.appendChild(d)});return wrap}
function phone(svg,x,y,w,h,label,cls=''){svg.appendChild(svgEl('rect',{x,y,width:w,height:h,rx:28,class:'svgCard '+cls}));svg.appendChild(svgEl('rect',{x:x+18,y:y+42,width:w-36,height:h-64,rx:14,fill:'#fff',stroke:'#263241','stroke-width':4}));svg.appendChild(svgEl('circle',{cx:x+w/2,cy:y+22,r:7,fill:'#263241'}));svg.appendChild(svgEl('text',{x:x+w/2,y:y+h-18,'text-anchor':'middle','font-size':24},label));}
function paper(svg,x,y,w,h,label,cls='svgSoft',size=26){svg.appendChild(svgEl('rect',{x,y,width:w,height:h,rx:18,class:'svgCard '+cls}));svg.appendChild(svgEl('line',{x1:x+22,y1:y+22,x2:x+w-22,y2:y+22,stroke:'#263241','stroke-width':5,'stroke-linecap':'round'}));svg.appendChild(svgEl('line',{x1:x+22,y1:y+38,x2:x+w-42,y2:y+38,stroke:'#263241','stroke-width':5,'stroke-linecap':'round'}));svg.appendChild(svgEl('text',{x:x+w/2,y:y+h-14,'text-anchor':'middle','font-size':size},label));}

function renderScene(q){const scene=$('scene');scene.replaceChildren();scene.dataset.scene=q.id;const active=state.step;scene.appendChild(trail(q,active));const svg=baseSvg();let aria='';if(q.id==='audience'){const travel=active>0, arrived=active>1;phone(svg,70,145,190,260,S('ลูก้า','Luca'),'svgBlue');paper(svg,100,215,130,95,S('นิทาน','Story'),'svgSoft',22);board(svg,690,100,230,160,S('กล่องครู','Teacher box'),arrived?'svgGood':'');board(svg,690,335,230,150,S('ประกาศกว้าง','Fan-out'),'svgWarn');svg.appendChild(svgEl('line',{x1:260,y1:270,x2:arrived?690:(travel?525:365),y2:arrived?180:(travel?220:255),class:'svgRoute '+(travel?'':'wait')}));svg.appendChild(svgEl('line',{x1:260,y1:290,x2:420,y2:390,class:'svgRoute stop'}));aria=arrived?S('นิทานเดินทางถึงกล่องครู ทางประกาศกว้างถูกหยุดไว้','The story reaches the teacher box while the fan-out route is stopped.'):travel?S('นิทานกำลังเดินทางไปกล่องครู','The story is traveling to the teacher box.'):S('นิทานยังอยู่ในเครื่องของลูก้า','The story is still on Luca’s device.')}if(q.id==='screenshot'){const saved=active>0, deleted=active>1;phone(svg,80,140,205,265,S('โพสต์','Post'),deleted?'svgWarn':'svgBlue');paper(svg,115,220,135,95,S('มงกุฎกระดาษ','Paper crown'),'svgSoft',21);if(deleted){svg.appendChild(svgEl('line',{x1:105,y1:175,x2:260,y2:360,class:'svgRoute stop'}));svg.appendChild(svgEl('line',{x1:260,y1:175,x2:105,y2:360,class:'svgRoute stop'}));}if(saved){phone(svg,465,140,205,265,S('โอมาร์','Omar'),'svgGood');paper(svg,500,220,135,95,S('มงกุฎกระดาษ','Paper crown'),'svgSoft',21);svg.appendChild(svgEl('line',{x1:285,y1:270,x2:465,y2:270,class:'svgRoute'}));}aria=deleted?S('หน้าจอต้นฉบับถูกลบ แต่หน้าจอของโอมาร์ยังมีสำเนา','The original screen is deleted, but Omar’s screen still has a copy.'):saved?S('โอมาร์เซฟสำเนาจากโพสต์','Omar saves a copy from the post.'):S('มีโพสต์ต้นฉบับอยู่หนึ่งใบ','There is one original post.')}if(q.id==='changedConsent'){const asked=active>0, removed=active>1;board(svg,90,110,820,330,S('บอร์ดชมรม','Club board'),'svgSoft');if(!removed){paper(svg,390,230,220,125,S('คลิปเต้น','Dance clip'),'svgPurple',24);}else{paper(svg,390,230,220,125,S('นำออกแล้ว','Removed'),'svgGood',24);}if(asked)paper(svg,115,300,230,95,S('ขอนำออก','Please remove'),'svgWarn',23);svg.appendChild(svgEl('line',{x1:305,y1:345,x2:removed?390:370,y2:292,class:'svgRoute '+(asked?'':'wait')}));aria=removed?S('คลิปถูกถอดออกจากบอร์ดชมรม','The clip is removed from the club board.'):asked?S('มีการ์ดคำขอให้นำคลิปออก','A request card asks for the clip to be removed.'):S('คลิปอยู่บนบอร์ดชมรม','The clip is on the club board.')}if(q.id==='cropAddress'){const moving=active>0, cropped=active>1;phone(svg,80,120,290,310,S('ก่อนแชร์','Before share'),'svgBlue');paper(svg,125,200,150,110,S('การ์ตูน','Comic'),'svgGood',23);paper(svg,moving?455:255,265,120,70,cropped?S('นอกกรอบ','Outside'):S('ป้ายสมมติ','Fictional label'),'svgWarn',18);svg.appendChild(svgEl('rect',{x:cropped?105:(moving?105:105),y:175,width:cropped?190:(moving?250:260),height:185,rx:18,fill:'none',stroke:'#ff6b9a','stroke-width':12}));phone(svg,670,120,240,310,S('ภาพที่แชร์','Shared image'),cropped?'svgGood':'');if(cropped)paper(svg,715,215,150,105,S('การ์ตูน','Comic'),'svgGood',23);svg.appendChild(svgEl('line',{x1:370,y1:275,x2:670,y2:275,class:'svgRoute '+(active?'':'wait')}));aria=cropped?S('ภาพที่แชร์เหลือการ์ตูนและไม่รวมป้ายสมมติ','The shared image keeps the comic and excludes the fictional label.'):moving?S('กรอบครอปกำลังแยกป้ายออกจากภาพ','The crop frame is separating the label from the picture.'):S('ภาพก่อนแชร์มีการ์ตูนและป้ายสมมติ','The pre-share picture has a comic and a fictional label.')}if(q.id==='kindFeedback'){const praised=active>0, asked=active>1;phone(svg,80,145,230,260,S('บอร์ดครู','Teacher board'),'svgBlue');paper(svg,120,230,150,95,S('ลูกบอลเด้ง','Bouncing ball'),'svgSoft',21);if(praised){paper(svg,405,140,285,95,S('ดูมีชีวิตดี','Looks lively'),'svgGood',25);svg.appendChild(svgEl('line',{x1:310,y1:260,x2:405,y2:190,class:'svgRoute'}));}if(asked){paper(svg,575,305,315,100,S('ทำอย่างไร?','How did you make it?'),'svgSoft',25);svg.appendChild(svgEl('line',{x1:545,y1:235,x2:650,y2:305,class:'svgRoute'}));}aria=asked?S('มีคำชมเจาะจงและคำถามต่อยอด','There is specific praise and a follow-up question.'):praised?S('มีคำชมเจาะจงถูกส่งไป','Specific praise is sent.'):S('ยังไม่ได้ส่งคำตอบ','No reply has been sent yet.')}if(q.id==='publicScope'){const asked=active>0, open=active>1;board(svg,90,170,230,170,S('ในห้อง','Class'),'svgGood');board(svg,700,170,230,170,S('เว็บสาธารณะ','Public web'),open?'svgGood':'svgWarn');paper(svg,405,200,230,110,open?S('ได้รับคำตกลง','Agreement received'):(asked?S('รอคำตอบ','Waiting'):S('ถามก่อน','Ask first')),'svgSoft',23);svg.appendChild(svgEl('line',{x1:320,y1:255,x2:405,y2:255,class:'svgRoute wait'}));svg.appendChild(svgEl('line',{x1:635,y1:255,x2:open?700:665,y2:255,class:'svgRoute '+(open?'':'stop')}));aria=open?S('ประตูเว็บสาธารณะเปิดหลังได้รับคำตกลง','The public web gate opens after public agreement is received.'):asked?S('ประตูเว็บยังปิดระหว่างรอคำตอบ','The public web gate remains closed while waiting.'):S('ประตูเว็บสาธารณะยังปิดอยู่','The public web gate remains closed.')}svg.setAttribute('aria-label',aria);scene.setAttribute('aria-label',aria);scene.appendChild(svg);const cap=document.createElement('div');cap.className='sceneCaption';cap.textContent=aria;scene.appendChild(cap)}
function renderReview(){const q=QUESTIONS[state.reviewIndex];txt('sceneLabel',`${qtext(q,'Concept')} • ${q.steps[state.step][state.lang==='th'?0:1]}`);txt('reviewTitle',(state.practice&&state.practiceSnapshot?S('รอบฝึก: ','Practice: '):'')+qtext(q,'Title'));const snap=state.practice&&state.practiceSnapshot?state.practiceSnapshot:(state.firstSnapshot||state.answers);txt('answerText',`${c().your}: ${snap[state.reviewIndex]}. ${opt(q,snap[state.reviewIndex])}
${c().correct}: ${q.correct}. ${opt(q,q.correct)}`);txt('explainText',qtext(q,'Explain'));renderScene(q);$('stepBack').disabled=state.step===0;$('stepNext').textContent=state.step===2?c().restartScene:c().nextStep;$('stepNext').setAttribute('aria-label',state.step===2?c().restartScene:c().nextStep);$('reviewPrev').disabled=state.reviewIndex===0;$('reviewNext').disabled=state.reviewIndex===5;$('reviewPrev').setAttribute('aria-label',c().prevExplain);$('reviewNext').setAttribute('aria-label',c().nextExplain)}
function stepNext(){state.step=state.step<2?state.step+1:0;renderReview()}function stepBack(){if(state.step>0)state.step--;renderReview()}function replay(){state.step=0;renderReview()}function reviewPrev(){if(state.reviewIndex>0){state.reviewIndex--;state.step=0;renderReview()}}function reviewNext(){if(state.reviewIndex<5){state.reviewIndex++;state.step=0;renderReview()}}function practiceAgain(){state.answers=Array(6).fill(null);state.index=0;state.practice=true;state.practiceSnapshot=null;show('quizShell');renderAll()}function resetAll(){state.index=0;state.answers=Array(6).fill(null);state.submitted=false;state.firstScore=null;state.firstSnapshot=null;state.reviewIndex=0;state.step=0;state.practice=false;state.practiceSnapshot=null;['resultTiles','practiceList','scene','choices','qnav','checkList','confirmList'].forEach(id=>$(id).replaceChildren());['scoreTitle','parentSummary','sceneLabel','reviewTitle','answerText','explainText','statusBox'].forEach(id=>txt(id,''));$('scene').removeAttribute('data-scene');$('scene').removeAttribute('aria-label');$('resetDialog').close();show('intro');renderAll()}
$('langBtn').addEventListener('click',()=>{state.lang=state.lang==='th'?'en':'th';applyLang()});$('startBtn').addEventListener('click',()=>{show('quizShell');renderAll()});$('prevBtn').addEventListener('click',prevQ);$('nextBtn').addEventListener('click',nextQ);$('submitBtn').addEventListener('click',openSubmit);$('cancelSubmit').addEventListener('click',()=>$('submitDialog').close());$('confirmSubmit').addEventListener('click',confirmSubmit);$('reviewBtn').addEventListener('click',()=>{state.reviewIndex=0;state.step=0;show('reviewShell');renderReview()});$('practiceBtn').addEventListener('click',practiceAgain);$('stepNext').addEventListener('click',stepNext);$('stepBack').addEventListener('click',stepBack);$('replayBtn').addEventListener('click',replay);$('reviewPrev').addEventListener('click',reviewPrev);$('reviewNext').addEventListener('click',reviewNext);$('backResults').addEventListener('click',()=>{show('results');renderResults()});$('resetBtn').addEventListener('click',()=>$('resetDialog').showModal());$('resetCancel').addEventListener('click',()=>$('resetDialog').close());$('resetConfirm').addEventListener('click',resetAll);document.addEventListener('keydown',ev=>{if(ev.repeat||$('resetDialog').open||$('submitDialog').open||$('quizShell').classList.contains('hidden'))return;const key=ev.key.toUpperCase();if(['A','B','C','D'].includes(key)){state.answers[state.index]=key;if(state.index<5)state.index++;renderAll()}});applyLang();
</script></body></html>
