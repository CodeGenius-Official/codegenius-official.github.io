<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GE Digital Footprint</title><style>body{font:18px/1.6 system-ui,sans-serif;background:#f4f7fb;color:#18304d;margin:0;padding:40px 20px}main{max-width:700px;margin:auto}small{font-weight:700;color:#536783}a{display:block;padding:20px 24px;margin:16px 0;background:white;border:1px solid #d6e0ed;border-radius:16px;color:#174ca4;text-decoration:none}a:hover,a:focus-visible,button:focus-visible{outline:3px solid #72a6ff}h1{line-height:1.2}p{color:#536783}button{float:right;border:1px solid #d6e0ed;border-radius:10px;background:white;padding:10px 16px;font:inherit;cursor:pointer}.detail{display:block;font-size:16px;color:#536783}</style></head><body><main><button id="lang" type="button">English</button><small>CODE GENIUS</small><h1>GE Digital Footprint</h1><p id="intro"></p><nav id="activities"></nav></main><script>
let lang='th';const copy={th:{intro:'เลือกกิจกรรมตามลำดับ หรือเปิดส่วนที่ต้องการทบทวน',nav:'กิจกรรมร่องรอยดิจิทัล',links:[['เรื่องเล่าเปิดคลาส · โพสต์เดียวเดินทางไปไหน?','ชวนทั้งห้องคิดและติดตามเส้นทางของภาพ'],['Part 1 · ภารกิจร่องรอยดิจิทัล','เกมเลือกคำตอบทั้งห้องและคุยเหตุผลร่วมกัน'],['Part 2 · Puzzle Lab','ปริศนาเดี่ยว 4 ด่าน'],['Part 3 · Paper Trail Lab','ควิซท้ายคลาส 6 ข้อ พร้อมเฉลยและสรุปผล']]},en:{intro:'Follow the activities in order, or choose a section to revisit.',nav:'Digital footprint activities',links:[['Opening story · One Post, Many Paths','Explore the journey of a photo together as a class'],['Part 1 · Digital Footprint Quest','A whole-class choice game with discussion'],['Part 2 · Puzzle Lab','Four individual puzzles'],['Part 3 · Paper Trail Lab','A six-question final quiz with explanations and results']]}};function render(){const c=copy[lang];document.documentElement.lang=lang;document.getElementById('intro').textContent=c.intro;const nav=document.getElementById('activities');nav.setAttribute('aria-label',c.nav);nav.replaceChildren();['opening','part1','part2','part3'].forEach((name,i)=>{const a=document.createElement('a');a.href=name+'.html';a.textContent=c.links[i][0];const d=document.createElement('span');d.className='detail';d.textContent=c.links[i][1];a.append(d);nav.append(a)});document.getElementById('lang').textContent=lang==='th'?'English':'ภาษาไทย'}document.getElementById('lang').onclick=()=>{lang=lang==='th'?'en':'th';render()};render();
</script></body></html>
