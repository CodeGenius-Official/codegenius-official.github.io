{th:['01 / เลือกก่อนโพสต์','แชร์ความภูมิใจ','มินเช็กภาพกับผู้ใหญ่: มีแค่เรือ ไม่มีหน้าเพื่อน ชื่อโรงเรียน หรือที่อยู่ แล้วแชร์ให้เพื่อนดู','ต้นฉบับ: ภาพเรือของมิน','ภาพนี้ควรมีอะไร? ไม่ควรมีอะไร?','แชร์ผลงานเป็นเรื่องดีได้! เช็กข้อมูลส่วนตัว และขออนุญาตก่อนโพสต์ภาพของคนอื่น','ชี้สิ่งที่เห็นในภาพ · ประมาณ 50 วินาที','โพสต์ต้นฉบับแสดงเรือกระดาษ ไม่มีข้อมูลส่วนตัว'],en:['01 / CHOOSE BEFORE POSTING','Share something you’re proud of','Min checks the photo with an adult: only the boat, with no friend’s face, school name, or address. Then Min shares it with a friend.','The original: Min’s boat photo','What should be in this photo? What should stay out?','Sharing our creations can be positive! Check for personal details and ask permission before posting pictures of other people.','Point out what is in the picture · About 50 seconds','The original post shows a paper boat with no personal details']},
{th:['02 / จากหนึ่งเป็นสอง','เพื่อนเก็บสำเนา','เพื่อนชอบเรือมาก จึงบันทึกภาพไว้ในเครื่อง ตอนนี้มีต้นฉบับ และมีอีกหนึ่งสำเนา','บันทึกภาพ → เกิดสำเนาใหม่','มีภาพอยู่กี่ที่แล้ว?','ในเรื่องนี้มี 2 ที่: โพสต์ต้นฉบับ และภาพที่เพื่อนบันทึกไว้ การเก็บสำเนาไม่ได้ย้ายต้นฉบับออกไป','ชวนชี้ต้นฉบับกับสำเนา · ประมาณ 50 วินาที','โพสต์ต้นฉบับทางซ้าย และสำเนาของเพื่อนทางขวา'],en:['02 / ONE BECOMES TWO','A friend saves a copy','The friend likes the boat and saves the photo to their device. Now there is an original post and another copy.','Save a picture → make another copy','How many places hold the photo now?','In this story, two places: the original post and the friend’s saved photo. Saving a copy does not move the original away.','Point to the original and the copy · About 50 seconds','The original post on the left and a friend’s saved copy on the right']},
{th:['03 / เดินทางต่อ','สำเนาถูกส่งต่อ','เพื่อนส่งภาพที่บันทึกไว้ให้เพื่อนอีกคน โดยยังไม่ได้ถามมิน สำเนาจึงเดินทางไปถึงคนใหม่','ต้นฉบับ + สำเนา + สำเนาที่ส่งต่อ','ก่อนส่งต่อ เพื่อนควรทำอะไร?','ควรถามมินก่อน และดูว่าภาพเหมาะกับผู้รับหรือไม่ เราไม่ควรคิดว่าเจ้าของยอมให้ส่งต่อเพียงเพราะเราเห็นภาพได้','ชวนพูดประโยคขออนุญาต · ประมาณ 60 วินาที','ต้นฉบับและสำเนาอีกสองภาพ แสดงการส่งต่อ'],en:['03 / ANOTHER STOP','The copy travels on','The friend sends the saved photo to another friend without asking Min first. A copy reaches someone new.','Original + saved copy + shared copy','What should the friend do before forwarding it?','Ask Min first and consider whether the picture is suitable for the recipient. Being able to see a picture does not mean we have permission to forward it.','Practice a sentence that asks permission · About 60 seconds','The original and two copies show the photo being forwarded']},
{th:['04 / หยุดทายก่อนเฉลย','มินลบต้นฉบับ…','มินเปลี่ยนใจและลบโพสต์ต้นฉบับออก แล้วภาพที่เพื่อนบันทึกและส่งต่อไปล่ะ?','ต้นฉบับถูกลบ · ดูสำเนาที่ยังอยู่','ลบต้นฉบับแล้ว สำเนาจะหายด้วยไหม?','สำเนาที่เพื่อนบันทึกแยกไว้อาจยังอยู่ การลบต้นฉบับไม่ได้ลบสำเนาเหล่านั้นให้อัตโนมัติ มินขอให้เพื่อนลบและหยุดส่งต่อได้ ถ้ากังวล ให้ผู้ใหญ่ที่ไว้ใจช่วย','เลือกคำตอบหรือยกมือ แล้วเปิดคำอธิบาย · ประมาณ 90 วินาที','ต้นฉบับจางลงและถูกกากบาท แต่สำเนาสองภาพยังอยู่'],en:['04 / PREDICT BEFORE THE REVEAL','Min deletes the original…','Min changes their mind and deletes the original post. What about the photo the friends saved and forwarded?','Original deleted · Notice the remaining copies','If the original is deleted, do the copies disappear too?','Separately saved copies may still remain. Deleting the original does not automatically erase those copies. Min can ask friends to delete them and stop forwarding. A trusted adult can help if Min is worried.','Choose an answer or raise hands, then reveal · About 90 seconds','The original fades and is crossed out, while two copies remain']},
{th:['05 / เรื่องต่อไปอยู่ที่เรา','ฝากรอยดี ๆ ไว้','รอยดิจิทัลเกิดจากสิ่งที่เราทำออนไลน์ เราแชร์ผลงานดี ๆ และดูแลกันได้ ด้วยการหยุดคิดก่อนโพสต์','เราเลือกการกระทำครั้งต่อไปได้','ครั้งต่อไป ก่อนโพสต์ เราจะเช็กอะไร?','เช็กข้อมูลส่วนตัว ผู้ชม และการอนุญาต ไม่ใช่ทุกโพสต์จะอยู่ตลอดไป แต่สำเนาอาจอยู่นอกการควบคุมของเรา เริ่มฝึกเลือกด้วยกันใน Part 1','ให้เด็กบอกสิ่งที่จะเช็กคนละ 1 อย่าง · ประมาณ 60 วินาที','สามขั้นตอน: ขออนุญาต เลือกข้อมูลปลอดภัย และคิดก่อนส่งต่อ'],en:['05 / OUR NEXT CHOICE','Leave a positive trail','Our actions online leave digital traces. We can share good creations and care for each other by thinking before we post.','We can choose what we do next','What will you check before your next post?','Check personal details, the audience, and permission. Not every post lasts forever, but copies may be outside our control. Let’s practice making choices in Part 1.','Invite each child to name one thing to check · About 60 seconds','Three steps: ask permission, choose safe details, and think before forwarding']}
];
let phase=0,inspected=-1;
let lang='th',scene=0,revealed=false,selected=-1,paused=false,reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const art=document.querySelector('.original svg').outerHTML;
document.querySelector('.copy.one').innerHTML=art+'<span data-label="copy1"></span>';
document.querySelector('.copy.two').innerHTML=art+'<span data-label="copy2"></span>';
const journey={
th:{actions:['ออกเดินทางกับมิน','แชร์ภาพเรือ','บันทึกสำเนาไว้','ส่งสำเนาต่อ','ลบโพสต์ต้นฉบับ','พร้อมสร้างรอยดี ๆ'],done:['เริ่มแล้ว','แชร์แล้ว','เก็บสำเนาแล้ว','ส่งสำเนาแล้ว','ลบต้นฉบับแล้ว','พร้อมแล้ว!'],replay:'เล่นฉากนี้อีกครั้ง',counts:'ภาพที่ยังอยู่ในเรื่อง',before:['ภาพเดียว… จะเดินทางไปไหน?','ตรวจภาพเรียบร้อย · พร้อมแชร์','เพื่อนเห็นภาพ · ยังไม่ได้บันทึก','เพื่อนมีสำเนา · จะเกิดอะไรเมื่อส่งต่อ?','ทายก่อน · แล้วลองลบต้นฉบับ','การกระทำครั้งต่อไป เราเลือกได้'],after:['เริ่มเดินทาง','ภาพผลงานของมินถูกแชร์แล้ว','หนึ่งภาพ → สองที่','สำเนาเดินทางไปถึงคนใหม่','ต้นฉบับหายไป · ลองสำรวจสำเนา','แชร์ผลงานดี ๆ พร้อมดูแลกัน'],hint:'กดปุ่มสีเขียวเพื่อให้เรื่องเดินต่อ',explore:'แตะชื่อภาพด้านบน เพื่อสำรวจว่าอยู่ที่ไหน',nodes:['ต้นฉบับ','สำเนาเพื่อนคนที่ 1','สำเนาเพื่อนคนที่ 2'],details:['ภาพนี้คือโพสต์ที่มินเป็นเจ้าของ','เพื่อนบันทึกภาพแยกไว้ในเครื่อง ไม่ใช่แค่ลิงก์ไปยังโพสต์','เพื่อนอีกคนได้รับไฟล์ภาพที่ส่งต่อมา จึงมีสำเนาแยกอีกภาพ'],deleted:'มินลบโพสต์นี้แล้ว แต่ไม่ได้ลบไฟล์ในเครื่องของเพื่อนให้อัตโนมัติ',ready:'เลือกผู้ชม เช็กข้อมูล และขออนุญาต ก่อนแชร์ครั้งต่อไป',wait:'ลองการกระทำในฉากก่อน แล้วค่อยไปต่อ',deleteFirst:'ทายคำตอบ แล้วกดลบต้นฉบับก่อนเปิดคำอธิบาย'},
en:{actions:['Begin Min’s journey','Share the boat photo','Save a separate copy','Forward the saved copy','Delete the original post','Ready to leave a good trail'],done:['Started','Photo shared','Copy saved','Copy forwarded','Original deleted','Ready!'],replay:'Replay this scene',counts:'pictures remaining in this story',before:['One photo… where can it go?','Photo checked · Ready to share','The friend can see it · Not saved yet','One saved copy · What happens next?','Predict first · Then try deleting','We choose our next action'],after:['The journey begins','Min’s creation has been shared','One picture → two places','A copy reaches someone new','Original gone · Explore the copies','Share good creations and care for others'],hint:'Press the green button to move the story forward',explore:'Tap a picture’s name above to discover where it is',nodes:['Original','Friend 1’s copy','Friend 2’s copy'],details:['This is the original post owned by Min','The friend saved a separate image file, not just a link to the post','Another friend received the forwarded image file, creating another separate copy'],deleted:'Min deleted this post. That does not automatically delete the files on friends’ devices',ready:'Choose your audience, check details, and ask permission before sharing',wait:'Try this scene’s action before continuing',deleteFirst:'Make a prediction, then delete the original before revealing'}
};
const anticipation={th:{1:'มินเช็กภาพกับผู้ใหญ่แล้ว มีแค่เรือ ไม่มีหน้าเพื่อน ชื่อโรงเรียน หรือที่อยู่ พร้อมแชร์ความภูมิใจหรือยัง?',2:'เพื่อนชอบเรือมาก และอยากเก็บภาพไว้ ถ้าบันทึกภาพ จะเกิดอะไรขึ้น?',3:'เพื่อนมีสำเนาในเครื่อง และกำลังจะส่งต่อโดยยังไม่ได้ถามมิน ลองติดตามเส้นทางของภาพกัน',4:'มินเปลี่ยนใจและกำลังจะลบโพสต์ต้นฉบับ ภาพที่เพื่อนบันทึกและส่งต่อจะเป็นอย่างไร?'},en:{1:'Min checked the photo with an adult: only the boat, no friend’s face, school name, or address. Ready to share?',2:'The friend loves the boat and wants to keep the photo. What will happen when they save it?',3:'The friend has a saved copy and is about to forward it without asking Min. Let’s follow its path.',4:'Min has changed their mind and is about to delete the original post. What will happen to the photos the friends saved and forwarded?'}};
function visualScene(){if(scene===0)return 0;if(scene===1)return phase?1:0;if(scene===2)return phase?2:1;if(scene===3)return phase?3:2;if(scene===4)return phase?4:3;return 5}
function render(){const u=ui[lang],j=journey[lang],s=scenes[scene][lang],v=visualScene();document.documentElement.lang=lang;document.title=lang==='th'?'โพสต์เดียวเดินทางไปไหน? · GE Digital Footprint':'One Post, Many Paths · GE Digital Footprint';for(const k of ['series','pace','qhead','home','restart','back'])$(k).textContent=u[k];$('chapter').textContent=u.chapter+' '+(scene+1)+' / '+scenes.length;['tag','title','body','bubble','question','answer','teacher'].forEach((id,i)=>$(id).textContent=s[i]);if(!phase&&anticipation[lang][scene])$('body').textContent=anticipation[lang][scene];$('stage').dataset.scene=v;$('stage').classList.toggle('acted',phase===1);$('bubble').textContent=(phase?j.after:j.before)[scene];$('stage').setAttribute('aria-label',scenes[v][lang][7]);document.querySelectorAll('[data-label]').forEach(el=>el.textContent=el.dataset.label==='original'&&(scene===0||(scene===1&&!phase))?(lang==='th'?'ภาพของมิน':'Min’s photo'):u[el.dataset.label]);u.v.forEach((v,i)=>$('v'+(i+1)).textContent=v);$('lang').textContent=lang==='th'?'English':'ภาษาไทย';$('pause').textContent=paused?u.resume:u.pause;$('motion').textContent=reduced?u.fullMotion:u.motion;document.body.classList.toggle('paused',paused);document.body.classList.toggle('reduced',reduced);document.body.classList.toggle('motion-override',!reduced);$('back').disabled=scene===0;$('next').textContent=scene===5?u.finish:u.next;$('next').disabled=scene>0&&!phase;$('next').title=scene>0&&!phase?j.wait:'';$('reveal').textContent=revealed?u.hide:u.reveal;$('reveal').disabled=scene===4&&!phase;$('reveal').title=scene===4&&!phase?j.deleteFirst:'';$('answer').hidden=!revealed;document.querySelector('.progress').innerHTML=scenes.map((_,i)=>'<span class="'+(i<=scene?'done':'')+'"></span>').join('');$('choices').replaceChildren();if(scene===4)u.choices.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=String.fromCharCode(65+i)+' · '+c;b.setAttribute('aria-pressed',String(selected===i));b.onclick=()=>{selected=i;Array.from($('choices').children).forEach((button,j)=>button.setAttribute('aria-pressed',String(j===i)))};$('choices').append(b)});$('action').textContent=(phase?j.done:j.actions)[scene];$('action').disabled=phase===1;$('replay').textContent=j.replay;$('replay').disabled=!phase;$('count').textContent=String([1,1,2,3,2,0][v]);$('countlabel').textContent=j.counts;document.querySelector('.counter').hidden=scene===5;$('nodes').hidden=scene===0||scene===5;const visible=v>=3?3:v===2?2:1;for(let n=0;n<3;n++){const b=$('node'+n);b.textContent=n===0&&scene===1&&!phase?(lang==='th'?'ภาพของมิน':'Min’s photo'):j.nodes[n];b.hidden=n>=visible;b.setAttribute('aria-pressed',String(inspected===n));}paintInspect();}
function paintInspect(){const j=journey[lang];['.original','.copy.one','.copy.two'].forEach((sel,n)=>document.querySelector(sel).classList.toggle('inspected',inspected===n));$('inspect').textContent=inspected>=0?(scene===1&&!phase&&inspected===0?(lang==='th'?'ภาพผลงานของมิน ตรวจแล้วและพร้อมแชร์ แต่ยังไม่ได้โพสต์':'Min’s creation photo is checked and ready to share, but not posted yet'):scene===4&&phase&&inspected===0?j.deleted:j.details[inspected]):scene===5?(phase?j.ready:j.hint):phase?j.after[scene]+'. '+j.explore:j.hint;}
function go(n){scene=Math.max(0,Math.min(5,n));phase=0;inspected=-1;revealed=false;selected=-1;render();$('title').focus()}
$('lang').onclick=()=>{lang=lang==='th'?'en':'th';render()};$('motion').onclick=()=>{reduced=!reduced;render()};$('pause').onclick=()=>{paused=!paused;render()};$('reveal').onclick=()=>{if(scene===4&&!phase)return;revealed=!revealed;render()};$('next').onclick=()=>{if(scene>0&&!phase)return;if(scene===5)location.href='part1.html';else go(scene+1)};$('back').onclick=()=>go(scene-1);$('restart').onclick=()=>{paused=false;go(0)};
$('action').onclick=()=>{if(phase)return;if(scene===0){go(1);return}phase=1;inspected=-1;render();$('inspect').focus({preventScroll:true})};$('inspect').tabIndex=-1;$('replay').onclick=()=>{phase=0;inspected=-1;revealed=false;selected=-1;render();$('action').focus({preventScroll:true})};for(let n=0;n<3;n++)$('node'+n).onclick=()=>{inspected=n;for(let k=0;k<3;k++)$('node'+k).setAttribute('aria-pressed',String(k===n));paintInspect()};
render();
