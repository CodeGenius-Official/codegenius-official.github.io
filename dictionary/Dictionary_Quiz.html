an the purpose."},{"th":"key \"purpose\" ตรงกับข้อมูลจุดประสงค์การมาเยือน","en":"The \"purpose\" key matches the purpose-of-visit field."},{"th":"key \"planet\" อ่านดาวบ้านเกิด ไม่ใช่จุดประสงค์","en":"The \"planet\" key reads the home planet, rather than the purpose."}],"prompt":{"th":"ข้อใดอ่านจุดประสงค์การมาเยือนจาก passport","en":"Which lookup reads the purpose of the visit from passport?"},"options":{"th":["passport[\"name\"]","passport[\"purpose\"]","passport[\"planet\"]"],"en":["passport[\"name\"]","passport[\"purpose\"]","passport[\"planet\"]"]},"explanation":{"th":"key \"purpose\" เก็บจุดประสงค์ ส่วน \"name\" เก็บชื่อ และ \"planet\" เก็บดาวบ้านเกิด","en":"The \"purpose\" key stores the purpose; \"name\" stores the name and \"planet\" the home planet."}},{"number":5,"label":{"th":"แปลงหน่วยอายุ","en":"Convert the age"},"correct":0,"scene":{"kind":"formula","planet":"Mercury","age":40,"days":88},"why":[{"th":"คูณด้วยวันต่อปีดาวเพื่อได้วันโลก แล้วหาร 365 เพื่อได้ปีโลก","en":"Multiply by days per planet year to get Earth days, then divide by 365 to get Earth years."},{"th":"สูตรนี้สลับจำนวนวันของดาวกับ 365 ลองตามหน่วยจากปีดาวไปวันโลกก่อน","en":"This reverses the planet’s day count and 365. Trace planet years to Earth days first."},{"th":"การหารด้วย year_days ยังไม่ได้เปลี่ยนช่วงชีวิตเป็นจำนวนวันโลก และยังขาดการหาร 365","en":"Dividing by year_days does not convert the lifetime to Earth days; the division by 365 is also missing."}],"prompt":{"th":"สูตรใดแปลงอายุปีดาวบ้านเกิดเป็นอายุปีโลก","en":"Which formula converts home-planet age to Earth age?"},"options":{"th":["alien_age * year_days / 365","alien_age * 365 / year_days","alien_age / year_days"],"en":["alien_age * year_days / 365","alien_age * 365 / year_days","alien_age / year_days"]},"explanation":{"th":"คูณอายุปีดาวด้วยวันโลกต่อปีดาวก่อน แล้วหารด้วย 365 เพื่อเปลี่ยนวันโลกเป็นปีโลก","en":"Multiply planet years by Earth days per planet year, then divide by 365 to get Earth years."}},{"number":6,"label":{"th":"หน่วยของคำตอบ","en":"Name the unit"},"correct":2,"scene":{"kind":"unit","planet":"Mercury","age":40,"days":88},"why":[{"th":"3520 คือผลระหว่างทางในหน่วยวันโลก ส่วน 9.64 คือผลหลังหาร 365","en":"3520 is the intermediate result in Earth days; 9.64 is the result after dividing by 365."},{"th":"40 คืออายุต้นทางในหน่วยปีดาวพุธ ส่วน 9.64 เป็นอายุที่แปลงแล้ว","en":"40 is the original age in Mercury years; 9.64 is the converted age."},{"th":"หลังเปลี่ยนวันโลกเป็นปีโลกด้วยการหาร 365 ผล 9.64 จึงมีหน่วยปีโลก","en":"After dividing the Earth-day count by 365, the result 9.64 is in Earth years."}],"prompt":{"th":"Zippy อายุ 40 ปีดาวพุธ โปรแกรมแสดง 9.64 หลังแปลงอายุ ค่านี้มีหน่วยใด","en":"Zippy is 40 Mercury years old. The converted age is 9.64. What is its unit?"},"options":{"th":["วันโลก","ปีดาวพุธ","ปีโลก"],"en":["Earth days","Mercury years","Earth years"]},"explanation":{"th":"40 * 88 = 3520 วันโลก และ 3520 / 365 ≈ 9.64 ปีโลก","en":"40 * 88 = 3520 Earth days, and 3520 / 365 ≈ 9.64 Earth years."}}]},{"session":2,"metadata":{"lessonCode":"GI-CA-PY-05","version":"1.0","date":"03.10.2026","author":"Naphop","reviewer":"Ubolwan"},"inner":[["Mercury",88],["Venus",225],["Earth",365],["Mars",687]],"outer":[["Jupiter",4333],["Saturn",10756],["Uranus",30687],["Neptune",60190]],"intro":{"th":"เปิดงาน Session 1 แล้ว Save As เป็น my_session_2.py ใช้ข้อมูลนี้เพิ่มดาวใหม่ 4 ดวงใน planets ด้วยตนเอง โดยเก็บดาวเดิมไว้ แล้วรันโปรแกรมก่อนตอบคำถาม","en":"Open your Session 1 work and Save As my_session_2.py. Use this data to add the four new planets to planets independently. Keep the original planets, then run your program."},"questions":[{"number":1,"label":{"th":"key ใหม่","en":"A new key"},"correct":2,"scene":{"kind":"pair","planet":"Jupiter","days":4333,"new":true},"why":[{"th":"4333 เป็น value จำนวนวันโลกต่อปีดาว ไม่ใช่ key ใหม่","en":"4333 is the value in Earth days per planet year, rather than the new key."},{"th":"planets เป็น Dictionary เดิมที่จะรับคู่ข้อมูลใหม่","en":"planets is the existing Dictionary that receives the new pair."},{"th":"\"Jupiter\" เป็นชื่อดาวที่ใช้เป็น key ใหม่เพื่อค้น value 4333","en":"\"Jupiter\" is the new planet-name key used to find the value 4333."}],"prompt":{"th":"เมื่อต้องการเพิ่ม Jupiter คู่กับ 4333 ส่วนใดเป็น key ใหม่","en":"When adding Jupiter paired with 4333, which is the new key?"},"options":{"th":["4333","planets","\"Jupiter\""],"en":["4333","planets","\"Jupiter\""]},"explanation":{"th":"\"Jupiter\" เป็นชื่อดาวและ key ใหม่ ส่วน 4333 เป็น value ใน Dictionary planets เดิม","en":"\"Jupiter\" is the new planet-name key; 4333 is its value in the existing planets Dictionary."}},{"number":2,"label":{"th":"เพิ่มแล้วเก็บเดิม","en":"Extend and preserve"},"correct":0,"scene":{"kind":"extend"},"why":[{"th":"เพิ่มสี่คู่ใหม่และรักษาทั้ง key และ value ของสี่คู่เดิม จึงได้แปดดาว","en":"Add four new pairs and preserve both keys and values of the original four, giving eight planets."},{"th":"ถ้าเหลือเฉพาะสี่ดาวใหม่ โปรแกรมจะค้นดาวชั้นในเดิมไม่ได้","en":"With only the four new planets, the program could no longer look up the original inner planets."},{"th":"ใช้ key เดิมแล้วแทน value จะเปลี่ยนข้อมูลเดิม แทนที่จะเพิ่มดาวใหม่","en":"Replacing values under the original keys changes the old data instead of adding new planets."}],"prompt":{"th":"หลังเพิ่มดาวชั้นนอกครบแล้ว planets ควรมีข้อมูลแบบใด","en":"After adding all outer planets, what should planets contain?"},"options":{"th":["ดาวทั้ง 8 ดวง โดยเก็บค่าเดิมของ 4 ดวงแรกไว้","เฉพาะดาวใหม่ 4 ดวง","ดาวเดิม 4 ดวง แต่เปลี่ยนเป็นค่าของดาวใหม่"],"en":["All 8 planets, with the original 4 values preserved","Only the 4 new planets","The original 4 planets with the new planets’ values"]},"explanation":{"th":"การเพิ่มข้อมูลต้องเก็บ Mercury 88, Venus 225, Earth 365 และ Mars 687 ไว้ด้วย","en":"Adding data must preserve Mercury 88, Venus 225, Earth 365 and Mars 687."}},{"number":3,"label":{"th":"อ่านดาวใหม่","en":"Read a new planet"},"correct":1,"scene":{"kind":"lookup","planet":"Saturn","days":10756,"variable":false},"why":[{"th":"\"Saturn\" เป็น key ที่ส่งให้ lookup ส่วนค่าที่อ่านได้คือจำนวนวัน","en":"\"Saturn\" is the key passed to the lookup; the returned value is the day count."},{"th":"คู่ \"Saturn\": 10756 จึงให้ value 10756 เมื่ออ่านด้วย key \"Saturn\"","en":"The pair \"Saturn\": 10756 returns the value 10756 when read using \"Saturn\"."},{"th":"365 เป็นจำนวนวันต่อปีโลก แต่โจทย์กำลังอ่าน key \"Saturn\"","en":"365 is the day count for Earth, but this question reads the \"Saturn\" key."}],"prompt":{"th":"เมื่อเพิ่ม Saturn แล้ว planets[\"Saturn\"] อ่านค่าใด","en":"After adding Saturn, what does planets[\"Saturn\"] return?"},"options":{"th":["\"Saturn\"","10756","365"],"en":["\"Saturn\"","10756","365"]},"explanation":{"th":"การอ่านด้วย key \"Saturn\" ให้ value 10756 วันโลกต่อ 1 ปีดาวเสาร์","en":"The key \"Saturn\" retrieves 10756 Earth days per Saturn year."}},{"number":4,"label":{"th":"ฟังก์ชันเดิม","en":"The same function"},"correct":0,"scene":{"kind":"formula","planet":"Saturn","age":1,"days":10756},"why":[{"th":"ส่ง year_days จาก key ของดาวนั้นให้ฟังก์ชันเดิม แล้วใช้สูตรเดิม","en":"Pass the selected planet’s year_days to the existing function and reuse the same formula."},{"th":"ดาวมีความยาวปีต่างกัน ใช้ 365 ทุกดาวจะทำให้หนึ่งปีดาวทุกดวงกลายเป็นหนึ่งปีโลก","en":"Planet-year lengths differ. Using 365 for every planet would make every planet year equal to one Earth year."},{"th":"คืน alien_age ตรง ๆ ยังเป็นหน่วยปีดาวบ้านเกิด ไม่ได้แปลงเป็นปีโลก","en":"Returning alien_age directly leaves it in home-planet years without converting it to Earth years."}],"prompt":{"th":"calculate_earth_age ควรคำนวณอายุของดาวใหม่อย่างไร","en":"How should calculate_earth_age calculate ages for the new planets?"},"options":{"th":["ใช้สูตรเดิมกับ year_days ที่อ่านจากดาวนั้น","ใช้ 365 เป็น year_days ของทุกดาว","คืนค่า alien_age โดยไม่แปลงอายุ"],"en":["Reuse the formula with year_days found in planets","Use 365 as year_days for every planet","Return alien_age without converting it"]},"explanation":{"th":"ใช้ฟังก์ชัน calculate_earth_age เดิมและสูตรเดิม เปลี่ยนเฉพาะ year_days ตาม key ที่เลือก","en":"Reuse calculate_earth_age and its formula; year_days comes from the selected key."}},{"number":5,"label":{"th":"เทียบปีดาว","en":"Compare planet years"},"correct":2,"scene":{"kind":"compare"},"why":[{"th":"คงอายุไว้ที่ 1 และดูจำนวนวันต่อปี: Jupiter มีวันมากกว่า Mercury","en":"Keep the age at 1 and compare days per year: Jupiter has more days than Mercury."},{"th":"อายุต้นทางเท่ากัน แต่ year_days ต่างกัน ผลในหน่วยปีโลกจึงต่างกัน","en":"The input age is equal, but year_days differs, so the results in Earth years differ."},{"th":"4333 มากกว่า 88 เมื่อคูณอายุเดียวกันและหาร 365 เหมือนกัน อายุปีโลกจึงมากขึ้น","en":"4333 is greater than 88. With the same input age and divisor 365, the Earth age is larger."}],"prompt":{"th":"เมื่อใช้อายุ 1 ปีของดาวเท่ากัน เปลี่ยน Mercury เป็น Jupiter อายุปีโลกจะเป็นอย่างไร","en":"At the same age of 1 home-planet year, changing Mercury to Jupiter makes Earth age…"},"options":{"th":["น้อยลง","เท่าเดิม","มากขึ้น"],"en":["Smaller","Unchanged","Larger"]},"explanation":{"th":"Jupiter มี 4333 วันโลกต่อปี มากกว่า Mercury ที่มี 88 วันโลก จึงได้อายุปีโลกมากขึ้น","en":"Jupiter has 4333 Earth days per year versus Mercury’s 88, so the Earth age is larger."}},{"number":6,"label":{"th":"แยก Dictionary","en":"Which Dictionary?"},"correct":1,"scene":{"kind":"passport","name":"Ringo","planet":"Saturn","age":0.4,"days":10756,"field":"planet","purpose":"Study Earth's butterflies"},"why":[{"th":"10756 อ่านจาก planets[\"Saturn\"] ไม่ใช่จากช่อง planet ใน passport","en":"10756 comes from planets[\"Saturn\"], rather than the planet field in passport."},{"th":"passport[\"planet\"] อ่านค่าช่องดาวบ้านเกิด จึงได้ข้อความ \"Saturn\"","en":"passport[\"planet\"] reads the home-planet field and returns the text \"Saturn\"."},{"th":"0.4 เป็นอายุปีดาวในช่อง alien_age ไม่ใช่ค่าของ key \"planet\"","en":"0.4 is the home-planet age in alien_age, rather than the value under \"planet\"."}],"prompt":{"th":"passport ของ Ringo เก็บ \"Saturn\" ในช่อง planet แล้ว passport[\"planet\"] อ่านค่าใด","en":"Ringo’s passport stores \"Saturn\" in the planet field. What does passport[\"planet\"] return?"},"options":{"th":["10756","\"Saturn\"","0.4"],"en":["10756","\"Saturn\"","0.4"]},"explanation":{"th":"passport[\"planet\"] อ่านดาวบ้านเกิด \"Saturn\" ส่วน planets[\"Saturn\"] อ่านความยาวปี 10756","en":"passport[\"planet\"] reads the home planet \"Saturn\"; planets[\"Saturn\"] reads the year length 10756."}}]}]}</script>
<script>(() => {
  'use strict';
  const bundle = JSON.parse(document.getElementById('quiz-data').textContent);
  let config = bundle.sessions[0];
  const freshQuestions = (source=config) => source.questions.map(() => ({choice:null, revealed:false, step:0, added:0}));
  const cache = Object.fromEntries(bundle.sessions.map(source => [source.session,{current:0,questions:freshQuestions(source)}]));
  const state = {lang:'th',view:'menu',activeSession:1,current:0,questions:cache[1].questions};
  const el = id => document.getElementById(id);
  const h = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const t = (th, en) => state.lang === 'th' ? th : en;
  const local = value => value[state.lang];
  const letter = index => 'ABC'[index];
  const two = value => Number.isFinite(value) ? value.toFixed(2) : '—';
  function calculate(age, yearDays) {
    if (typeof age !== 'number' || typeof yearDays !== 'number' || !Number.isFinite(age) || !Number.isFinite(yearDays) || age < 0 || yearDays <= 0) return null;
    const days = age * yearDays, years = days / 365;
    return Number.isFinite(days) && Number.isFinite(years) ? {days, years} : null;
  }
  function planetSymbol(name) {
    const colors = {Mercury:'#a8b3c7',Venus:'#efb485',Earth:'#66b7a3',Mars:'#da8275',Jupiter:'#ddaf68',Saturn:'#baa0d5',Uranus:'#85c5d6',Neptune:'#758acd'};
    return `<svg class="planet-symbol" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="${colors[name] || '#a8b3c7'}"/><path d="M8 16 Q20 10 32 17 M7 23 Q20 29 32 23" stroke="#ffffff80" stroke-width="3" fill="none"/>${name === 'Saturn' ? '<ellipse cx="20" cy="20" rx="19" ry="5" fill="none" stroke="#756093" stroke-width="2" transform="rotate(-22 20 20)"/>' : ''}</svg>`;
  }
  const motionQuery=typeof window.matchMedia==='function'?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
  let reducedMotion=!!(motionQuery&&motionQuery.matches);
  const playback={running:false,animated:false,frame:null,token:0,last:null,elapsed:0,duration:2600,advance:true,inserted:-1};
  const activeDemo=()=>state.view==='session'&&state.questions[state.current].revealed&&!el('resetDialog').open&&!document.hidden;
  function counters(progress) {
    const demo=el('visualDemo');if(!demo)return;
    demo.querySelectorAll('[data-count-target]').forEach(node=>{
      const target=Number(node.dataset.countTarget),digits=Number(node.dataset.decimals||0);
      node.textContent=(target*Math.max(0,Math.min(1,progress))).toFixed(digits);
    });
    demo.querySelectorAll('[data-equation-symbol]').forEach(node=>{node.textContent=progress<1?'…':node.dataset.equationSymbol;});
  }
  function syncPlaybackUI() {
    const demo=el('visualDemo'),button=el('playDemo');if(!demo||!button)return;
    demo.setAttribute('data-animated',String(playback.animated&&!reducedMotion));
    demo.setAttribute('data-running',String(playback.running&&!reducedMotion));
    button.disabled=reducedMotion;
    button.setAttribute('aria-pressed',String(playback.running));
    button.textContent=reducedMotion?t('โหมดทีละขั้น','Step mode'):playback.running?t('Ⅱ หยุดชั่วคราว','Ⅱ Pause'):playback.animated?t('▶ เล่นต่อ','▶ Resume'):t('▶ เล่นการสาธิต','▶ Play demo');
    el('playbackStatus').textContent=reducedMotion?t('แตะข้อมูลหรือใช้ปุ่มทีละขั้นได้ครบทุกแนวคิด','Tap the data or use the step buttons for the complete explanation.'):playback.running?t('กำลังแสดงเหตุ → ผล','Showing cause → result'):playback.animated?t('หยุดไว้ที่จังหวะนี้ กดเล่นต่อได้','Paused here. Press Resume to continue.'):t('แตะข้อมูลเพื่อทดลอง หรือกดเล่น','Tap the data to try it, or press Play.');
  }
  function stopPlayback() {
    if(playback.frame!==null)window.cancelAnimationFrame(playback.frame);
    playback.frame=null;playback.token++;playback.running=false;playback.animated=false;playback.last=null;playback.elapsed=0;playback.inserted=-1;
    counters(1);syncPlaybackUI();
  }
  function pausePlayback() {
    if(!playback.running)return;
    if(playback.frame!==null)window.cancelAnimationFrame(playback.frame);
    playback.frame=null;playback.token++;playback.running=false;playback.last=null;syncPlaybackUI();
  }
  function refreshPlaybackCard() {
    const focused=document.activeElement,restore=focused&&el('stationCard').contains(focused),id=focused&&focused.id;
    renderCard();
    if(restore){const target=id&&el(id)||el('playDemo');if(target)target.focus();}
  }
  function queuePlayback() {
    const token=playback.token,session=state.activeSession,question=state.current,lang=state.lang;
    playback.frame=window.requestAnimationFrame(now=>{
      if(token!==playback.token)return;
      playback.frame=null;
      if(!playback.running||!activeDemo()||reducedMotion||session!==state.activeSession||question!==state.current||lang!==state.lang){stopPlayback();return;}
      if(playback.last!==null)playback.elapsed+=Math.max(0,now-playback.last);
      playback.last=now;
      const qs=state.questions[state.current],scene=config.questions[state.current].scene;
      if(playback.advance&&scene.kind==='extend'&&qs.step===1){
        const count=Math.min(4,Math.floor(playback.elapsed/500));
        const added=qs.added|((1<<count)-1);
        if(added!==qs.added){playback.inserted=Math.max(0,count-1);qs.added=added;refreshPlaybackCard();}
      }
      counters(playback.elapsed/playback.duration);
      if(playback.elapsed>=playback.duration){
        if(playback.advance&&qs.step<2){
          qs.step++;if(scene.kind==='extend'&&qs.step===2)qs.added=15;
          playback.elapsed=0;playback.inserted=-1;refreshPlaybackCard();counters(0);
        }else{stopPlayback();return;}
      }
      queuePlayback();
    });
  }
  function beginPlayback(advance=true) {
    if(!activeDemo()||reducedMotion)return;
    playback.running=true;playback.animated=true;playback.last=null;playback.advance=advance;playback.duration=advance?2600:700;playback.token++;
    syncPlaybackUI();counters(playback.elapsed/playback.duration);queuePlayback();
  }
  function playDemo() {
    if(!activeDemo()||reducedMotion)return;
    if(playback.running){pausePlayback();return;}
    if(playback.animated){beginPlayback(playback.advance);return;}
    const qs=state.questions[state.current];
    if(qs.step===2){qs.step=0;qs.added=0;renderCard('playDemo');}
    beginPlayback();
  }
  function replayDemo() {
    if(!activeDemo())return;
    stopPlayback();const qs=state.questions[state.current];qs.step=0;qs.added=0;renderCard('replayStep');
    beginPlayback();
  }
  function seekDemo(index,focusId) {
    if(!Number.isInteger(index)||index<0||index>2||!activeDemo())return;
    step(index,focusId);beginPlayback();
  }
  function addPair(index) {
    if(!activeDemo()||config.questions[state.current].scene.kind!=='extend'||!Number.isInteger(index)||index<0||index>3)return;
    const qs=state.questions[state.current];if(qs.step!==1||(qs.added&(1<<index)))return;
    stopPlayback();qs.added|=1<<index;playback.inserted=index;
    if(qs.added===15)qs.step=2;
    renderCard(qs.step===2?'replayStep':'addPair'+config.outer.findIndex((_,i)=>!(qs.added&(1<<i))));
    beginPlayback(false);
  }
  if(motionQuery&&typeof motionQuery.addEventListener==='function')motionQuery.addEventListener('change',event=>{
    reducedMotion=event.matches;stopPlayback();if(activeDemo())renderCard();
  });
  if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayback();});
  if(typeof window.addEventListener==='function')window.addEventListener('pagehide',stopPlayback);

  const keptStrip = () => `<div class="kept-strip">${config.inner.map(([name, days]) => `<span>${h(name)} · ${days}</span>`).join('')}</div>`;
  const countText=(value,digits,id=0)=>`<strong class="demo-count" id="demo-count-${id}" data-count-target="${value}" data-decimals="${digits}" aria-hidden="true">${Number(value).toFixed(digits)}</strong><span class="sr-only">${Number(value).toFixed(digits)}</span>`;
  const flow=(label,vertical=false)=>`<div class="flow-rail ${vertical?'vertical':''}" aria-hidden="true"><span class="flow-packet">${h(label)}</span></div>`;
  function sceneControls(scene,phase) {
    if(phase===2)return '';

    const why=q.why.map((reason,i)=>`<li class="${i===q.correct?'answer-why':''}"><b>${letter(i)}</b><p>${h(local(reason))}</p></li>`).join('');
    el('stationCard').innerHTML=`<div class="station-top"><span class="station-pill">${t('สถานี','STATION')} ${String(state.current+1).padStart(2,'0')} / 06</span><span class="topic-pill">${h(local(q.label))}</span></div><h2 id="questionTitle" tabindex="-1">${h(local(q.prompt))}</h2><fieldset class="choices" aria-labelledby="questionTitle"><legend class="sr-only">${t('เลือกคำตอบ A B หรือ C เพียงข้อเดียว','Choose one answer, A, B or C.')}</legend>${q.options[state.lang].map((option,i)=>`<label class="option ${qs.choice===i?'selected':''} ${qs.revealed&&q.correct===i?'correct':''}" for="choice-${i}"><input type="radio" id="choice-${i}" name="answer-choice" value="${i}" ${qs.choice===i?'checked':''}><span class="option-letter">${letter(i)}</span><span class="option-copy" id="choice-text-${i}">${h(option)}</span>${qs.revealed&&q.correct===i?`<span class="answer-mark">✓ ${t('เฉลย','Answer')}</span>`:''}</label>`).join('')}</fieldset><div class="feedback ${qs.choice===null?'empty':''}" id="feedback" role="status" aria-live="polite">${qs.choice===null?`<p>${t('เลือกคำตอบเพื่อดูแนวคิด หรือเปิดเฉลยและภาพได้เลย','Select an option for feedback, or open the answer and visual explanation now.')}</p>`:`<strong>${t('แนวคิดของตัวเลือก','About option')} ${letter(qs.choice)}</strong><p>${h(local(q.why[qs.choice]))}</p>`}</div><button type="button" class="primary reveal-button" id="revealButton" data-action="reveal" aria-expanded="${qs.revealed}" aria-controls="explanation"><span class="eye" aria-hidden="true">${qs.revealed?'◉':'◎'}</span>${qs.revealed?t('ซ่อนเฉลยและคำอธิบาย','Hide answer and explanation'):t('ดูเฉลยและคำอธิบาย','Show answer and explanation')}</button><section class="explanation" id="explanation" ${qs.revealed?'':'hidden'}>${qs.revealed?`<div class="answer-banner" role="status"><span class="answer-letter">${letter(q.correct)}</span><div><strong>${t('เฉลยของข้อนี้','Answer to this question')}</strong><p>${h(q.options[state.lang][q.correct])}</p></div></div><p class="key-reason">${h(local(q.explanation))}</p><div class="visual-lab"><div class="visual-heading"><h3>${t('ตามภาพทีละขั้น','Follow the visual, step by step')}</h3><span class="step-counter">${t('ขั้น','Step')} ${qs.step+1} / 3</span></div><figure class="demo" id="visualDemo" data-phase="${qs.step}">${diagram.content}<figcaption aria-live="polite">${h(diagram.caption)}</figcaption></figure><div class="play-controls"><button type="button" class="primary" id="playDemo" data-action="play-demo" aria-pressed="false"></button><p class="play-status" id="playbackStatus" role="status" aria-live="polite"></p></div><div class="step-controls"><button type="button" class="secondary" id="previousStep" data-action="previous-step" ${qs.step===0?'disabled':''}>← ${t('ขั้นก่อนหน้า','Previous step')}</button><button type="button" class="primary" id="nextStep" data-action="next-step" ${qs.step===2?'disabled':''}>${t('ขั้นถัดไป','Next step')} →</button><button type="button" class="secondary step-replay" id="replayStep" data-action="replay">↺ ${t('เล่นใหม่','Replay demo')}</button></div><p class="model-note">${t('ภาพใช้ข้อมูลตัวอย่างเพื่ออธิบายแนวคิดของโจทย์','The visual uses example data to explain the question’s concept.')}</p></div><h3 class="why-title">${t('ทำไม A / B / C จึงต่างกัน','Why A / B / C differ')}</h3><ul class="why-options">${why}</ul>`:''}</section>`;
    syncPlaybackUI();if(playback.animated)counters(playback.elapsed/playback.duration);
    if(focusId&&el(focusId))el(focusId).focus();
  }
  function rememberSession() {
    cache[state.activeSession].current=state.current;
    cache[state.activeSession].questions=state.questions;
  }
  function selectSession(id) {
    if(!Number.isInteger(id)||(id!==1&&id!==2))return;
    stopPlayback();rememberSession();
    if(el('resetDialog').open)el('resetDialog').close();
    config=bundle.sessions.find(source=>source.session===id);
    state.activeSession=id;state.current=cache[id].current;state.questions=cache[id].questions;state.view='session';
    renderAll('questionTitle');
  }
  function backMenu() {
    if(state.view!=='session')return;
    stopPlayback();rememberSession();if(el('resetDialog').open)el('resetDialog').close();state.view='menu';
    renderAll('menuSession'+state.activeSession);
  }
  function renderMenu() {
    el('menuTitle').textContent=t('เลือก Session','Choose a session');
    el('menuHelp').textContent=t('เริ่มคาบที่ต้องการ หรือกลับไปทำต่อจากข้อเดิมได้','Start a session or continue from where you left off.');
    el('sessionChoices').innerHTML=bundle.sessions.map(source=>{
      const saved=cache[source.session],count=saved.questions.filter(q=>q.choice!==null).length;
      const revealed=saved.questions.filter(q=>q.revealed).length;
      const status=count||revealed?t(`เลือกแล้ว ${count}/6 · เปิดเฉลย ${revealed}/6`,`Selected ${count}/6 · Revealed ${revealed}/6`):t('6 ข้อ · เริ่มได้เลย','6 questions · Ready to begin');
      const names=source.session===1?source.inner:source.outer;
      return `<button type="button" id="menuSession${source.session}" class="menu-card" data-session="${source.session}"><span class="menu-session">Session ${source.session}</span><span class="menu-planets" aria-hidden="true">${names.map(([name])=>planetSymbol(name)).join('')}</span><strong>${source.session===1?t('Dictionary ดาวชั้นใน','Inner-planet Dictionary'):t('ต่อยอดด้วยดาวชั้นนอก','Extend with outer planets')}</strong><span class="menu-description">${source.session===1?t('อ่าน key และ value แปลงอายุ และอ่านพาสปอร์ต','Read keys and values, convert ages, and read a passport.'):t('เพิ่มคู่ข้อมูลใหม่ เก็บคู่เดิม และใช้ฟังก์ชันเดิม','Add new pairs, keep the original pairs, and reuse the function.')}</span><span class="menu-status">${status}</span><span class="menu-enter">${count||revealed?t('ทำต่อ','Continue'):t('เปิด Quiz','Open Quiz')} →</span></button>`;
    }).join('');
  }
  function renderAll(focusId) {
    document.documentElement.lang=state.lang;document.title='Dictionary Quiz';
    el('worksheetTitle').textContent='Dictionary Quiz';
    el('thButton').setAttribute('aria-pressed',String(state.lang==='th'));el('enButton').setAttribute('aria-pressed',String(state.lang==='en'));
    const menu=state.view==='menu';
    el('sessionMenu').hidden=!menu;el('quizLayout').hidden=menu;el('backMenuButton').hidden=menu;el('resetButton').hidden=menu;
    el('backMenuButton').textContent=t('← เมนู','← Menu');
    el('resetButton').textContent=t(`เริ่ม Session ${state.activeSession} ใหม่`,`Reset Session ${state.activeSession}`);
    const m=config.metadata;el('metadata').textContent=`${m.lessonCode} · v${m.version} · ${m.date} · Author ${m.author} · Reviewer ${m.reviewer}`;
    if(menu){
      el('heroTag').textContent=t('สองคาบ · 6 ข้อต่อคาบ','Two sessions · 6 questions each');
      el('intro').textContent=t('เลือกคาบเพื่อสำรวจ Dictionary ผ่านคำถามและเฉลยภาพ เปิดเฉลยได้โดยไม่ต้องเลือกคำตอบก่อน','Explore Dictionaries through questions and visual explanations. You can reveal an answer without choosing an option first.');
      el('stationCard').innerHTML='';el('stationMap').innerHTML='';el('reference').innerHTML='';el('reference').hidden=true;
      renderMenu();if(focusId&&el(focusId))el(focusId).focus();return;
    }
    el('heroTag').textContent=`Session ${config.session} · `+t('6 คำถาม','6 questions');
    el('intro').textContent=local(config.intro);
    el('mapTitle').textContent=t('เส้นทาง 6 สถานี','Your 6-station journey');
    el('keyboardNote').textContent=t('ใช้ Tab ไปยังปุ่มหรือคำตอบ ใช้ลูกศรเลือก A/B/C และ Space เพื่อเลือก','Use Tab for buttons and answers, arrow keys for A/B/C, and Space to select.');
    el('previousQuestion').textContent=t('← ข้อก่อนหน้า','← Previous');el('nextQuestion').textContent=t('ข้อถัดไป →','Next →');
    el('previousQuestion').disabled=state.current===0;el('nextQuestion').disabled=state.current===config.questions.length-1;
    el('questionNumber').textContent=t(`ข้อ ${state.current+1} / 6`,`Question ${state.current+1} / 6`);
    el('finishNote').hidden=state.current!==5;
    el('finishNote').textContent=t('กลับเมนูเพื่อเลือกอีกคาบได้ คำตอบและเฉลยของสองคาบเก็บแยกกัน การเริ่มใหม่ล้างเฉพาะคาบที่เปิดอยู่','Return to the menu to choose another session. Each session keeps its own answers and reveals. Reset clears only the current session.');
    el('resetTitle').textContent=t(`เริ่ม Session ${config.session} ใหม่ไหม?`,`Reset Session ${config.session}?`);
    el('resetDescription').textContent=t(`ล้างคำตอบทั้ง 6 ข้อและซ่อนเฉลยเฉพาะ Session ${config.session} กลับข้อแรก คำตอบของอีกคาบและภาษาที่เลือกยังคงเดิม`,`Clear all 6 selections and hide the reveals in Session ${config.session} only. Return to its first question. Keep the other session and the current language unchanged.`);
    el('cancelReset').textContent=t('กลับไปทำต่อ','Keep exploring');el('confirmReset').textContent=t(`เริ่ม Session ${config.session} ใหม่`,`Reset Session ${config.session}`);
    renderReference();renderMap();renderCard(focusId);
  }
  function choose(index) {
    if(state.view!=='session')return;
    if(!Number.isInteger(index)||index<0||index>2)return;
    stopPlayback();state.questions[state.current].choice=index;renderMap();renderCard(`choice-${index}`);
  }
  function go(index) {
    if(state.view!=='session')return;
    if(!Number.isInteger(index)||index<0||index>=config.questions.length||index===state.current)return;
    stopPlayback();state.current=index;cache[state.activeSession].current=index;renderAll('questionTitle');el('stationCard').scrollIntoView({block:'start',behavior:'auto'});
  }
  function reveal() {
    if(state.view!=='session')return;
    stopPlayback();const qs=state.questions[state.current];qs.revealed=!qs.revealed;if(!qs.revealed){qs.step=0;qs.added=0;}renderMap();renderCard('revealButton');
  }
  function step(index,focusId) {
    if(state.view!=='session')return;
    const qs=state.questions[state.current];if(!qs.revealed||!Number.isInteger(index)||index<0||index>2)return;
    stopPlayback();if(config.questions[state.current].scene.kind==='extend'){if(index===0||index===1&&qs.step!==1)qs.added=0;if(index===2)qs.added=15;}
    qs.step=index;renderCard(focusId&&!((index===0&&focusId==='previousStep')||(index===2&&focusId==='nextStep'))?focusId:'replayStep');
  }
  function language(value) {
    if(value!=='th'&&value!=='en')return;stopPlayback();state.lang=value;renderAll(value==='th'?'thButton':'enButton');
  }
  function openReset(){if(state.view==='session'){stopPlayback();el('resetDialog').showModal();}}
  function cancelReset(){if(!el('resetDialog').open)return;el('resetDialog').close();el('resetButton').focus();}
  function confirmReset(){if(!el('resetDialog').open||state.view!=='session')return;stopPlayback();el('resetDialog').close();state.current=0;state.questions=freshQuestions();rememberSession();renderAll('questionTitle');}
  el('thButton').addEventListener('click',()=>language('th'));el('enButton').addEventListener('click',()=>language('en'));
  el('previousQuestion').addEventListener('click',()=>go(state.current-1));el('nextQuestion').addEventListener('click',()=>go(state.current+1));
  el('resetButton').addEventListener('click',openReset);el('cancelReset').addEventListener('click',cancelReset);el('confirmReset').addEventListener('click',confirmReset);
  el('resetDialog').addEventListener('cancel',event=>{event.preventDefault();cancelReset();});
  el('stationMap').addEventListener('click',event=>{const target=event.target.closest('[data-question]');if(target&&el('stationMap').contains(target)&&/^[0-5]$/.test(target.dataset.question))go(Number(target.dataset.question));});
  el('stationCard').addEventListener('change',event=>{const target=event.target;if(target.name==='answer-choice'&&target.type==='radio'&&/^[012]$/.test(target.value))choose(Number(target.value));});
  el('stationCard').addEventListener('click',event=>{
    const target=event.target.closest('[data-action]');if(!target||!el('stationCard').contains(target))return;const qs=state.questions[state.current];
    if(target.dataset.action==='reveal')reveal();else if(target.dataset.action==='previous-step')step(qs.step-1,'previousStep');else if(target.dataset.action==='next-step')step(qs.step+1,'nextStep');else if(target.dataset.action==='replay')replayDemo();else if(target.dataset.action==='play-demo')playDemo();else if(target.dataset.action==='demo-seek'&&/^[012]$/.test(target.dataset.step))seekDemo(Number(target.dataset.step),target.id);else if(target.dataset.action==='add-pair'&&/^[0-3]$/.test(target.dataset.index))addPair(Number(target.dataset.index));
  });
  el('backMenuButton').addEventListener('click',backMenu);
  el('sessionChoices').addEventListener('click',event=>{const target=event.target.closest('[data-session]');if(target&&el('sessionChoices').contains(target)&&/^[12]$/.test(target.dataset.session))selectSession(Number(target.dataset.session));});
  // Runtime initialization.
  renderAll();
})();
</script>
</body></html>
