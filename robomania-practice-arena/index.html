<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Robomania Practice Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout concept: a referee console laid over the arena mat — grid-paper ground, start-line purple bar, mat tokens (teal circles, amber zones, coral faults) as the UI vocabulary. */
:root{
  --bg:#ECEDF6; --bg-grid:rgba(90,78,170,.075);
  --surface:#FFFFFF; --surface-2:#F6F5FC; --line:#DCD9EE; --line-2:#C9C5E3;
  --ink:#1F1A4D; --ink-2:#4A4573; --ink-3:#7C77A3; --on-dark:#FFFFFF;
  --bar:#1F1A4D; --bar-2:#2B2566; --bar-ink:#F3F1FF;
  --purple:#6656B8; --purple-d:#463898; --purple-l:#E7E3FA;
  --teal:#24B79D; --teal-d:#137F6C; --teal-l:#D5F3EC; --on-teal:#06302A;
  --amber:#F4B223; --amber-d:#B98000; --amber-l:#FFF2CC; --on-amber:#3A2700;
  --coral:#E24B2D; --coral-d:#A8321A; --coral-l:#FCE2DA;
  --blue:#3D7BE0; --blue-l:#DCE8FB;
  --mat:#FFFFFF; --mat-grid:#E4E2EF; --mat-ink:#26215A; --mat-dash:#9C98B8; --mat-zone:#FFE9AE; --start-fill:#FFF4CC;
  --gold:#E9B21F; --gold-d:#9A7000; --silver:#A6B0C2; --silver-d:#5E687B; --bronze:#C9793A; --bronze-d:#7E4416;
  --shadow:rgba(31,26,77,.16);
  --font-display:'Chakra Petch','Anuphan',system-ui,sans-serif;
  --font-body:'Anuphan','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D29; --bg-grid:rgba(170,160,255,.06);
    --surface:#1A1740; --surface-2:#221E4F; --line:#332E6A; --line-2:#433D82;
    --ink:#EEEBFF; --ink-2:#BCB6E6; --ink-3:#8882B6; --on-dark:#FFFFFF;
    --bar:#090720; --bar-2:#16133A; --bar-ink:#F3F1FF;
    --purple:#8F80F2; --purple-d:#6151C9; --purple-l:#2A2460;
    --teal:#2ED3B5; --teal-d:#15927D; --teal-l:#113E3A; --on-teal:#04241F;
    --amber:#FFC444; --amber-d:#C98F00; --amber-l:#3A2E10; --on-amber:#2C1D00;
    --coral:#FF6B4D; --coral-d:#C2402A; --coral-l:#45201C;
    --blue:#609AF7; --blue-l:#1D2E55;
    --mat:#18153E; --mat-grid:#2A2662; --mat-ink:#E7E4FF; --mat-dash:#6F69A3; --mat-zone:#4A3D16; --start-fill:#3A3115;
    --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0D29; --bg-grid:rgba(170,160,255,.06);
  --surface:#1A1740; --surface-2:#221E4F; --line:#332E6A; --line-2:#433D82;
  --ink:#EEEBFF; --ink-2:#BCB6E6; --ink-3:#8882B6; --on-dark:#FFFFFF;
  --bar:#090720; --bar-2:#16133A; --bar-ink:#F3F1FF;
  --purple:#8F80F2; --purple-d:#6151C9; --purple-l:#2A2460;
  --teal:#2ED3B5; --teal-d:#15927D; --teal-l:#113E3A; --on-teal:#04241F;
  --amber:#FFC444; --amber-d:#C98F00; --amber-l:#3A2E10; --on-amber:#2C1D00;
  --coral:#FF6B4D; --coral-d:#C2402A; --coral-l:#45201C;
  --blue:#609AF7; --blue-l:#1D2E55;
  --mat:#18153E; --mat-grid:#2A2662; --mat-ink:#E7E4FF; --mat-dash:#6F69A3; --mat-zone:#4A3D16; --start-fill:#3A3115;
  --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.55;
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:32px 32px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);color:var(--bar-ink);box-shadow:0 2px 0 var(--purple)}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.08em;line-height:1}
.brand-sub{font-size:12px;opacity:.72;letter-spacing:.02em;margin-top:3px;white-space:nowrap}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bar-2);border:1px solid rgba(255,255,255,.12);padding:6px 11px;border-radius:999px;font-size:13px;white-space:nowrap}
.count-chip b{font-family:var(--font-display);color:var(--amber);font-size:15px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:var(--bar-2);color:var(--bar-ink);display:inline-grid;place-items:center;transition:transform .12s,background .2s}
.icon-btn:hover{background:#3a3380}
.icon-btn:active{transform:translateY(2px)}
.icon-btn[aria-pressed="false"]{opacity:.55}
.icon-btn svg{width:20px;height:20px}
.lang-btn{font-family:var(--font-display);font-weight:700;font-size:13px;width:auto;padding:0 10px}
.team-chip{display:inline-flex;align-items:center;gap:8px;max-width:230px;height:40px;padding:0 12px 0 4px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:var(--bar-2);color:var(--bar-ink)}
.team-chip .av{width:32px;height:32px;flex:none}
.team-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.tabs-wrap{background:var(--bar-2);border-top:1px solid rgba(255,255,255,.06)}
.tabs{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;color:var(--bar-ink);opacity:.7;padding:11px 14px 12px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-current="page"]{opacity:1;border-bottom-color:var(--amber);color:#fff}

/* ---------- page ---------- */
.page{max-width:1240px;margin:0 auto;padding:22px 16px 80px}
.view{animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.sec-head h2{font-size:clamp(24px,3vw,32px)}
.sec-head p{color:var(--ink-2);max-width:62ch}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}

/* ---------- buttons ---------- */
.btn{--b:var(--surface);--bd:var(--line-2);--fg:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:var(--r-md);border:2px solid var(--bd);background:var(--b);color:var(--fg);font-weight:700;font-size:15px;box-shadow:0 4px 0 var(--bd);transition:transform .08s,box-shadow .08s,filter .2s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--bd)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{--b:var(--teal);--bd:var(--teal-d);--fg:var(--on-teal)}
.btn-amber{--b:var(--amber);--bd:var(--amber-d);--fg:var(--on-amber)}
.btn-purple{--b:var(--purple);--bd:var(--purple-d);--fg:#fff}
.btn-danger{--b:var(--coral);--bd:var(--coral-d);--fg:#fff}
.btn-ghost{--b:transparent;--bd:transparent;box-shadow:none;color:var(--ink-2)}
.btn-ghost:active{box-shadow:none}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-lg{min-height:56px;padding:12px 26px;font-size:18px;border-radius:16px}
.btn-xl{min-height:68px;padding:14px 32px;font-size:22px;border-radius:18px;font-family:var(--font-display);letter-spacing:.04em}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- cards / chips ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card h3{font-size:19px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip-teal{background:var(--teal-l);border-color:transparent;color:var(--teal-d)}
.chip-coral{background:var(--coral-l);border-color:transparent;color:var(--coral-d)}
.chip-amber{background:var(--amber-l);border-color:transparent;color:var(--amber-d)}
.chip-purple{background:var(--purple-l);border-color:transparent;color:var(--purple)}
.chip-blue{background:var(--blue-l);border-color:transparent;color:var(--blue)}
:root[data-theme="dark"] .chip-teal{color:var(--teal)} :root[data-theme="dark"] .chip-coral{color:var(--coral)} :root[data-theme="dark"] .chip-amber{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip-teal{color:var(--teal)} :root:not([data-theme="light"]) .chip-coral{color:var(--coral)} :root:not([data-theme="light"]) .chip-amber{color:var(--amber)}}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.src-c{background:var(--teal-l);color:var(--teal-d)}
.src-d{background:var(--purple-l);color:var(--purple)}
.src-a{background:var(--amber-l);color:var(--amber-d)}
.src-r{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.token{width:44px;height:44px;border-radius:50%;background:var(--teal);border:3px solid var(--purple);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--mat-ink);font-size:16px;flex:none;color:#1F1A4D}
.medal{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;padding:4px 12px 4px 4px;border-radius:999px;font-size:14px;white-space:nowrap}
.medal i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.medal-gold{background:#FFF1C2;color:#7A5600} .medal-gold i{background:var(--gold);box-shadow:inset 0 -3px 0 var(--gold-d)}
.medal-silver{background:#E9EDF3;color:#465062} .medal-silver i{background:var(--silver);box-shadow:inset 0 -3px 0 var(--silver-d)}
.medal-bronze{background:#F7E1CF;color:#6B3A12} .medal-bronze i{background:var(--bronze);box-shadow:inset 0 -3px 0 var(--bronze-d)}
.medal-part{background:var(--purple-l);color:var(--purple)} .medal-part i{background:var(--purple)}
.medal-none{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line-2)} .medal-none i{background:var(--line-2)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:700;letter-spacing:.005em;line-height:1.05;margin:10px 0 14px}
.hero h1 .l2{display:block;color:var(--purple)}
.hero p.lead{font-size:18px;color:var(--ink-2);max-width:46ch;margin-bottom:20px}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px;max-width:520px}
.hstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hstat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--ink)}
.hstat span{font-size:12.5px;color:var(--ink-3)}
.hero-mat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 18px 40px -22px var(--shadow)}
.hero-mat .mat-cap{position:absolute;left:22px;bottom:18px;display:flex;gap:6px;flex-wrap:wrap}
.team-strip{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:22px}
.team-strip .av{width:52px;height:52px;flex:none}
.team-strip .ts-name{font-family:var(--font-display);font-weight:700;font-size:20px}
.team-strip .ts-mem{font-size:14px;color:var(--ink-3)}
.ts-prog{flex:1 1 260px;min-width:0}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:11px;font-weight:700;background:var(--surface-2);border:2px dashed var(--line-2);color:var(--ink-3)}
.pip.tried{border:2px solid var(--amber);background:var(--amber-l);color:var(--amber-d)}
.pip.done{border:2px solid var(--teal-d);background:var(--teal);color:#06302A}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- mission grid ---------- */
.missions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:0;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s;color:inherit}
.mcard:hover{transform:translateY(-4px);box-shadow:0 14px 26px -16px var(--shadow);border-color:var(--purple)}
.mcard .thumb{background:var(--mat);border-bottom:1px solid var(--line);padding:6px}
.mcard .thumb svg{display:block;width:100%;height:auto}
.mcard .mbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.mcard .mtop{display:flex;align-items:center;gap:10px}
.mcard .mtop .token{width:40px;height:40px;font-size:14px}
.mcard h3{font-size:18px}
.mcard .msub{font-size:13.5px;color:var(--ink-3);line-height:1.35}
.mcard .mmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:6px;height:12px;border-radius:2px;background:var(--line-2)}
.lvl i.on{background:var(--coral)}
.mstate{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.stamp{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:4px 9px;border-radius:8px;text-transform:uppercase}
.stamp-done{background:var(--teal);color:#06302A;transform:rotate(-4deg);box-shadow:0 2px 0 var(--teal-d)}
.stamp-tried{background:var(--amber);color:#3A2700}
.mbest{font-size:13px;color:var(--ink-2)}
.mbest b{font-family:var(--font-display);font-size:16px;color:var(--ink)}

/* ---------- map svg ---------- */
.mat-svg{display:block;width:100%;height:auto;touch-action:manipulation}
.m-bg{fill:var(--mat)} .m-grid{stroke:var(--mat-grid);stroke-width:1;fill:none}
.m-edge{fill:none;stroke:var(--mat-ink);stroke-width:2.5;opacity:.85}
.m-start{fill:var(--start-fill);stroke:var(--amber);stroke-width:3;stroke-dasharray:10 6}
.m-start-t{fill:var(--amber-d);font:700 13px var(--font-display);letter-spacing:.08em}
.m-start-s{fill:var(--amber-d);font:500 11px var(--font-body)}
.m-line{fill:var(--purple)}
.m-cir{fill:var(--teal);stroke:var(--purple);stroke-width:3.5}
.m-cir-t{fill:none;stroke:var(--coral);stroke-width:4}
.m-num{fill:#1F1A4D;font:700 22px var(--font-display);text-anchor:middle;dominant-baseline:central}
.m-can{fill:var(--blue);fill-opacity:.82;stroke:#1d4ea8;stroke-width:2}
.m-can-top{fill:#9cc0ff;opacity:.9}
.m-halo{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-dasharray:4 4}
.m-cantag{font:700 10px var(--font-body);fill:var(--blue)}
.m-cantag.nt{fill:var(--coral)}
.m-zfill{fill:var(--mat-zone);opacity:.85}
.m-wall{stroke:var(--mat-ink);stroke-width:5;stroke-linecap:square;fill:none}
.m-wall-d{stroke:var(--mat-dash);stroke-width:3;stroke-dasharray:9 7;fill:none}
.m-zl{font:700 34px var(--font-display);fill:var(--purple);text-anchor:middle;dominant-baseline:central}
.m-zl.d{fill:var(--mat-dash);opacity:.7}
.m-open{stroke:var(--teal-d);stroke-width:2;stroke-dasharray:2 5;fill:none}
.m-inarrow{stroke:var(--teal-d);stroke-width:2.5;fill:none;marker-end:none}
.m-inhead{fill:var(--teal-d)}
.rt-plan{fill:none;stroke:var(--purple);stroke-width:3;stroke-dasharray:7 7;opacity:.42;stroke-linecap:round;stroke-linejoin:round}
.rt-plan.rev{stroke:var(--coral)}
.rt-plan.push{stroke:var(--blue);opacity:.6}
.rt-trail{fill:none;stroke:var(--purple);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.rt-trail.rev{stroke:var(--coral);stroke-dasharray:none}
.rt-trail.push{stroke:var(--blue)}
.mk circle{fill:var(--surface);stroke:var(--ink-3);stroke-width:2.5}
.mk text{font:700 13px var(--font-display);fill:var(--ink-3);text-anchor:middle;dominant-baseline:central}
.mk.on circle{fill:var(--teal);stroke:var(--teal-d)} .mk.on text{fill:#06302A}
.mk.next circle{fill:var(--amber);stroke:var(--amber-d);animation:mkPulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mk.next text{fill:#3A2700}
@keyframes mkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.focus-ring{fill:none;stroke:var(--amber);stroke-width:5;opacity:.9;animation:focusRing 1.2s ease-in-out infinite}
@keyframes focusRing{0%,100%{opacity:.25;stroke-width:3}50%{opacity:1;stroke-width:7}}
.robot .r-body{fill:var(--amber);stroke:#3A2700;stroke-width:2.5}
.robot .r-wheel{fill:#2A2560}
.robot .r-front{fill:#fff}
.robot .r-eye{fill:#1F1A4D}
.spin-ring{fill:none;stroke:var(--coral);stroke-width:3;stroke-dasharray:10 8}
.wait-ring{fill:none;stroke:var(--teal);stroke-width:4}
.wait-t{font:700 18px var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.say-box{fill:var(--bar);opacity:.94}
.say-t{fill:#fff;font:600 15px var(--font-body);dominant-baseline:central}

/* ---------- challenge flow ---------- */
.flow-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.flow-head .token{width:56px;height:56px;font-size:18px}
.flow-head h2{font-size:clamp(24px,3.2vw,34px)}
.flow-head .fh-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.flow-head .fh-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.st{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--ink-3);white-space:nowrap}
.st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-display);font-size:13px;border:2px solid var(--line-2)}
.st.cur{border-color:var(--purple);color:var(--ink);box-shadow:0 3px 0 var(--purple)}
.st.cur b{background:var(--purple);border-color:var(--purple);color:#fff}
.st.ok{color:var(--teal-d)} .st.ok b{background:var(--teal);border-color:var(--teal-d);color:#06302A}
button.st{cursor:pointer} button.st:disabled{cursor:default;opacity:.7}
.brief-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.map-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.map-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:2px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 10px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--purple);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:22px;height:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:15px;transition:background .25s,transform .25s;border:1px solid transparent}
.steps li .sn{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--ink-3)}
.steps li.cur{background:var(--amber-l);border-color:var(--amber);transform:translateX(4px)}
.steps li.cur .sn{background:var(--amber);border-color:var(--amber-d);color:#3A2700}
.steps li.past .sn{background:var(--teal);border-color:var(--teal-d);color:#06302A}
.info-stack{display:grid;gap:14px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.info h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.info p{font-size:15.5px}
.rule-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cp-table{width:100%;border-collapse:collapse;font-size:15px}
.cp-table td{padding:8px 4px;border-bottom:1px dashed var(--line)}
.cp-table td:first-child{width:30px}
.cp-table td:last-child{text-align:right;font-family:var(--font-display);font-weight:700;white-space:nowrap}
.cp-table tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700}
.cp-n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:2px solid var(--ink-3);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink-2)}
.tip{background:var(--amber-l);border:2px solid var(--amber);border-radius:var(--r-lg);padding:14px 16px;display:flex;gap:12px}
.tip svg{width:28px;height:28px;flex:none;color:var(--amber-d)}
.tip h4{color:var(--amber-d)}
.swap{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:14px}
.switch{position:relative;width:46px;height:26px;flex:none;border-radius:999px;background:var(--line-2);border:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--teal)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.flow-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}

/* plan */
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:12px;border:2px dashed var(--line-2);background:var(--surface-2);font-size:15px}
.slot .cp-n{flex:none}
.slot.filled{border-style:solid;border-color:var(--teal-d);background:var(--teal-l);animation:pop .3s}
.pool{display:grid;gap:8px}
.pcard{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);box-shadow:0 3px 0 var(--line-2);font-size:15px;font-weight:600;transition:transform .1s}
.pcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.pcard.used{display:none}
.pcard.bad{animation:shake .4s;border-color:var(--coral)}
.quiz-opts{display:grid;gap:8px;margin-top:12px}
.qopt{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--line-2);display:flex;gap:10px;align-items:center}
.qopt .ql{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-display);font-weight:700}
.qopt.right{border-color:var(--teal-d);background:var(--teal-l);box-shadow:0 3px 0 var(--teal-d)}
.qopt.wrong{border-color:var(--coral);background:var(--coral-l);box-shadow:0 3px 0 var(--coral-d);animation:shake .4s}
.qopt:disabled{cursor:default}
.why{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--purple);font-size:15px}

/* check */
.check-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.checklist{display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);font-size:15.5px;font-weight:600;transition:all .2s}
.chk .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink-3);display:grid;place-items:center;transition:all .2s}
.chk .box svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:all .2s}
.chk[aria-checked="true"]{border-color:var(--teal-d);background:var(--teal-l)}
.chk[aria-checked="true"] .box{background:var(--teal);border-color:var(--teal-d)}
.chk[aria-checked="true"] .box svg{opacity:1;transform:none}
.who{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.who button{padding:8px 14px;border-radius:999px;border:2px solid var(--line-2);background:var(--surface);font-weight:600}
.who button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple-d);color:#fff}
.who .sugg{font-size:11px;font-weight:700;color:var(--amber-d);margin-left:4px}
.who button[aria-pressed="true"] .sugg{color:#FFE7A3}
.go-wrap{display:grid;gap:10px;justify-items:start}

/* run */
.run-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.timer-card{background:var(--bar);color:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.timer-card::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:12}
.ring .rfg{fill:none;stroke:var(--teal);stroke-width:12;stroke-linecap:round;transition:stroke .3s}
.ring.warn .rfg{stroke:var(--amber)} .ring.crit .rfg{stroke:var(--coral)}
.ring.crit{animation:critPulse 1s infinite}
@keyframes critPulse{50%{transform:scale(1.05)}}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rt b{font-family:var(--font-display);font-size:38px;line-height:1;font-weight:700;letter-spacing:.02em}
.ring .rt small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.dg{display:inline-block;width:.62em;text-align:center}
.score-box{position:relative;z-index:1;flex:1;min-width:0}
.score-box .lbl{font-size:13px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.score-box .big{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1}
.score-box .big small{font-size:22px;opacity:.6}
.score-box .who-line{font-size:13.5px;opacity:.8;margin-top:6px}
.score-box .pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.score-box .pbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .5s}
.cp-list{display:grid;gap:10px;margin-top:14px}
.cp{position:relative;display:flex;align-items:center;gap:12px;text-align:left;min-height:66px;padding:12px 14px;border-radius:16px;border:2px solid var(--line-2);background:var(--surface);box-shadow:0 4px 0 var(--line-2);font-size:16px;font-weight:600;overflow:hidden;transition:transform .1s,background .25s,border-color .25s}
.cp:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.cp .cp-n{width:32px;height:32px;font-size:14px;flex:none}
.cp .cp-t{flex:1;min-width:0;line-height:1.3}
.cp .cp-p{font-family:var(--font-display);font-weight:700;font-size:18px;padding:4px 10px;border-radius:10px;background:var(--surface-2);flex:none}
.cp .cp-s{font-size:12px;font-weight:700;color:var(--ink-3);display:block;margin-top:2px}
.cp.next{border-color:var(--amber);box-shadow:0 4px 0 var(--amber-d);animation:nextGlow 1.4s ease-in-out infinite}
@keyframes nextGlow{50%{background:var(--amber-l)}}
.cp.done{border-color:var(--teal-d);background:var(--teal-l);box-shadow:0 4px 0 var(--teal-d)}
.cp.done .cp-n{background:var(--teal);border-color:var(--teal-d);color:#06302A}
.cp.done .cp-p{background:var(--teal);color:#06302A}
.cp.lock{opacity:.5;box-shadow:0 4px 0 var(--line)}
.cp:disabled{cursor:default}
.cp .hold{position:absolute;inset:0;background:var(--teal-l);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:2}
.cp .hold i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);opacity:.35;width:0}
.cp .hold b{position:relative;font-family:var(--font-display);font-size:20px;flex:1}
.cp .hold .btn{position:relative}
.side-stack{display:grid;gap:14px}
.fault-box{background:var(--surface);border:2px solid var(--coral-l);border-radius:var(--r-lg);padding:14px}
.fault-box h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fault-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.fbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--coral);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;box-shadow:0 3px 0 var(--coral-d);line-height:1.3}
.fbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-d)}
.fbtn:hover{background:var(--coral-l)}
.run-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.flyup{position:fixed;z-index:80;pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--teal-d);text-shadow:0 2px 0 #fff;animation:flyUp 1s ease-out forwards}
@keyframes flyUp{from{opacity:1;transform:translate(-50%,0) scale(.6)}30%{transform:translate(-50%,-30px) scale(1.2)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.countdown{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(15,13,41,.82);color:#fff;font-family:var(--font-display)}
.countdown b{font-size:min(38vw,260px);line-height:1;animation:cdPop .9s cubic-bezier(.2,.9,.3,1.3)}
.countdown b.go{color:var(--teal)}
.countdown small{position:absolute;bottom:14vh;font-size:20px;opacity:.8;font-family:var(--font-body)}
@keyframes cdPop{from{transform:scale(2.2);opacity:0}40%{transform:scale(.92);opacity:1}to{transform:scale(1)}}

/* debrief */
.res-banner{position:relative;border-radius:22px;padding:26px 24px;overflow:hidden;color:#fff;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.res-banner.complete{background:linear-gradient(135deg,#119c84,#24B79D 55%,#7ad9c4)}
.res-banner.fault{background:linear-gradient(135deg,#9e2c17,#E24B2D)}
.res-banner.time,.res-banner.stopped{background:linear-gradient(135deg,#463898,#6656B8)}
.res-banner h2{font-size:clamp(32px,5vw,52px);letter-spacing:.04em;animation:stampIn .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes stampIn{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.res-banner p{font-size:17px;opacity:.92}
.res-banner .res-pts{margin-left:auto;text-align:right}
.res-banner .res-pts b{font-family:var(--font-display);font-size:64px;line-height:1}
.res-banner .res-pts small{font-size:24px;opacity:.75}
.res-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.cp-res{display:grid;gap:8px}
.cp-res div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:15px}
.cp-res div.got{background:var(--teal-l)}
.cp-res div .cp-p{margin-left:auto;font-family:var(--font-display);font-weight:700}
.cp-res div.miss{opacity:.65}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kv span{font-size:12.5px;color:var(--ink-3);display:block}
.kv b{font-family:var(--font-display);font-size:22px}
.tagset{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tagset button{padding:8px 12px;border-radius:999px;border:2px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px}
.tagset button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple-d);color:#fff}
.badge-pop{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--amber-l);border:2px solid var(--amber);animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
.badge-ico{width:48px;height:48px;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .45s}
.flash-red{animation:flashRed .6s}
@keyframes flashRed{0%{box-shadow:inset 0 0 0 0 rgba(226,75,45,0)}30%{box-shadow:inset 0 0 0 100vmax rgba(226,75,45,.25)}100%{box-shadow:inset 0 0 0 0 rgba(226,75,45,0)}}

/* board */
.board{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:52px 56px minmax(0,1.6fr) minmax(0,1.4fr) 110px 150px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;animation:viewIn .4s both}
.brow .rk{font-family:var(--font-display);font-weight:700;font-size:26px;text-align:center;color:var(--ink-3)}
.brow.r1 .rk{color:var(--gold-d)} .brow.r2 .rk{color:var(--silver-d)} .brow.r3 .rk{color:var(--bronze-d)}
.brow .av{width:52px;height:52px}
.brow .bn{font-family:var(--font-display);font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bm{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bp{font-family:var(--font-display);font-weight:700;font-size:22px;text-align:right}
.brow .bp small{font-size:13px;color:var(--ink-3);font-weight:600}
.brow .pip{width:24px;height:24px;font-size:10px}
.board-head{display:grid;grid-template-columns:52px 56px minmax(0,1.6fr) minmax(0,1.4fr) 110px 150px;gap:12px;padding:0 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ceremony */
.cer{position:fixed;inset:0;z-index:95;background:radial-gradient(ellipse at 50% 20%,#3a3190 0%,#120f33 55%,#07061a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;overflow:auto}
.cer::before{content:"";position:absolute;inset:0;background:conic-gradient(from 200deg at 50% -10%,transparent 0 40deg,rgba(255,220,120,.12) 45deg 55deg,transparent 60deg 300deg,rgba(255,220,120,.12) 305deg 315deg,transparent 320deg);pointer-events:none;animation:beams 8s ease-in-out infinite alternate}
@keyframes beams{to{transform:rotate(6deg)}}
.cer h2{font-size:clamp(30px,5vw,54px);letter-spacing:.06em}
.cer .cer-sub{opacity:.7;margin:6px 0 26px;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.cer-stage{position:relative;min-height:320px;display:grid;place-items:center;width:min(560px,100%)}
.cer-card{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:26px 22px;backdrop-filter:blur(6px);animation:cerIn .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cerIn{from{transform:rotateY(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.cer-card .av{width:96px;height:96px;margin:0 auto 10px}
.cer-card .cn{font-family:var(--font-display);font-size:clamp(26px,4vw,40px);font-weight:700}
.cer-card .cm{opacity:.75;margin-top:4px}
.cer-medal{width:130px;height:130px;margin:16px auto 6px;animation:medalSpin 1.2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes medalSpin{from{transform:rotateY(540deg) scale(.3)}to{transform:none}}
.cer-card .cl{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:.06em}
.cer-card .cs{opacity:.8;margin-top:4px}
.drum{font-family:var(--font-display);font-size:28px;letter-spacing:.3em;animation:drum .15s infinite alternate}
@keyframes drum{to{transform:scale(1.06)}}
.cer-ctrl{position:relative;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.cer-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}

/* report */
.rp-tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);font-size:15.5px}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 4px var(--purple-l)}
.sheet{background:#fff;color:#1F1A4D;border-radius:18px;border:1px solid var(--line);padding:28px;max-width:860px;margin:0 auto;box-shadow:0 20px 40px -26px var(--shadow)}
.sheet .sh-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid #6656B8;padding-bottom:14px;margin-bottom:16px}
.sheet .sh-eyebrow{font-family:var(--font-display);font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:#6656B8}
.sheet h2{font-size:28px;color:#1F1A4D;margin:4px 0}
.sheet .sh-who{font-size:15px;color:#4A4573}
.sheet .sh-medal{text-align:center;min-width:120px}
.sheet .sh-medal svg{width:86px;height:86px}
.sheet .sh-medal b{display:block;font-family:var(--font-display);font-size:18px}
.sheet .sh-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.sheet .sh-kpi div{background:#F4F3FB;border-radius:12px;padding:10px 12px}

const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- state ---------- */
const STORE_KEY = 'robomania-cs1-v1';
function defaults() {
  return { v: 1, lang: 'th', theme: 'auto', sound: true, music: false, volume: 0.7,
    settings: { attemptSec: 120, attempts: 3, org: 'Code Genius', teacher: '' },
    ui: { set: 'C', boardSet: 'C' },
    teams: [], activeTeamId: null };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.v === 1 && Array.isArray(s.teams)) {
        const d = defaults();
        const out = Object.assign(d, s, { settings: Object.assign(d.settings, s.settings || {}), ui: Object.assign(d.ui, s.ui || {}) });
        out.teams.forEach(migrateTeam);
        return out;
      }
    }
  } catch (e) { /* storage blocked */ }
  return defaults();
}
function migrateTeam(tm) {
  tm.swaps = tm.swaps || {};
  if (tm.c8swap) { tm.swaps.C8 = true; delete tm.c8swap; }
  tm.results = tm.results || {}; tm.plans = tm.plans || {}; tm.comments = tm.comments || {};
  return tm;
}
let S = loadState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

/* ---------- i18n ---------- */
function t(k, vars) {
  let s = (STR[S.lang] && STR[S.lang][k] != null) ? STR[S.lang][k] : (STR.en[k] != null ? STR.en[k] : k);
  if (vars) for (const a in vars) s = s.split('{' + a + '}').join(vars[a]);
  return s;
}
const L = o => (o ? (o[S.lang] != null ? o[S.lang] : (o.en || '')) : '');
const listJoin = arr => arr.join(S.lang === 'th' ? ', ' : ', ');

/* ---------- challenge helpers ---------- */
const CH = {};
CHALLENGES.forEach(c => { CH[c.id] = c; });
const SET = {};
SETS.forEach(st => { SET[st.id] = st; st.ids = CHALLENGES.filter(c => c.set === st.id).map(c => c.id); });
const setOf = cid => SET[CH[cid].set];
const setList = setId => (setId && setId !== 'all' && SET[setId]) ? SET[setId].ids.map(id => CH[id]) : CHALLENGES;
const setMax = setId => setList(setId).reduce((a, c) => a + c.max, 0);
const setCount = setId => setList(setId).length;
const canTypeOf = (def, n) => (def.canTypes ? def.canTypes[n] : def.canType);
const hasCanType = (def, ty) => def.cans.some(n => canTypeOf(def, n) === ty);
const activeTeam = () => S.teams.find(x => x.id === S.activeTeamId) || null;
const teamById = id => S.teams.find(x => x.id === id) || null;
function defFor(team, cid) { const c = CH[cid]; return (c && c.swapTo && team && team.swaps && team.swaps[cid]) ? CH[c.swapTo] : c; }
function attemptsOf(team, cid) { return (team && team.results && team.results[cid]) || []; }
function bestOf(team, cid) { const a = attemptsOf(team, cid); return a.length ? Math.max.apply(null, a.map(x => x.points)) : null; }
function isDone(team, cid) { return attemptsOf(team, cid).some(x => x.end === 'complete'); }
function doneCount(team, setId) { return team ? setList(setId).filter(c => isDone(team, c.id)).length : 0; }
function totalBest(team, setId) { return team ? setList(setId).reduce((s, c) => s + (bestOf(team, c.id) || 0), 0) : 0; }
function triedAny(team, setId) { return team ? setList(setId).some(c => attemptsOf(team, c.id).length) : false; }
function medalOf(n) { return n >= 7 ? 'gold' : n >= 5 ? 'silver' : n >= 3 ? 'bronze' : n >= 1 ? 'part' : 'none'; }
function nextMedal(n) { if (n < 1) return ['part', 1 - n]; if (n < 3) return ['bronze', 3 - n]; if (n < 5) return ['silver', 5 - n]; if (n < 7) return ['gold', 7 - n]; return null; }
function medalChip(m) { return `<span class="medal medal-${m}"><i>${m === 'none' ? '–' : m === 'part' ? '✓' : '★'}</i>${esc(t('medal_' + m))}</span>`; }
function fmtTime(sec) { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
function fmtTimeDigits(sec) { return fmtTime(sec).split('').map(ch => ch === ':' ? ':' : `<span class="dg">${ch}</span>`).join(''); }
function cpAvailable(def, done, cp) {
  if (done.includes(cp.id)) return false;
  if (def.ordered) { const i = def.cps.indexOf(cp); return def.cps.slice(0, i).every(p => done.includes(p.id)); }
  return (cp.after || []).every(id => done.includes(id));
}
function sortTeams(list, setId) {
  return list.slice().sort((a, b) => (doneCount(b, setId) - doneCount(a, setId)) || (totalBest(b, setId) - totalBest(a, setId)) || a.name.localeCompare(b.name));
}

/* ---------- badges (no effect on TEEMS points) ---------- */
const BADGES = [
  { id: 'first', color: '#24B79D', icon: 'flag' }, { id: 'firsttry', color: '#E9B21F', icon: 'star' },
  { id: 'speed', color: '#E24B2D', icon: 'bolt' }, { id: 'comeback', color: '#6656B8', icon: 'loop' },
  { id: 'planner', color: '#3D7BE0', icon: 'route' }, { id: 'crew', color: '#24B79D', icon: 'users' },
  { id: 'can', color: '#3D7BE0', icon: 'can' }, { id: 'park', color: '#6656B8', icon: 'park' },
  { id: 'ace', color: '#E24B2D', icon: 'cone' }, { id: 'reverse', color: '#F08A24', icon: 'undo' },
  { id: 'explorer', color: '#2C9FD1', icon: 'map' }, { id: 'grand', color: '#E9B21F', icon: 'trophy' }
];
function badgesOf(team) {
  if (!team) return [];
  const got = new Set();
  const all = [];
  CHALLENGES.forEach(c => attemptsOf(team, c.id).forEach(a => all.push(a)));
  if (all.length) got.add('first');
  CHALLENGES.forEach(c => {
    const a = attemptsOf(team, c.id);
    if (a[0] && a[0].end === 'complete') got.add('firsttry');
    if (a.some(x => x.end === 'complete' && x.timeUsed <= 60)) got.add('speed');
    if (a.findIndex(x => x.end === 'complete') > 0) got.add('comeback');
  });
  const perfect = Object.values(team.plans || {}).filter(p => p.quizOk && p.orderOk !== false).length;
  if (perfect >= 4) got.add('planner');
  if (team.members.length >= 2 && team.members.every(m => all.some(a => a.driver === m.id))) got.add('crew');
  const c8push = attemptsOf(team, 'C8').some(x => x.end === 'complete' && x.mode === 'C8');
  if (isDone(team, 'C2') && c8push) got.add('can');
  if (isDone(team, 'C3') && isDone(team, 'C7')) got.add('park');
  if (isDone(team, 'C4') && isDone(team, 'C5') && isDone(team, 'C6')) got.add('ace');
  if (isDone(team, 'R3') && isDone(team, 'P3') && isDone(team, 'M3')) got.add('reverse');
  if (SETS.every(st => triedAny(team, st.id))) got.add('explorer');
  if (SETS.every(st => doneCount(team, st.id) >= 7)) got.add('grand');
  return BADGES.filter(b => got.has(b.id));
}

      if (sg.t === 'say') {
        const tx = this.sayG.querySelector('text'); tx.textContent = L(sg.text);
        this.sayG.style.display = '';
        let w = 260; try { w = tx.getComputedTextLength() + 28; } catch (e) { /* ignore */ }
        this.sayG.querySelector('rect').setAttribute('width', Math.max(120, w));
      }
    }
    if (sg.t === 'wait' || sg.t === 'say') {
      this.tm += dt;
      if (sg.label) {
        this.waitRing.style.display = ''; this.waitT.style.display = '';
        this.waitT.textContent = Math.max(1, Math.ceil(sg.sec - this.tm)) + (S.lang === 'th' ? ' วิ' : 's');
        const r = 30, c = 2 * Math.PI * r; this.waitRing.setAttribute('stroke-dasharray', `${c * (1 - this.tm / sg.sec)} ${c}`);
      }
      if (this.tm >= sg.sec) this.endSeg();
      return;
    }
    if (sg.t === 'spin') {
      this.spinRing.style.display = '';
      this.acc += 360 * dt / 1.6; this.h = this.h0 + Math.min(360, this.acc);
      if (this.acc >= 360) { this.h = this.h0; this.endSeg(); }
      return;
    }
    if (sg.t === 'turn') {
      const df = angDiff(sg.to, this.h); const stp = 200 * dt;
      if (Math.abs(df) <= stp) { this.h = sg.to; this.endSeg(); } else this.h += Math.sign(df) * stp;
      return;
    }
    // drive / rev / push
    const len = this.lens[this.i];
    let target;
    if (sg.t === 'push') target = this.d - this.D < 0 ? this.tan(this.i, 0) : this.tan(this.i, this.d - this.D);
    else target = this.tan(this.i, this.d) + (sg.t === 'rev' ? 180 : 0);
    const df = angDiff(target, this.h);
    if (Math.abs(df) > 20) { this.h += Math.sign(df) * Math.min(Math.abs(df), 230 * dt); return; }
    this.h += df * Math.min(1, dt * 12);
    const v = sg.t === 'push' ? 95 : sg.t === 'rev' ? 110 : 150;
    this.d = Math.min(len, this.d + v * dt);
    if (sg.t === 'push') {
      const cp = this.pt(this.i, this.d), c0 = this.pt(this.i, 0);
      const can = this.cans[sg.can]; if (can) can.setAttribute('transform', `translate(${cp[0] - c0[0]} ${cp[1] - c0[1]})`);
      const rd = this.d - this.D;
      if (rd >= 0) { const r = this.pt(this.i, rd); this.x = r[0]; this.y = r[1]; }
      else { const a0 = this.tan(this.i, 0) * Math.PI / 180; this.x = c0[0] + Math.cos(a0) * rd; this.y = c0[1] + Math.sin(a0) * rd; }
    } else { const p = this.pt(this.i, this.d); this.x = p[0]; this.y = p[1]; }
    const pa = this.paths[this.i]; if (pa) pa.style.strokeDashoffset = len - this.d;
    if (this.d >= len) this.endSeg();
  }
  draw() {
    if (this.robot) this.robot.setAttribute('transform', `translate(${this.x.toFixed(1)} ${this.y.toFixed(1)}) rotate(${this.h.toFixed(1)})`);
    this.spinRing.setAttribute('transform', `translate(${this.x} ${this.y}) rotate(${(this.acc * 2) % 360})`);
    this.waitRing.setAttribute('transform', `translate(${this.x} ${this.y}) rotate(-90)`);
    this.waitT.setAttribute('x', this.x); this.waitT.setAttribute('y', this.y - 34);
  }
  finish() {
    this.playing = false; this.done = true;
    this.opts.onStep && this.opts.onStep(this.def.steps.length);
    this.opts.onState && this.opts.onState(false);
    this.opts.onEnd && this.opts.onEnd();
    if (this.opts.loop) this.loopT = setTimeout(() => { if (this.svg.isConnected) { this.reset(); this.play(false); } }, 1800);
  }
}

/* confetti */
const CONF = { parts: [], raf: 0 };
function confetti(n, o) {
  if (REDUCED) return; o = o || {};
  const cv = $('#confetti'); if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const cx = cv.getContext('2d'); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = o.colors || ['#24B79D', '#F4B223', '#E24B2D', '#6656B8', '#3D7BE0', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const side = o.sides ? (i % 2 ? 1 : -1) : 0;
    CONF.parts.push({
      x: o.sides ? (side < 0 ? -10 : innerWidth + 10) : (o.x != null ? o.x : innerWidth / 2) + (o.sides ? 0 : (Math.random() - 0.5) * 80),
      y: o.y != null ? o.y : innerHeight * (o.sides ? 0.7 : 0.35),
      vx: o.sides ? -side * (6 + Math.random() * 10) : (Math.random() - 0.5) * 16,
      vy: -(6 + Math.random() * (o.sides ? 14 : 12)), g: 0.28 + Math.random() * 0.12,
      w: 6 + Math.random() * 6, h: 9 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
      c: cols[(Math.random() * cols.length) | 0]
    });
  }
  if (!CONF.raf) {
    const loop = () => {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      CONF.parts = CONF.parts.filter(p => p.y < innerHeight + 40);
      CONF.parts.forEach(p => {
        p.vx *= 0.99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7))); cx.restore();
      });
      if (CONF.parts.length) CONF.raf = requestAnimationFrame(loop); else { CONF.raf = 0; cx.clearRect(0, 0, innerWidth, innerHeight); }
    };
    CONF.raf = requestAnimationFrame(loop);
  }
}

/* file saving: viewer downloads capability, or a plain download for the offline copy */
let DL = null;
if (IN_VIEWER) { try { window.claude.use('downloads').then(d => { DL = d; }).catch(() => {}); } catch (e) { /* ignore */ } }
async function saveFile(name, data, mime) {
  if (IN_VIEWER) {
    try {
      const dl = DL || await window.claude.use('downloads');
      if (!dl) { toast(t('saveUnavailable')); return false; }
      await dl.save({ filename: name, data });
      toast(t('saved')); return true;
    } catch (e) {
      if (e && e.code === 'declined') return false;
      toast(e && (e.code === 'unavailable' || e.code === 'not_granted') ? t('saveUnavailable') : t('saveFail')); return false;
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast(t('saved')); return true;
  } catch (e) { toast(t('saveFail')); return false; }
}

  animSpeed: el => { const a = FLOW && FLOW.anim; if (!a) return; a.speed = +el.dataset.sp; $$('[data-act="animSpeed"]').forEach(b => b.setAttribute('aria-pressed', b === el)); SND.fx.click(); },
  planPick: el => {
    const team = activeTeam(); const def = defFor(team, FLOW.cid); const PL = FLOW.plan; if (!PL) return;
    const id = el.dataset.id; const expected = def.cps[PL.order.length];
    if (!expected) return;
    if (id === expected.id) { PL.order.push(id); SND.fx.good(); if (PL.order.length === def.cps.length) SND.fx.ding(); }
    else { PL.mistakes++; PL.bad = id; SND.fx.wrong(); }
    recordPlan(def); render();
  },
  quizPick: el => {
    const team = activeTeam(); const def = defFor(team, FLOW.cid); const PL = FLOW.plan; if (!PL || PL.qpick != null) return;
    PL.qpick = +el.dataset.i; def.quiz.a[PL.qpick].ok ? SND.fx.good() : SND.fx.wrong();
    recordPlan(def); render();
  },
  planRedo: () => { const team = activeTeam(); FLOW.plan = initPlan(defFor(team, FLOW.cid)); SND.fx.click(); render(); },
  tick: el => { const CK = FLOW.check; if (!CK) return; const k = el.dataset.k; const i = CK.ticks.indexOf(k); if (i >= 0) CK.ticks.splice(i, 1); else { CK.ticks.push(k); } SND.fx.tap(); render(); },
  pickDriver: el => { const CK = FLOW.check; CK.driver = el.dataset.id; if (CK.spotter === CK.driver) CK.spotter = null; SND.fx.tap(); render(); },
  pickSpotter: el => { const CK = FLOW.check; CK.spotter = el.dataset.id || null; SND.fx.tap(); render(); },
  startRun: () => { SND.unlock(); startRun(); },
  runCp: el => {
    if (!RUN || !RUN.started || RUN.ended || RUN.finishing || RUN.hold) return;
    const p = RUN.def.cps.find(x => x.id === el.dataset.id); if (!p) return;
    if (!cpAvailable(RUN.def, RUN.done, p)) { SND.fx.wrong(); shake(el); return; }
    if (p.hold) { RUN.hold = { id: p.id, sec: p.hold, start: performance.now(), lastWhole: 0 }; SND.fx.tap(); runDyn(); }
    else completeCp(p.id);
  },
  runHoldCancel: () => { if (!RUN || !RUN.hold) return; RUN.hold = null; SND.fx.wrong(); runDyn(); },
  runUndo: () => { if (!RUN || RUN.ended || RUN.finishing) return; if (RUN.hold) { RUN.hold = null; } else if (RUN.done.length) { RUN.done.pop(); } else return; SND.fx.tap(); runDyn(); },
  runFault: el => { if (!RUN || !RUN.started || RUN.ended || RUN.finishing) return; const f = el.dataset.f; SND.fx.click(); confirmBox(t('confirmFault'), t('confirmFaultText', { f: L(FAULTS[f]) }), t('yesFault'), () => endRun('fault', f)); },
  runEnd: () => { if (!RUN || !RUN.started || RUN.ended || RUN.finishing) return; SND.fx.click(); confirmBox(t('confirmEnd'), t('confirmEndText'), t('yesEnd'), () => endRun('stopped')); },
  runAbort: () => { if (!RUN || RUN.ended || RUN.finishing) return; SND.fx.click(); confirmBox(t('confirmAbort'), t('confirmAbortText'), t('yesAbort'), () => { abortRun(); FLOW.step = 'check'; FLOW.check = null; render(); }); },
  runCanReset: () => { if (!RUN || !RUN.started || RUN.ended) return; RUN.canResets++; SND.fx.tap(); const c = $('#can-resets'); if (c) c.textContent = t('canResets', { n: RUN.canResets }); },
  fullscreen: () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) { /* optional */ } },
  tag: el => { const team = activeTeam(); if (!team || !FLOW || !FLOW.last) return; const a = attemptsOf(team, FLOW.cid)[FLOW.last.idx]; if (!a) return; a.tags = a.tags || []; const k = el.dataset.t; const i = a.tags.indexOf(k); if (i >= 0) a.tags.splice(i, 1); else a.tags.push(k); save(); el.setAttribute('aria-pressed', a.tags.includes(k)); SND.fx.tap(); },
  tryAgain: () => { FLOW.step = 'check'; FLOW.check = null; SND.fx.click(); render(); try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) { /* ignore */ } },
  nextMission: () => { const ids = setOf(FLOW.cid).ids; const n = ids[ids.indexOf(FLOW.cid) + 1]; SND.fx.click(); if (n) openFlow(n); else { S.ui.boardSet = setOf(FLOW.cid).id; go('board'); } },
  ceremony: () => { SND.unlock(); startCeremony(); },
  cerNext: () => cerNext(),
  cerClose: () => { CER = null; renderCer(); SND.fx.click(); },
  rpSuggest: () => { const team = teamById(REPORT.teamId); if (!team) return; const member = team.members.find(m => m.id === REPORT.memberId) || null; const txt = suggestComment(team, member); team.comments = team.comments || {}; team.comments[commentKey(member)] = txt; save(); SND.fx.good(); render(); },
  rpCopy: () => { const team = teamById(REPORT.teamId); if (!team) return; const member = team.members.find(m => m.id === REPORT.memberId) || null; copyText(lineText(team, member), $('#rp-line')); },
  rpImage: async () => { const team = teamById(REPORT.teamId); if (!team) return; const member = team.members.find(m => m.id === REPORT.memberId) || null; SND.fx.click(); const blob = await shareCardBlob(team, member); if (blob) saveFile(`Robomania_${fileSafe(member ? member.name : team.name)}.png`, blob, 'image/png'); },
  rpHtml: () => { const team = teamById(REPORT.teamId); if (!team) return; const member = team.members.find(m => m.id === REPORT.memberId) || null; SND.fx.click(); saveFile(`Robomania_Report_${fileSafe(member ? member.name : team.name)}.html`, reportHTMLDoc(team, member), 'text/html'); },
  rpPrint: () => { try { window.print(); } catch (e) { /* ignore */ } },
  setAttempts: el => { S.settings.attempts = +el.dataset.v; save(); SND.fx.tap(); render(); },
  setLang: el => { S.lang = el.dataset.v; save(); SND.fx.tap(); render(); },
  setTheme: el => { S.theme = el.dataset.v; save(); SND.fx.tap(); render(); },
  backup: () => { SND.fx.click(); const d = new Date().toISOString().slice(0, 10); saveFile(`robomania-backup-${d}.json`, JSON.stringify(S, null, 2), 'application/json'); },
  restore: () => { const f = $('#restore-file'); if (f) f.click(); },
  resetAll: () => confirmBox(t('resetAll'), t('confirmResetAll'), t('resetAll'), () => { const keep = { lang: S.lang, theme: S.theme, sound: S.sound, volume: S.volume }; S = Object.assign(defaults(), keep); save(); toast(t('resultsCleared')); render(); })
};
const INP = {
  rpComment: el => {
    const team = teamById(REPORT.teamId); if (!team) return; const member = team.members.find(m => m.id === REPORT.memberId) || null;
    team.comments = team.comments || {}; team.comments[commentKey(member)] = el.value; save();
    const v = $('#rp-comment-view'); if (v) v.innerHTML = esc(el.value) || '<span class="no">—</span>';
    const l = $('#rp-line'); if (l) l.value = lineText(team, member);
  },
  setTime: el => { S.settings.attemptSec = +el.value; save(); const o = $('#s-time-o'); if (o) o.textContent = fmtTime(S.settings.attemptSec); },
  setVol: el => { S.volume = +el.value; save(); SND.setVolume(S.volume); const o = $('#s-vol-o'); if (o) o.textContent = Math.round(S.volume * 100) + '%'; },
  setOrg: el => { S.settings.org = el.value; save(); },
  setTeacher: el => { S.settings.teacher = el.value; save(); }
};
const CHG = {
  rpTeam: el => { REPORT.teamId = el.value; REPORT.memberId = ''; SND.fx.tap(); render(); },
  rpMember: el => { REPORT.memberId = el.value; SND.fx.tap(); render(); }
};

/* ---------- boot ---------- */
function boot() {
  applyTheme();
  const h = (location.hash || '').replace('#', '');
  const found = Object.keys(HASH).find(k => HASH[k] === h);
  if (found) VIEW = { name: found };
  if (S.activeTeamId && !activeTeam()) S.activeTeamId = S.teams[0] ? S.teams[0].id : null;
  render();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (MENU && !e.target.closest('.menu') && !(el && el.dataset.act === 'teamMenu')) closeMenu();
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('pointerdown', () => { SND.unlock(); musicCheck(); }, { once: true });
  document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
    if (e.target.id === 'restore-file' && e.target.files && e.target.files[0]) {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const d = JSON.parse(fr.result);
          if (!d || d.v !== 1 || !Array.isArray(d.teams)) throw new Error('bad');
          const def = defaults(); S = Object.assign(def, d, { settings: Object.assign(def.settings, d.settings || {}) });
          save(); toast(t('restored')); SND.fx.good(); render();
        } catch (err) { toast(t('restoreFail')); SND.fx.wrong(); }
      };
      fr.readAsText(e.target.files[0]);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (modalClose) closeModal(); else if (MENU) closeMenu(); else if (CER) { CER = null; renderCer(); } }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  window.addEventListener('resize', closeMenu);
}
boot();

})();
</script>
