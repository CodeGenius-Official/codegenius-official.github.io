async function tone(good){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const ctx=audio;await ctx.resume();if(!sound||audio!==ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=good?660:240;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.start();o.stop(ctx.currentTime+.19)}catch{sound=false;paint()}}
function muteAudio(){sound=false;const ctx=audio;audio=null;if(ctx){try{Promise.resolve(ctx.close()).catch(()=>{})}catch{}}}

function view(i){return scanned===i?(mode===1?'Bones':cargo[i]):'Shell'}
function selectLens(n){mode=n;paint()}
function scan(i){scanned=i;paint()}
function choose(i){if(busy||mission>=3)return;busy=true;const correct=cargo[i]===goals[mission];feedback=correct?'correct':'wrong';tone(correct);paint();const token=epoch;setTimeout(()=>{if(token!==epoch)return;if(correct)mission++;feedback=mission===3?'win':'ready';busy=false;paint()},650)}
function reset(){epoch++;mode=1;scanned=-1;mission=0;busy=false;feedback='ready';cargo=permutations[Math.floor(Math.random()*6)].slice();paint()}
function go(n){step=n;for(let i=0;i<5;i++)$('section'+i).hidden=i!==n;paint()}

 $('round').textContent=C().round+' '+Math.min(mission+1,3)+' / 3';$('mission').textContent=mission===3?C().done:C().find+' '+C().items[goals[mission]];$('goalIcon').textContent=mission===3?'✓':symbols[goals[mission]];$('bar').style.width=(mission/3*100)+'%';$('lensA').setAttribute('aria-pressed',String(mode===1));$('lensB').setAttribute('aria-pressed',String(mode===2));$('feedback').textContent=C()[feedback];
 names.forEach((n,i)=>{const el=$('alien'+i);el.classList.toggle('scanned',scanned===i);$('img'+i).src=ART[n][view(i)];$('img'+i).alt=n+' — '+(view(i)==='Shell'?C().shell:view(i)==='Bones'?C().bones:C().items[cargo[i]]);$('scan'+i).textContent=C().scan;$('scan'+i).setAttribute('aria-pressed',String(scanned===i));$('choose'+i).textContent=C().choose;$('choose'+i).disabled=busy||mission===3;});

 C().checks.forEach((text,i)=>{let span=$('checkText'+i);if(!span){const l=document.createElement('label');l.className='checkline';const input=document.createElement('input');input.type='checkbox';input.id='check'+i;input.onchange=()=>input.checked?checks.add(i):checks.delete(i);span=document.createElement('span');span.id='checkText'+i;l.append(input,span);$('checks').append(l)}$('check'+i).checked=checks.has(i);span.textContent=text});$('roleStatus').textContent=roleNotice?C().roleChanged:'';$('maker').textContent=C().player+' '+(roles?2:1);$('detective').textContent=C().player+' '+(roles?1:2);$('revealNova').textContent=$('novaCode').hidden?C().showNova:C().hideNova;}
