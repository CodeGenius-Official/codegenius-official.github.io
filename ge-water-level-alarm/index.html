<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GE-RO-10 | เครื่องเตือนระดับน้ำ</title>
<style>:root{color-scheme:light;--ink:#232342;--deep:#302872;--paper:#f8f5eb;--white:#fffef8;--wash:#eeebfa;--line:#d7d1e7;--active:#ffdb74;--green:#14694f;--bad:#942c42}
html[data-kit=water]{--ink:#163742;--deep:#095c64;--wash:#e1f4f1;--line:#b7d8d5;--active:#ffdb74}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.48 "Noto Sans Thai",Tahoma,system-ui,sans-serif}h1,h2,p{margin:0}a,button{font:inherit;color:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #0066ac;outline-offset:3px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}.frame{width:min(1450px,calc(100% - 64px));margin:auto}
.mast{border-bottom:1px solid var(--line);background:var(--white)}.head,.brand,.tools,.navigation{display:flex;align-items:center}.head{justify-content:space-between;gap:12px;min-height:71px;padding:8px 0}.brand{gap:12px}.brand img{width:49px;height:49px;object-fit:contain}.brand strong,.brand small{display:block;line-height:1.28}.brand strong{font-size:1.02rem;letter-spacing:.07em}.brand small{font-size:.68rem;letter-spacing:.09em;font-weight:800}.tools{gap:6px;flex-wrap:wrap;justify-content:flex-end}.tool,.primary,.choice,.chapters button,.link{min-height:44px;border:1px solid var(--line);border-radius:7px;background:var(--white);padding:7px 14px;font-weight:750}.primary{background:var(--deep);border-color:var(--deep);color:white}.tool[aria-pressed=true],.choice[aria-pressed=true]{background:var(--active);border-color:var(--ink)}.chapters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:16px 0}.chapters button{text-align:left;padding:7px 10px;white-space:normal;line-height:1.2;font-size:.9rem;display:flex;gap:7px;align-items:center}.chapters button b{font-size:.7em;opacity:.76}.chapters button[aria-current=step]{color:#fff;background:var(--deep);border-color:var(--deep)}.slide{display:grid;grid-template-columns:minmax(320px,.86fr) minmax(0,1.14fr);background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:clamp(415px,64vh,665px)}.copy{padding:clamp(20px,3.2vw,48px);display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}.slug{color:var(--deep);letter-spacing:.09em;font-size:.78rem;font-weight:900;text-transform:uppercase}.copy h1{font-size:clamp(1.9rem,3.45vw,3.65rem);line-height:1.18;letter-spacing:-.025em;overflow-wrap:anywhere}.copy h1:focus{outline:none}.alt{font-weight:700;font-size:clamp(.94rem,1.5vw,1.22rem)}.lead{max-width:42ch;font-size:clamp(1rem,1.6vw,1.25rem)}#task{display:grid;gap:9px;font-size:clamp(.94rem,1.25vw,1.12rem)}#task:empty{display:none}.prompt{font-weight:800}.controls{display:flex;flex-wrap:wrap;gap:7px}.choice{text-align:left;line-height:1.25}.choice.answer{border-color:var(--green);background:#def2e6}.choice.wrong{border-color:var(--bad);background:#fbe7ec}.feedback{border-left:4px solid var(--deep);background:var(--wash);padding:8px 11px;border-radius:4px;font-weight:700}.feedback:empty{display:none}.link{display:inline-flex;align-items:center;text-decoration:none}.link:hover{text-decoration:underline}.link.main{background:var(--deep);color:#fff;border-color:var(--deep)}
.visual{background:var(--wash);position:relative;display:grid;place-items:center;min-width:0;overflow:hidden}.art{width:100%;align-self:stretch;display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:center;background:var(--wash)}.scene{display:block;width:100%;max-height:min(57vh,550px);min-height:215px}.waves{opacity:0}.on .waves{opacity:1;animation:tick .46s ease-out 2}.scene-tags{display:flex;align-items:flex-start;gap:8px;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);background:#fffef6;min-height:52px;line-height:1.3}.scene-tags span{font-weight:800}.scene-tags span:last-child{text-align:right}.scene-tags span.active{color:var(--bad)}
.canvas{width:100%;padding:clamp(17px,3.4vw,47px);min-width:0}.stack{display:grid;gap:10px}.tile{display:grid;grid-template-columns:45px 1fr;align-items:center;gap:12px;padding:12px 15px;background:var(--white);border:1px solid var(--line);border-radius:9px;min-width:0}.tile b{display:block;font-size:clamp(1.02rem,1.65vw,1.45rem)}.tile p{font-size:clamp(.91rem,1.23vw,1.1rem)}.count{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--active);font:800 1rem/1 system-ui;color:#29233b}.codecanvas{background:#202d42;border:1px solid #152237;border-radius:13px;padding:20px;color:white;display:grid;gap:10px}.codecanvas code{display:block;font:700 clamp(1.03rem,2vw,1.6rem)/1.25 ui-monospace,monospace;padding:10px;border-radius:6px;background:#664ca3}.codecanvas code small{font:inherit;color:#fff2ab}.block{border-radius:6px;background:#13735c;padding:9px 11px;font-weight:750}.codecanvas p{font-size:.98rem;color:#ecf2ff}.nudge{border-top:1px solid var(--line);padding-top:9px}.sheet{margin:0;padding-left:1.4em}.sheet li{padding:.19em 0}.navigation{justify-content:space-between;gap:10px;padding:12px 0 22px}.navigation span{font:700 .89rem/1 system-ui;letter-spacing:.1em}.dialogTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}dialog{width:min(600px,calc(100% - 30px));border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--white);padding:22px}dialog::backdrop{background:#1820349c}#noteBody{display:grid;gap:11px}
@keyframes tick{0%{opacity:.45}100%{opacity:1}}@media(prefers-reduced-motion:reduce){.on .waves{animation:none}}
@media(max-width:950px){.frame{width:calc(100% - 36px)}.chapters button{justify-content:center;text-align:center;flex-direction:column;gap:3px;padding:6px 4px}.copy{padding:24px}}
@media(max-width:680px){.frame{width:calc(100% - 22px)}.slide{grid-template-columns:1fr;min-height:0}.copy{padding:18px;gap:8px}.visual{order:-1}.scene{max-height:37vh;min-height:160px}.scene-tags{min-height:43px;padding:8px 12px;font-size:.83rem}.brand{gap:5px}.brand img{width:33px;height:33px}.brand strong{font-size:.7rem}.brand small{font-size:.53rem}.head{min-height:56px;gap:4px}.tool,.primary{padding-inline:9px;font-size:.88rem}.tools{gap:4px}.chapters{margin:9px 0;gap:3px}.chapters button{font-size:.65rem;overflow-wrap:anywhere}.canvas{padding:13px}.tile{padding:8px 10px}.codecanvas{padding:13px}.navigation{padding:9px 0 16px}}

.brand img{width:91px;height:48px}.canvas h2{font-size:clamp(1.25rem,2.5vw,2.1rem);line-height:1.24}.picker-tools{justify-content:space-between}.actions-note{font-size:.9rem;font-weight:720}@media(max-width:680px){.brand img{width:55px;height:33px}.visual{order:initial}.chapters{grid-template-columns:repeat(4,minmax(0,1fr))}.chapters button{min-height:43px;flex-direction:row;text-align:left;font-size:.72rem;justify-content:flex-start;padding:4px 6px}.brand strong{letter-spacing:.02em}.brand small{letter-spacing:.02em}}@media(max-width:360px){.brand strong{display:none}.brand small{max-width:68px}}
