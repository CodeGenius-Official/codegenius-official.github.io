<title>GE Digital Footprint Part 1</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#f4fbff,#fff4c9);color:var(--ink);letter-spacing:0}button,textarea,input{font:inherit}button{min-height:48px;border:3px solid var(--line);border-radius:8px;background:white;box-shadow:0 5px 0 var(--line);padding:9px 12px;font-weight:900;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--sun)}.quiet{background:#eaf8ff}.good{background:var(--green)}.danger{background:#ffe1df}.hidden{display:none!important}.tiny{font-size:13px;color:var(--muted);line-height:1.35}.sr{position:absolute;left:-9999px}

ge{display:grid;gap:11px}.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:34px;height:13px;border:2px solid var(--line);border-radius:99px;background:white}.dot.now{background:var(--sun)}.dot.done{background:var(--green)}.question{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.tag{background:var(--ink);color:white;border-radius:8px;padding:10px;font-weight:900}.question h2{margin:0 0 7px;font-size:clamp(24px,3vw,42px);line-height:1.05}.question p{margin:0;font-size:clamp(17px,1.5vw,23px);line-height:1.34}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;min-height:74px;border:3px solid var(--line);border-radius:8px;background:white;padding:10px;font-weight:850}.letter{display:grid;place-items:center;width:34px;height:34px;border:3px solid var(--line);border-radius:50%;background:var(--sun);font-weight:900}.choice.correct{background:#dcffe7}.choice.dim{opacity:.55}.preReveal .revealOnly{display:none}.sceneWrap{display:grid;grid-template-columns:1fr;gap:12px}.scene{position:relative;min-height:560px;overflow:hidden;border:4px solid var(--line);border-radius:8px;background:linear-gradient(160deg,#fffdf4,#eaf8ff 40%,#fff1c2)}.scene:before{content:"";position:absolute;inset:16px;border:2px dashed rgba(36,48,70,.25);border-radius:18px}.caption{display:grid;grid-template-columns:minmax(280px,1fr) minmax(240px,330px);gap:10px}.answerZone,.summaryCard{border:3px solid var(--line);border-radius:8px;background:white;padding:12px}.answerZone h3{margin:0 0 7px}.answerZone p{margin:0 0 8px;line-height:1.38}.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;min-height:112px}.barBox{text-align:center;font-weight:900}.bar{height:14px;min-height:14px;background:#cfd7e1;border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}.bar.top{background:var(--green)}.controls{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.summaryGrid,.toolkit{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.card,.tool{border:3px solid var(--line);border-radius:8px;background:white;padding:11px}.tool{border-left:10px solid var(--blue);font-weight:850}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(36,48,70,.62);padding:18px}.modalBox{max-width:760px;max-height:86vh;overflow:auto;border:4px solid var(--line);border-radius:8px;background:var(--paper);padding:16px}.resultLine{border-top:2px solid #d8dee8;padding:8px 0}
.paper,.node,.copy,.ticket,.panel,.person,.world,.warning,.stamp{position:absolute;border:4px solid var(--line);border-radius:8px;background:white;box-shadow:0 9px 0 rgba(36,48,70,.18);font-weight:900;text-align:center;white-space:pre-line}.paper{width:132px;min-height:118px;padding:10px}.node{width:118px;min-height:82px;padding:10px;display:grid;place-items:center}.copy{width:120px;min-height:92px;padding:10px}.ticket{padding:11px;min-width:150px;background:#fff6bd}.panel{width:255px;min-height:145px;padding:14px;text-align:left}.person{width:88px;height:88px;border-radius:24px;display:grid;place-items:center}.person:before{content:"";width:30px;height:30px;border:3px solid var(--line);border-radius:50%;background:var(--sun);display:block}.world{width:120px;height:92px;padding:10px;display:grid;place-items:center}.warning{padding:10px;background:#ffe1df}.stamp{padding:8px 11px;background:var(--green)}.robot{position:relative;width:74px;height:58px;margin:0 auto 8px}.robot:before{content:"";position:absolute;left:18px;top:10px;width:38px;height:28px;border:3px solid var(--line);border-radius:8px;background:var(--blue)}.robot:after{content:"";position:absolute;left:25px;top:1px;width:24px;height:13px;border:3px solid var(--line);border-radius:7px;background:var(--sun)}.eye{position:absolute;top:21px;width:7px;height:7px;border-radius:50%;background:var(--line);z-index:1}.eye.l{left:29px}.eye.r{right:29px}.body{position:absolute;left:12px;right:12px;bottom:0;height:20px;border:3px solid var(--line);border-radius:8px;background:#fff}.reportPhoto{height:72px;border:3px solid var(--line);border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--sun));margin-bottom:8px}.labelLine{height:13px;border-radius:4px;background:#dfe7ef;margin:6px 0}.labelLine.redacted{background:var(--line)}.deleted{opacity:.22;filter:grayscale(1);background:#f4f4f4}.deleted:after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:5px solid var(--red);transform:rotate(-12deg)}.arrow{position:absolute;height:9px;background:var(--blue);border:3px solid var(--line);border-radius:99px;transform-origin:left center;animation:grow .55s both}.arrow:after{content:"";position:absolute;right:-12px;top:-8px;border-left:16px solid var(--line);border-top:10px solid transparent;border-bottom:10px solid transparent}.arrow.stop{background:var(--red)}.arrow.soft{background:var(--sun)}.birth{animation:birth .55s both}.fadeOut{animation:fadeOut .5s both}.pulse{animation:pulse .9s infinite alternate}.stepRail{position:absolute;left:16px;right:16px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stepMark{border:3px solid var(--line);border-radius:8px;background:white;padding:7px;text-align:center;font-weight:900;opacity:.45}.stepMark.on{opacity:1;background:var(--sun)}.stepMark.done{opacity:1;background:#dcffe7}@keyframes grow{from{width:0;opacity:.2}to{opacity:1}}@keyframes birth{from{transform:translateY(24px) scale(.72);opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:.18;transform:scale(.84);filter:grayscale(1)}}@keyframes pulse{to{transform:scale(1.05)}}@media(max-width:1000px){.setup,.app,.sceneWrap{grid-template-columns:1fr}.rosterPanel{position:relative;top:auto;max-height:none}.caption{grid-template-columns:1fr}.roster{max-height:44vh}.choices{grid-template-columns:1fr 1fr}.scene{min-height:530px}}@media(max-width:640px){header{grid-template-columns:1fr}.actions{justify-content:flex-start}.choices{grid-template-columns:1fr}.student{grid-template-columns:minmax(80px,1fr) repeat(4,36px)}.scene{min-height:580px}.paper,.node,.copy,.ticket,.panel,.person,.world,.warning,.stamp{transform:scale(.88);transform-origin:center}.stepRail{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<header>
  <div><h1 id="appTitle"></h1><p id="appSub" class="sub"></p></div>
  <div class="actions">
    <button id="lang" class="quiet" aria-label="Switch language"></button>
    <button id="capture" class="quiet"></button>
    <button id="reset" class="danger"></button>
  </div>
</header>
<main>
  <section id="setup" class="setup band" aria-labelledby="setupTitle">
    <div>
      <h2 id="setupTitle"></h2>
      <p id="setupNote" class="tiny"></p>
      <label class="sr" for="names" id="namesLabel"></label>
      <textarea id="names"></textarea>
      <p id="rosterError" class="tiny" role="alert"></p>
      <button id="loadNames" class="primary"></button>
    </div>
    <div>
      <h2 id="scenarioTitle"></h2>
      <p id="scenarioNote" class="tiny"></p>
      <div id="scenarioPick" class="scenarioPick"></div>
    </div>
  </section>
  <section id="app" class="app hidden">
    <aside id="rosterPanel" class="rosterPanel band" aria-live="polite">
      <div class="actions"><button id="toggleRoster" class="quiet"></button><button id="reveal" class="primary"></button></div>
      <div id="gate" class="gate"></div>
      <p id="now" class="tiny"></p>
      <div id="roster" class="roster"></div>
    </aside>
    <section id="activity" class="stage band preReveal">
      <div id="dots" class="dots" aria-hidden="true"></div>
      <div class="question"><div id="tag" class="tag"></div><div><h2 id="qtitle"></h2><p id="qbody"></p></div></div>
      <div id="choices" class="choices"></div>
      <div class="sceneWrap">
        <div id="scene" class="scene revealOnly" role="img"></div>
        <div class="caption">
          <div id="answerZone" class="answerZone revealOnly"><h3 id="answerTitle"></h3><p id="explain"></p><p id="answer" class="tiny"></p></div>
          <div id="dist" class="dist revealOnly" aria-label="Anonymous answer distribution"></div>
          <div class="controls revealOnly">
            <button id="back" class="quiet"></button><button id="next" class="quiet"></button><button id="play" class="good"></button><button id="replay" class="quiet"></button><button id="try" class="quiet"></button><button id="nextQ" class="primary"></button>
          </div>
        </div>
      </div>
      <div class="actions"><button id="summary" class="quiet"></button></div>
    </section>
    <section id="summaryPanel" class="band hidden">
      <h2 id="summaryTitle"></h2><p id="summaryLead"></p>
      <div id="toolkit" class="toolkit"></div>
      <h3 id="namedTitle"></h3><p id="namedWarn" class="gate"></p>
      <div id="summaryGrid" class="summaryGrid"></div>
      <button id="returnActivity" class="quiet"></button>
    </section>
  </section>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalBox"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="closeModal" class="quiet"></button></div></div>

const ITEMS=[
{id:'sendSaveForwardDelete',core:1,correct:1,title:['ส่งต่อแล้วเกิดอะไรขึ้น','What happens after forwarding?'],body:['ออมส่งรูปให้เพื่อน เพื่อนกดบันทึก แล้วส่งต่ออีกที ถ้าออมลบรูปต้นฉบับภายหลัง อะไรยังอาจอยู่?','Aom sends a photo to a friend. The friend saves a copy and forwards it. If Aom later deletes the original, what may still exist?'],choices:[['ไม่มีอะไรเหลือเลย','Nothing remains'],['สำเนาที่เพื่อนบันทึกหรือส่งต่ออาจยังอยู่','Saved or forwarded copies may still exist'],['รูปจะกลายเป็นสาธารณะเสมอ','It always becomes public'],['ลบแล้วทุกคนจะลืมทันที','Everyone forgets immediately']],steps:[['1 ส่งการ์ดรูปต้นฉบับ','1 Send the original photo card'],['2 เพื่อนบันทึกสำเนาแยกของตัวเอง','2 Friend saves an independent copy'],['3 สำเนาถูกส่งต่อไปยังอีกหน้าต่าง','3 The copy is forwarded to another window'],['4 ลบต้นฉบับแล้ว สำเนาที่แยกไว้ยังอยู่','4 Deleting the original leaves independent copies']],tool:['คิดก่อนส่ง เพราะ สำเนาแยก อาจเดินทางต่อได้','Think before sending: independent copies can keep travelling.']},

{id:'permissionDestination',core:1,correct:3,title:['อนุญาตแล้ว ใช้ได้ทุกที่ไหม','Does permission work everywhere?'],body:['เพื่อนอนุญาตให้ใช้รูปในรายงานกลุ่ม แต่ครูอยากนำไปลงเพจโรงเรียน ควรทำอย่างไร?','A friend allowed a photo in a group report. The teacher wants to post it on the school page. What should happen?'],choices:[['ใช้ได้เลย เพราะเคยอนุญาตแล้ว','Use it; permission was already given'],['ส่งให้คนอื่นตัดสินแทน','Let someone else decide'],['ลบชื่อเพื่อนก็พอ','Just remove the name'],['ขออนุญาตใหม่สำหรับปลายทางใหม่','Ask again for the new destination']],steps:[['บัตรอนุญาตเดิมเปิดได้เฉพาะรายงานกลุ่ม','Old permission opens only the group report'],['เพจโรงเรียนคือปลายทางใหม่','The school page is a new destination'],['ขออนุญาตใหม่ก่อนใช้','Ask again before using it']],tool:['การอนุญาตมีขอบเขต: รูปเดียวกัน แต่ปลายทางใหม่ ต้องถามใหม่','Permission has scope: same photo, new destination, ask again.']},
{id:'helpRoute',core:1,correct:1,title:['รูปเสี่ยงในแชต','Risky photo in chat'],body:['เห็นเพื่อนกำลังส่งต่อรูปที่ทำให้คนอื่นอาย วิธีที่ดูแลร่องรอยดิจิทัลคือข้อใด?','You see classmates forwarding a photo that could embarrass someone. Which action helps protect that person’s digital footprint?'],choices:[['ส่งต่อเพื่อถามหลายคน','Forward it to ask more people'],['หยุดส่งต่อ บอกผู้ใหญ่ที่ไว้ใจ และช่วยลบเท่าที่ทำได้','Stop forwarding, tell a trusted adult, and help remove what you can'],['กดหัวเราะแล้วเก็บไว้ดู','React and keep it'],['โพสต์เตือนพร้อมรูปเดิม','Warn others by reposting the photo']],steps:[['สังเกตรูปที่อาจทำให้ใครอาย','Notice a photo that could embarrass someone'],['หยุดส่งต่อรูปนี้','Stop forwarding this photo'],['บอกผู้ใหญ่ที่ไว้ใจเพื่อช่วยจัดการ','Tell a trusted adult who can help']],tool:['เมื่อข้อมูลอาจทำร้ายใคร หยุดส่งต่อ แล้วขอความช่วยเหลือ','When content may hurt someone, stop forwarding and get help.']},
{id:'positiveCredit',core:1,correct:0,title:['ร่องรอยดิจิทัลที่น่าเก็บ','A footprint worth keeping'],body:['คอมเมนต์แบบใดช่วยสร้างร่องรอยดิจิทัลที่ดี?','Which comment helps create a positive digital footprint?'],choices:[['ชมอย่างสุภาพและให้เครดิตเจ้าของผลงาน','Kind praise with credit to the creator'],['ล้อแรง ๆ เพื่อให้สนุก','Tease harshly for fun'],['คัดลอกงานเพื่อนโดยไม่บอก','Copy a friend’s work without credit'],['บอกข้อมูลส่วนตัวของเพื่อน','Share a friend’s personal details']],steps:[['คำชมสุภาพทำให้บทสนทนาดีขึ้น','Kind praise improves the conversation'],['เครดิตบอกว่าใครสร้างผลงาน','Credit shows who made the work'],['นี่คือร่องรอยที่อยากให้คนเห็น','This is a footprint worth seeing']],tool:['ร่องรอยดิจิทัลเป็นที่เก็บความรับผิดชอบและน้ำใจได้','A digital footprint can show responsibility and kindness.']},
{id:'deleteOriginal',core:0,correct:2,title:['ลบต้นฉบับช่วยอะไร','How does deleting the original help?'],body:['ถ้าส่งรูปผิดห้องแล้วลบทันที ข้อใดถูกต้องที่สุด?','If you send a photo to the wrong chat and delete it quickly, what is most accurate?'],choices:[['แก้ได้ครบ 100% เสมอ','It always fixes everything'],['ไม่ควรลบ เพราะไม่มีประโยชน์','Do not delete; it never helps'],['ช่วยลดต้นทาง แต่ควรบอกผู้เกี่ยวข้อง เพราะอาจมีสำเนา','It removes the original, but tell the right person because copies may exist'],['ส่งซ้ำเพื่ออธิบาย','Send it again to explain']],steps:[['มีต้นฉบับและสำเนาที่คนอื่นเก็บไว้','The original exists alongside copies that others saved.'],['ลบต้นฉบับแล้ว แต่สำเนาอาจยังอยู่','The original is deleted, but copies may remain'],['บอกผู้เกี่ยวข้องเพื่อช่วยตามเก็บ','Tell the right people so they can help']],tool:['ลบเร็วช่วยได้บางส่วน แต่ไม่รับประกันว่าสำเนาทุกที่หายไป','Quick deletion can help, but it does not guarantee every copy disappears.']},
{id:'withdrawPermission',core:0,correct:1,title:['เปลี่ยนใจเรื่องรูปของเรา','Changing your mind about your photo'],body:['เพื่อนเคยอนุญาตให้ใช้รูปในสไลด์ แต่ตอนนี้ไม่อยากให้ใช้แล้ว กลุ่มควรทำอะไร?','A friend once allowed their photo in a slide but now wants it removed. What should the group do?'],choices:[['บอกว่าเคยอนุญาตแล้ว ห้ามเปลี่ยนใจ','Say permission cannot change'],['เอารูปออกและคงงานส่วนอื่นไว้','Remove the photo and keep the other work'],['ซ่อนรูปไว้หลังข้อความเล็ก ๆ','Hide the photo behind tiny text'],['ส่งให้ทั้งห้องโหวต','Ask the whole class to vote']],steps:[['ได้ยินคำถอนอนุญาต','Hear the permission withdrawal'],['เอารูปออกจากสไลด์','Remove the photo from the slide'],['งานยังไปต่อได้โดยเคารพเจ้าของรูป','The work continues while respecting the person']],tool:['เคารพการถอนอนุญาต คือดูแลคน ไม่ใช่ทำลายงาน','Respecting withdrawn permission shows care for the person without destroying the work.']}

function maxStep(){return it().steps.length-1}function votingActive(){return students.length&&!rev()&&!$('activity').classList.contains('hidden')&&$('modal').classList.contains('hidden')&&$('summaryPanel').classList.contains('hidden')}
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}function pos(n,l,t,w){n.style.left=l;n.style.top=t;if(w)n.style.width=w;return n}function arrow(l,t,w,deg,c=''){const a=el('div','arrow '+c);pos(a,l,t,w);a.style.transform='rotate('+deg+'deg)';return a}function box(c,x,l,t,w){return pos(el('div',c,x),l,t,w)}function robotCard(label,l,t,c='paper'){const p=box(c,'',l,t);const r=el('div','robot');r.append(el('span','eye l'),el('span','eye r'),el('span','body'));p.append(r,el('div','',label));return p}function reportCard(redacted,l,t){const p=box('panel','',l,t);p.append(el('strong','',lang==='th'?'ใบประกาศเกม':'Game certificate'),el('div','reportPhoto'),el('div','labelLine '+(redacted?'redacted':'')),el('div','labelLine '+(redacted?'redacted':'')),el('p','tiny',redacted?(lang==='th'?'ชื่อ/ห้อง/ID ถูกปิด':'Name/class/ID hidden'):(lang==='th'?'ชื่อจริง + ห้อง + ID ยังติดมากับรูป':'Real name + class + ID still visible')));return p}function rail(labels){const r=el('div','stepRail');labels.forEach((x,i)=>{const m=el('div','stepMark',x);if(i<step)m.classList.add('done');if(i===step)m.classList.add('on');r.appendChild(m)});return r}

function renderScene(){const s=$('scene');clear(s);if(!rev())return;const id=it().id,th=lang==='th';$('scene').setAttribute('aria-label',L(it().steps[step]));if(id==='sendSaveForwardDelete'){s.append(robotCard(step>=3?(th?'ต้นฉบับถูกลบ':'Original deleted'):(th?'ต้นฉบับ':'Original'),'7%','36%','paper '+(step>=3?'deleted':'')));if(step>0)s.append(arrow('27%','45%','24%',-8),box('person birth',th?'หน้าต่างเพื่อน':'Friend window','50%','27%'),robotCard(th?'สำเนาแยก':'Independent copy','49%','57%','copy birth'));if(step>1)s.append(arrow('65%','45%','20%',15,'soft'),box('person birth',th?'อีกหน้าต่าง':'Another window','78%','42%'),robotCard(th?'สำเนาที่ส่งต่อ':'Forwarded copy','76%','62%','copy birth'));s.append(rail(th?['ส่ง','บันทึก','ส่งต่อ','ลบต้นฉบับ']:['Send','Save','Forward','Delete original']))}

else if(id==='hidePersonal'){s.append(reportCard(false,'8%','25%'));if(step>0)s.append(reportCard(true,'55%','25%'));if(step>1)s.append(box('stamp pulse',th?'แชร์ผลงานได้ปลอดภัยกว่า':'Safer to share work','42%','64%'));s.append(rail(th?['ดูข้อมูล','ปิดข้อมูล','แชร์ผลงาน']:['Inspect','Hide details','Share work']))}

else if(id==='positiveCredit'){s.append(box('panel',th?'โพสต์ผลงานเพื่อน\nคอมเมนต์: เกมนี้สนุก':'Friend’s project post\nComment: this game is fun','9%','28%'));if(step>0)s.append(box('ticket birth',th?'เครดิต: สร้างโดยเพื่อนในกลุ่ม':'Credit: made by my teammate','55%','30%'));if(step>1)s.append(box('stamp pulse',th?'ร่องรอยที่น่าเก็บ':'A footprint worth keeping','48%','62%'));s.append(rail(th?['ชมสุภาพ','ให้เครดิต','ร่องรอยดี']:['Kind praise','Credit','Good footprint']))}
else if(id==='deleteOriginal'){s.append(box('copy '+(step>0?'deleted':''),step>0?(th?'ต้นฉบับถูกลบ':'Original deleted'):(th?'ต้นฉบับ':'Original'),'8%','56%'));['บันทึก 1','บันทึก 2','ส่งต่อ'].forEach((x,i)=>s.append(box('copy birth',th?x:['Saved 1','Saved 2','Forwarded'][i],(36+i*17)+'%','56%')));if(step>1)s.append(box('warning pulse',th?'บอกผู้เกี่ยวข้อง เพราะสำเนาอาจอยู่':'Tell the right people; copies may remain','34%','24%'));s.append(rail(th?['มีหลายใบ','ลบต้นฉบับ','ตามช่วยเก็บ']:['Many copies','Delete source','Get help']))}
else{s.append(box('panel',th?'สไลด์งานกลุ่ม\n[รูปเพื่อน]\nข้อความงานยังอยู่':'Group slide\n[Friend’s photo]\nWork text remains','10%','28%'));if(step>0)s.append(box('panel birth',th?'สไลด์งานกลุ่ม\n[เอารูปออก]\nข้อความงานยังอยู่':'Group slide\n[Photo removed]\nWork text remains','56%','28%'));if(step>1)s.append(box('stamp pulse',th?'เคารพคน งานยังไปต่อ':'Respect the person; work continues','42%','65%'));s.append(rail(th?['ได้ยิน','เอารูปออก','ทำงานต่อ']:['Listen','Remove photo','Continue']))}}
function reveal(){if(!allAnswered()||rev())return;revealed[key()]=true;snapshot[key()]={};students.forEach(s=>{const a=map()[s.id];snapshot[key()][s.id]=a?{...a}:null});step=0;render()}function stepBy(d){if(!rev())return;stop();step=Math.max(0,Math.min(maxStep(),step+d));render()}function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent=tt('play')}function play(){if(!rev()||matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(timer){stop();return}$('play').textContent=tt('pause');timer=setInterval(()=>{if(step>=maxStep()){stop();return}step++;render()},1600)}function replay(){if(!rev())return;stop();step=0;render();play()}function experiment(){if(!rev())return;stop();step=step===maxStep()?0:maxStep();render()}function nextQ(){if(!rev())return;stop();if(qi<selected.length-1){qi++;cur=0;step=0;render()}else showSummary()}
function showSummary(){stop();if(!resultsUnlocked){if(!confirm(tt('resultsAck')))return;resultsUnlocked=true}$('activity').classList.add('hidden');$('summaryPanel').classList.remove('hidden');renderSummary()}function renderSummary(){clear($('toolkit'));clear($('summaryGrid'));selected.filter(id=>revealed[id]).forEach((id,i)=>{const x=ITEMS.find(item=>item.id===id);$('toolkit').appendChild(el('div','tool',(i+1)+'. '+L(x.tool)))});students.forEach(s=>{const c=el('div','card');c.appendChild(el('strong','',s.name));c.appendChild(el('p','tiny',tt('namedWarn')));const b=el('button','quiet',tt('openResult'));b.onclick=()=>openStudent(s);c.appendChild(b);$('summaryGrid').appendChild(c)})}
function openStudent(s){activeStudent=s;clear($('modalBody'));$('modalTitle').textContent=s.name;let earned=0,denom=0,done=0;selected.forEach(id=>{if(answers[id]?.[s.id])done++;if(revealed[id]){denom++;if(snapshot[id]?.[s.id]?.correct)earned++}});$('modalBody').append(el('p','',tt('score')+': '+earned+' / '+denom),el('p','',tt('played')+': '+denom+' / '+selected.length+' · '+tt('completed')+': '+done+' / '+selected.length));selected.filter(id=>revealed[id]).forEach((id,i)=>{const q=ITEMS.find(x=>x.id===id),snap=snapshot[id]?.[s.id],ans=answers[id]?.[s.id];const status=snap?(snap.correct?tt('correct'):tt('review')):tt('notAnswered');$('modalBody').appendChild(el('div','resultLine',(i+1)+'. '+L(q.title)+' - '+status+' - '+(ans?String.fromCharCode(65+ans.choice):'-')))});$('modal').classList.remove('hidden');$('closeModal').focus&&$('closeModal').focus()}
function resetAll(){if(students.length&&!confirm(tt('replaceConfirm')))return;stop();closeModal();students=[];answers={};revealed={};snapshot={};qi=0;cur=0;step=0;resultsUnlocked=false;$('names').value='';$('rosterError').textContent='';$('rosterPanel').classList.remove('collapsed');$('setup').classList.remove('hidden');$('app').classList.add('hidden');$('activity').classList.remove('hidden');$('summaryPanel').classList.add('hidden');render()}
function render(){document.documentElement.lang=lang;document.title=tt('appTitle');['appTitle','appSub','setupTitle','setupNote','loadNames','scenarioTitle','scenarioNote','answerTitle','back','next','replay','try','nextQ','summary','summaryTitle','summaryLead','namedTitle','namedWarn','returnActivity'].forEach(id=>$(id).textContent=tt(id));$('reset').textContent=tt('clear');$('closeModal').textContent=tt('close');$('namesLabel').textContent=tt('namesLabel');$('names').placeholder=tt('namesPlaceholder');$('lang').textContent=lang==='th'?'EN':'TH';$('lang').setAttribute('aria-label',lang==='th'?'Switch to English':'Switch to Thai');$('capture').textContent=capture?tt('captureOn'):tt('captureOff');$('toggleRoster').textContent=$('rosterPanel').classList.contains('collapsed')?tt('showRoster'):tt('hideRoster');$('reveal').textContent=tt('reveal');if(!timer)$('play').textContent=tt('play');renderScenarioPick();if(students.length){$('activity').classList.toggle('preReveal',!rev());renderDots();renderQuestion();renderRoster();renderDist();renderScene();$('explain').textContent=rev()?L(it().steps[step]):tt('noLeak');$('answer').textContent=rev()?tt('best')+': '+String.fromCharCode(65+it().correct)+'. '+L(it().choices[it().correct])+' · '+tt('manualHint')+' · '+tt('experiment'):tt('noLeak');$('back').disabled=!rev()||step===0;$('next').disabled=!rev()||step===maxStep();$('play').disabled=!rev();$('replay').disabled=!rev();$('try').disabled=!rev();$('nextQ').disabled=!rev();if(!$('summaryPanel').classList.contains('hidden'))renderSummary();if(activeStudent&&!$('modal').classList.contains('hidden'))openStudent(activeStudent)}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'&&!$('modal').classList.contains('hidden')){e.preventDefault();closeModal();return}if(k==='tab'&&!$('modal').classList.contains('hidden')){e.preventDefault();$('closeModal').focus&&$('closeModal').focus();return}if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.matches('textarea,input,select')||e.target.isContentEditable)return;if(capture&&votingActive()&&['a','b','c','d'].includes(k))record(cur,'abcd'.indexOf(k));if(e.target.matches('button'))return;if(rev()&&!$('activity').classList.contains('hidden')&&$('modal').classList.contains('hidden')){if(k==='arrowright')stepBy(1);if(k==='arrowleft')stepBy(-1);if(k===' '){e.preventDefault();play()}}});
$('loadNames').onclick=loadNames;$('lang').onclick=()=>{lang=lang==='th'?'en':'th';$('rosterError').textContent='';render()};$('capture').onclick=()=>{capture=!capture;render()};$('reset').onclick=resetAll;$('toggleRoster').onclick=()=>{$('rosterPanel').classList.toggle('collapsed');render()};$('reveal').onclick=reveal;$('back').onclick=()=>stepBy(-1);$('next').onclick=()=>stepBy(1);$('play').onclick=play;$('replay').onclick=replay;$('try').onclick=experiment;$('nextQ').onclick=nextQ;$('summary').onclick=showSummary;$('returnActivity').onclick=()=>{$('summaryPanel').classList.add('hidden');$('activity').classList.remove('hidden');render()};$('closeModal').onclick=closeModal;render();
</script>
