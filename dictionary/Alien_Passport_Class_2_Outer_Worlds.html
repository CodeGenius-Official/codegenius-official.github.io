  function star(x, y, r, fill) {

 function currentCode(){return 'planets = {\n'+Object.entries(inner).map(([key,value])=>'    "'+key+'": '+value+',').join('\n')+'\n}';}
 function lookupPanel(){const value=Object.hasOwn(model,lookupKey)?model[lookupKey]:null;return '<div class="panel paper"><span class="tiny-tag">KEY → VALUE</span><div class="lookup-input"><label class="sr-only" for="lookupQuery">'+escape(t('lookupName'))+'</label><input id="lookupQuery" value="'+escape(lookupKey)+'" autocomplete="off" spellcheck="false">'+button('lookup',t('readValue'),true)+'</div>'+code('year_days = planets[home_planet]')+'<div class="lookup-arrow">↓</div><div class="lookup-result" id="lookupResult">'+(value===null?'?':String(value))+'</div><p class="subtle" id="lookupNote">'+escape(value===null?t('keyMissing'):t('earthDaysPerYear'))+'</p><div class="actions">'+button('caseExample',t('tryLowercase'))+button('validKey',t('restoreKey'))+'</div></div>';}
 function passportLines(){const p=passport();return Object.entries(p).map(([key,value])=>'<button type="button" class="passport-line'+(key===selectedField?' selected':'')+'" data-action="field" data-key="'+key+'" aria-pressed="'+String(key===selectedField)+'"><strong>'+key+'</strong><span>'+escape(key==='earth_age'?(resultShown?num(value)+' '+t('earthYears'):'?'):value)+'</span></button>').join('');}
 function preview(){const p=passport();return '<div class="passport-preview"><div id="previewPortrait">'+AlienArt.renderAlien(planetIcons[p.planet],config.class===1?3:12)+'</div><div><span class="tiny-tag">EARTH VISITOR PASSPORT</span><p class="large" id="previewName">'+escape(p.name)+'</p><span class="chip" id="previewPlanet">'+escape(p.planet)+'</span></div></div><div class="passport-lines" id="previewFields">'+passportLines()+'</div>';}
 function passportCode(){const p=passport();return 'passport = {\n'+Object.entries(p).map(([key,value])=>'    "'+key+'": '+(key==='earth_age'&&!resultShown?'...':literal(value))+',').join('\n')+'\n}';}
 function fieldValue(){const p=passport();return selectedField==='earth_age'&&!resultShown?'?':literal(p[selectedField]);}
 function conversion(){const days=visitor.alien_age*all[visitor.planet],earth=calculate_earth_age(visitor.alien_age,all[visitor.planet]);return '<div class="conversion"><div class="unit-card"><span class="label">'+escape(t('stepDays'))+'</span><strong>'+(resultShown?num(days):'?')+'</strong><div class="equation">'+visitor.alien_age+' '+escape(visitor.planet+' '+t('yearUnits'))+'<br>× '+all[visitor.planet]+' '+escape(t('earthDaysPerYear'))+'</div></div><div class="between">→</div><div class="unit-card"><span class="label">'+escape(t('stepEarth'))+'</span><strong>'+(resultShown?num(earth):'?')+'</strong><div class="equation">'+(resultShown?num(days):'?')+' '+escape(t('earthDays'))+'<br>÷ 365 '+escape(t('daysPerEarthYear'))+'</div></div></div><div class="actions">'+button('result',t(resultShown?'hideResult':'showResult'),true,'aria-expanded="'+String(resultShown)+'" aria-controls="calculationCode"')+'</div><p class="subtle">'+escape(t('sameLifetime'))+'</p>';}
 function resultCode(){return 'def calculate_earth_age(alien_age, year_days):\n    days_lived = alien_age * year_days\n    earth_age = days_lived / 365\n    return earth_age';}
 function modelRows(empty=false){return '<div class="dictionary-model">'+Object.entries(all).filter(([name])=>name!=='Pluto (dwarf planet)').map(([key,value])=>{const exists=Object.hasOwn(model,key);return exists||empty?'<div class="dictionary-slot'+(exists?'':' empty')+'"><strong>'+key+'</strong><span>'+(exists?String(value):'+')+'</span></div>':'';}).join('')+'</div>'}
 function repairCards(){return '<div class="repair-grid">'+config.repairs.map((item,index)=>'<button type="button" class="repair-card" data-action="hint" data-index="'+index+'" aria-pressed="'+String(hintCards.has(index))+'"><span class="number">0'+(index+1)+'</span><strong>'+escape(local(item.title))+'</strong><small>'+escape(local(hintCards.has(index)?item.hint:item.prompt))+'</small><span class="hint-label">'+escape(t(hintCards.has(index)?'hideHint':'showHint'))+'</span></button>').join('')+'</div>';}
 function teacherCode(){if(answerMethod==='assignment')return Object.entries(outer).map(([key,value])=>'planets["'+key+'"] = '+value).join('\n');return 'planets = {\n'+Object.entries({...inner,...outer}).map(([key,value])=>'    "'+key+'": '+value+',').join('\n')+'\n}';}
 function answerPanel(){return '<div class="panel"><span class="tiny-tag">'+escape(t('teacherReference'))+'</span>'+(teacherAnswer?'<div class="method-tabs"><button type="button" data-action="method" data-method="literal" aria-pressed="'+String(answerMethod==='literal')+'">{ }</button><button type="button" data-action="method" data-method="assignment" aria-pressed="'+String(answerMethod==='assignment')+'">[key] = value</button></div>'+code(teacherCode(),'teacherCode')+'<p class="subtle">'+escape(t('bothMethods'))+'</p>':'<div class="answer-door" id="answerDoor"><span class="lock" aria-hidden="true">✦</span><h2>'+escape(t('yourCodeFirst'))+'</h2><p>'+escape(t('answerDoorCopy'))+'</p></div><pre class="code" id="teacherCode" hidden></pre>')+'<div class="actions">'+button('teacherAnswer',t(teacherAnswer?'hideTeacherCode':'showTeacherCode'),true,'id="teacherReveal" aria-expanded="'+String(teacherAnswer)+'" aria-controls="teacherCode"')+'</div></div>';}
 function renderContent(kind){
  if(kind==='arrival')return '<div class="hero-scene"><div><p class="eyebrow">'+escape(t('incoming'))+'</p><h1>'+escape(t('welcomeTitle'))+'<br><em>'+escape(t('welcomeEm'))+'</em></h1><p class="scene-intro">'+escape(t('welcomeCopy'))+'</p><div class="mission-ribbon"><span aria-hidden="true">✦</span>'+escape(t('missionOne'))+'</div></div><div class="hero-portrait">'+AlienArt.renderAlien('mercury',3)+'<div class="floating-badge badge-left"><strong>Zippy</strong><small>Mercury</small></div><div class="floating-badge badge-right"><strong>40</strong><small>'+escape(t('homeYears'))+'</small></div></div></div>';
  if(kind==='venus')return '<div class="spin-cards"><div class="spin-card"><h2>'+escape(t('oneSpin'))+'</h2><div class="fact-number">243</div><p>'+escape(t('earthDays'))+'</p></div><div class="spin-card alt"><h2>'+escape(t('oneOrbit'))+'</h2><div class="fact-number">225</div><p>'+escape(t('earthDays'))+'</p></div></div><div class="concept-strip"><span class="pill">Venus</span><span>'+escape(t('venusSpinNote'))+'</span></div><p class="fact-footer">NASA · '+escape(t('venusApprox'))+'</p>';
  if(kind==='archive')return cards(inner,'planet')+orbitPanel();
  if(kind==='lookup')return '<div class="split"><div class="panel"><span class="chip">'+escape(t('fourInner'))+'</span>'+code(currentCode())+'<p class="subtle">'+escape(t('keyCase'))+'</p></div>'+lookupPanel()+'</div>';
  if(kind==='inputs')return '<div class="split"><div class="panel"><div class="field-grid"><div class="field"><label for="visitorName">name</label><input id="visitorName" value="'+escape(visitor.name)+'" maxlength="80"></div><div class="field"><label for="visitorPlanet">planet</label><select id="visitorPlanet">'+Object.keys(inner).map(name=>'<option'+(name===visitor.planet?' selected':'')+' value="'+name+'">'+name+'</option>').join('')+'</select></div><div class="field"><label for="visitorAge">alien_age · '+escape(t('homeYears'))+'</label><input id="visitorAge" type="number" min="0" step="any" inputmode="decimal" value="'+visitor.alien_age+'"></div><div class="field"><label for="visitorPurpose">purpose</label><input id="visitorPurpose" value="'+escape(visitor.purpose)+'" maxlength="160"></div></div><p class="feedback" id="inputFeedback" aria-live="polite"></p>'+code('name = input("Alien name: ")\nhome_planet = input("Home planet: ")\nage_text = input("Home-planet age: ")\npurpose = input("Purpose of visit: ")')+'<div class="concept-strip"><span class="pill">age_text</span><span>→</span><span class="pill">float(age_text)</span><span>→</span><span class="pill">alien_age</span></div></div><div class="panel paper">'+preview()+'<p class="subtle">'+escape(t('fourInputsOnePassport'))+'</p></div></div>';
  if(kind==='converter'||kind==='ringo')return (kind==='ringo'?'<div class="concept-strip"><span class="visitor-mini">'+AlienArt.renderAlien('saturn',12)+'</span><span class="pill">Ringo</span><span class="pill">Saturn</span><span class="pill">0.4 '+escape(t('homeYears'))+'</span><span>'+escape(t('ringoFraction'))+'</span></div>':'')+'<div class="split"><div class="panel">'+conversion()+'</div><div class="panel"><p class="large">'+escape(t('oneFunction'))+'</p>'+code(resultCode(),'calculationCode')+code('year_days = planets[home_planet]\nearth_age = calculate_earth_age(alien_age, year_days)')+'<p class="subtle">'+escape(t('roundDisplayOnly'))+'</p></div></div>'+(kind==='ringo'?dataRail():'');
  if(kind==='passport')return '<div class="split"><div class="panel paper">'+preview()+'<div class="actions">'+button('result',t(resultShown?'hideResult':'showResult'),true)+'</div></div><div class="panel">'+code(passportCode(),'passportCode')+'<div class="concept-strip"><span class="pill" id="fieldRead">passport["'+selectedField+'"]</span><span>→</span><span class="pill" id="fieldValue">'+escape(fieldValue())+'</span></div><p class="subtle">'+escape(t('numbersAndStrings'))+'</p></div></div>';
  if(kind==='repair'||kind==='debug')return repairCards()+'<p class="subtle">'+escape(t('tryOwnProgram'))+'</p>'+(kind==='debug'?dataRail():'');
  if(kind==='launch')return '<div class="recap-grid"><div class="recap-card"><strong>4</strong><p>'+escape(t('innerKeys'))+'</p></div><div class="recap-card"><strong>1</strong><p>'+escape(t('calculationFunction'))+'</p></div><div class="recap-card"><strong>5</strong><p>'+escape(t('passportFields'))+'</p></div></div><div class="optional"><div><strong>my_session_1.py</strong><p class="subtle">'+escape(t('keepFirstWork'))+'</p></div>'+button('sources',t('sources'))+'</div><p class="scene-intro">'+escape(t('readyClassTwo'))+'</p>';
  if(kind==='reopen')return '<div class="files"><div class="file-card"><span class="file-icon" aria-hidden="true">◫</span><strong>my_session_1.py</strong><p>'+escape(t('yourEarlierWork'))+'</p></div><div class="between">→</div><div class="file-card"><span class="file-icon" aria-hidden="true">✦</span><strong>my_session_2.py</strong><p>Save As</p></div></div><div class="split" style="margin-top:20px"><div class="panel">'+code(currentCode())+'</div><div class="panel"><p class="large">'+escape(t('sameCodeMoreWorlds'))+'</p><div class="concept-strip"><span class="pill">Dictionary</span><span>+</span><span class="pill">Function</span><span>+</span><span class="pill">Passport</span></div><p class="subtle">'+escape(t('keepFour'))+'</p></div></div>';
  if(kind==='neptune')return '<div class="split"><div class="panel">'+orbitSVG()+'<p class="orbit-caption">'+escape(t('diagramNote'))+'</p><div class="orbit-stat"><span>Neptune '+escape(t('yearUnits'))+'</span><strong id="homeYearValue">'+num(orbitDays/60190)+'</strong></div><div class="orbit-stat"><span>'+escape(t('earthYears'))+'</span><strong id="earthYearValue">'+num(orbitDays/365)+'</strong></div><div class="actions">'+button('motion',t(motion.matches?'advanceOrbit':motionPlaying?'pauseOrbit':'playOrbit'),true,'id="playOrbit" aria-pressed="'+String(motionPlaying)+'"')+button('oneOrbit',t('oneHomeYear'))+button('resetOrbit',t('resetOrbit'))+'</div>'+'</div><div class="panel"><span class="chip">Neptune · ≈ 165 '+escape(t('earthYearsPerNeptune'))+'</span><div class="timeline"><div><div class="date">1846</div><span class="date-note">'+escape(t('discovered'))+'</span></div><span class="middle" aria-hidden="true">⟶</span><div><div class="date">2011</div><span class="date-note">'+escape(t('firstOrbitSinceDiscovery'))+'</span></div></div><p class="large">'+escape(t('oneLongYear'))+'</p><p class="subtle">NASA · '+escape(t('neptuneNote'))+'</p></div></div>';
  if(kind==='transmission')return cards(outer,'reference')+'<div class="split"><div class="panel"><span class="tiny-tag">KEY</span><p class="large">'+escape(t('englishPlanetName'))+'</p><span class="tiny-tag">VALUE</span><p class="large">'+escape(t('earthDaysPerYear'))+'</p></div><div class="panel"><p class="large">'+escape(t('dataIsYourGuide'))+'</p><p class="subtle">'+escape(t('classroomApprox'))+'</p><div class="actions">'+button('goMission',t('openMission'),true)+'</div><p class="data-note">'+escape(t('referenceUnits'))+'</p></div></div>';
  if(kind==='extend')return '<div class="split"><div class="panel">'+modelRows(true)+'<p class="model-count"><strong>4</strong> '+escape(t('originalKeys'))+' + <strong>4</strong> '+escape(t('newKeys'))+'</p></div><div class="panel"><p class="large">'+escape(t('addKeepRead'))+'</p><div class="method-tabs"><button type="button" data-action="conceptMethod" data-method="literal" aria-pressed="'+String(answerMethod==='literal')+'">{ }</button><button type="button" data-action="conceptMethod" data-method="assignment" aria-pressed="'+String(answerMethod==='assignment')+'">[key] = value</button></div><p class="scene-intro">'+escape(t(answerMethod==='literal'?'literalConcept':'assignmentConcept'))+'</p><p class="subtle">'+escape(t('bothMethods'))+'</p><span class="chip">'+escape(t('noWholeAnswerYet'))+'</span></div></div>'+dataRail();
  if(kind==='explorer')return cards(outer,'add')+'<div class="split"><div class="panel">'+modelRows()+'<p class="model-count">'+escape(t('keysInVisualModel'))+' <strong>'+Object.keys(model).length+'</strong> / 8</p><p class="subtle">'+escape(t('modelOnly'))+'</p></div>'+lookupPanel()+'</div>'+dataRail();
  if(kind==='verify')return '<div class="split"><div class="checklist">'+config.checks.map((item,index)=>'<button type="button" class="check-item" data-action="check" data-index="'+index+'" aria-pressed="'+String(selfChecks.has(index))+'"><span class="check-icon" aria-hidden="true">'+(selfChecks.has(index)?'✓':'')+'</span><span>'+escape(local(item.title))+'<small>'+escape(local(item.note))+'</small></span></button>').join('')+'<p class="subtle">'+escape(t('manualCheckNote'))+'</p></div>'+answerPanel()+'</div>'+dataRail();
  if(kind==='launch2')return '<div class="recap-grid"><div class="recap-card"><strong>8</strong><p>'+escape(t('planetKeys'))+'</p></div><div class="recap-card"><strong>1</strong><p>'+escape(t('sameFunction'))+'</p></div><div class="recap-card"><strong>5</strong><p>'+escape(t('passportFields'))+'</p></div></div><div class="optional"><label><input type="checkbox" id="plutoToggle" '+(plutoShown?'checked':'')+'> '+escape(t('plutoOptional'))+'</label>'+button('sources',t('sources'))+'</div>'+(plutoShown?'<div class="panel pluto-extra">'+AlienArt.renderAlien('pluto',15)+'<div><span class="chip">Pluto (dwarf planet)</span><p class="large">248 × 365 = 90560 '+escape(t('earthDays'))+'</p><p class="subtle">'+escape(t('plutoApprox'))+'</p><p class="subtle">Plo · 0.08 '+escape(t('homeYears'))+' → '+(resultShown?'19.85 '+escape(t('earthYears')):'?')+'</p><div class="actions">'+button('result',t(resultShown?'hideResult':'showResult'),true)+'</div></div></div>':'<p class="scene-intro">'+escape(t('missionTwoDone'))+'</p>');
  return '';
 }
 function renderScene(){const data=config.scenes[scene];$('stage').innerHTML='<section class="scene" data-kind="'+data.kind+'">'+(data.kind==='arrival'?'':sceneHeader(data))+renderContent(data.kind)+'</section>';updateOrbit();}
 function renderChrome(){document.documentElement.lang=lang;text('classTag',local(config.classLabel));$('enButton').setAttribute('aria-pressed',String(lang==='en'));$('thButton').setAttribute('aria-pressed',String(lang==='th'));text('mapButton',t('sceneMap'));text('sourcesButton',t('sources'));text('fullscreenButton',t(document.fullscreenElement?'exitFullscreen':'fullscreen'));text('restartButton',t('restart'));text('backButton',t('back'));text('nextButton',t(scene===config.scenes.length-1?'finished':'next'));$('backButton').disabled=scene===0;$('nextButton').disabled=scene===config.scenes.length-1;text('sceneCount',String(scene+1).padStart(2,'0')+' / '+config.scenes.length);text('sceneName',local(config.scenes[scene].name));$('progressFill').style.width=((scene+1)/config.scenes.length*100)+'%';$('progressBar').setAttribute('aria-valuenow',String(scene+1));$('progressBar').setAttribute('aria-label',t('sceneProgress'));text('keyboardNote',t('keyboard'));text('demoLabel',t('visualDemo'));text('mapTitle',t('sceneMap'));text('closeMap',t('close'));text('sourcesTitle',t('sources'));text('closeSources',t('close'));text('sourceNote',t('sourceNote'));text('restartTitle',t('restartTitle'));text('restartCopy',t('restartCopy'));text('cancelRestart',t('cancel'));text('confirmRestart',t('restart'));$('mapGrid').innerHTML=config.scenes.map((data,index)=>'<button type="button" data-scene="'+index+'" aria-current="'+String(index===scene)+'"><strong>'+String(index+1).padStart(2,'0')+'</strong>'+escape(local(data.name))+'</button>').join('');$('sourceLinks').innerHTML=config.sources.map(item=>'<a href="'+escape(item.url)+'" target="_blank" rel="noopener noreferrer">'+escape(local(item.title))+'<small>'+escape(local(item.note))+'</small></a>').join('');}
 function render(){renderChrome();renderScene();}
 function go(target){if(!Number.isInteger(target)||target<0||target>=config.scenes.length)return;stopMotion();teacherAnswer=false;resultShown=false;answerMethod='literal';hintCards=new Set();plutoShown=false;scene=target;if(config.class===2&&config.scenes[scene].kind==='neptune'){selectedPlanet='Neptune';orbitDays=0;}render();$('stage').focus();text('liveStatus',local(config.scenes[scene].name));}
 function reset(){stopMotion();scene=0;model={...inner};visitor={...config.visitor};selectedPlanet='Mercury';lookupKey='Mercury';selectedField='name';teacherAnswer=false;resultShown=false;answerMethod='literal';hintCards=new Set();selfChecks=new Set();plutoShown=false;orbitDays=0;render();$('stage').focus();}
 function lookup(){const key=$('lookupQuery').value.trim();lookupKey=key;renderScene();}
 function updateVisitor(event){const input=event.target;if(input.id==='visitorName')visitor.name=input.value.trim();else if(input.id==='visitorPurpose')visitor.purpose=input.value.trim();else if(input.id==='visitorPlanet'){if(!Object.hasOwn(inner,input.value))return;visitor.planet=input.value;}else if(input.id==='visitorAge'){const value=Number(input.value);if(input.value.trim()===''||!Number.isFinite(value)||value<0||!Number.isFinite(value*all[visitor.planet])){text('inputFeedback',t('validAge'));return;}visitor.alien_age=value;}else return;resultShown=false;text('inputFeedback',t('inputUpdated'));text('previewName',visitor.name);text('previewPlanet',visitor.planet);if($('previewPortrait'))$('previewPortrait').innerHTML=AlienArt.renderAlien(planetIcons[visitor.planet],3);if($('previewFields'))$('previewFields').innerHTML=passportLines();}
 async function fullscreen(){try{if(document.fullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();}else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('unavailable');renderChrome();}catch(_){notice(t('fullscreenUnavailable'));}}
 $('stage').addEventListener('click',event=>{const element=event.target.closest('[data-action]');if(!element)return;const action=element.dataset.action;
  if(action==='planet'){if(!Object.hasOwn(inner,element.dataset.planet))return;stopMotion();selectedPlanet=element.dataset.planet;orbitDays=0;renderScene();}
  else if(action==='motion'){if(motion.matches){orbitDays+=all[selectedPlanet];updateOrbit();}else if(motionPlaying){stopMotion();updateOrbit();}else{motionPlaying=true;lastFrame=null;updateOrbit();frameId=requestAnimationFrame(orbitFrame);}}
  else if(action==='oneOrbit'){stopMotion();orbitDays+=all[selectedPlanet];updateOrbit();}
  else if(action==='resetOrbit'){stopMotion();orbitDays=0;updateOrbit();}
  else if(action==='lookup')lookup();
  else if(action==='caseExample'){lookupKey='mercury';renderScene();}
  else if(action==='validKey'){lookupKey='Mercury';renderScene();}
  else if(action==='field'){if(Object.hasOwn(passport(),element.dataset.key)){selectedField=element.dataset.key;renderScene();}}
  else if(action==='result'){resultShown=!resultShown;renderScene();}
  else if(action==='hint'){const index=Number(element.dataset.index);if(!Number.isInteger(index)||index<0||index>=config.repairs.length)return;hintCards.has(index)?hintCards.delete(index):hintCards.add(index);renderScene();}
  else if(action==='add'){const name=element.dataset.planet;if(config.class!==2||!Object.hasOwn(outer,name))return;model[name]=outer[name];lookupKey=name;renderScene();}
  else if(action==='reference'){const name=element.dataset.planet;if(Object.hasOwn(outer,name))notice(name+' · '+outer[name]+' '+t('earthDaysPerYear'));}
  else if(action==='goMission')go(3);
  else if(action==='conceptMethod'||action==='method'){if(['literal','assignment'].includes(element.dataset.method)){answerMethod=element.dataset.method;renderScene();}}
  else if(action==='teacherAnswer'){if(config.class===2&&config.scenes[scene].kind==='verify'){teacherAnswer=!teacherAnswer;renderScene();}}
  else if(action==='check'){const index=Number(element.dataset.index);if(!Number.isInteger(index)||index<0||index>=config.checks.length)return;selfChecks.has(index)?selfChecks.delete(index):selfChecks.add(index);renderScene();}
  else if(action==='sources')$('sourcesDialog').showModal();
 });
 $('stage').addEventListener('change',event=>{if(event.target.id==='plutoToggle'){plutoShown=event.target.checked;resultShown=false;renderScene();}else updateVisitor(event);});
 $('stage').addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='lookupQuery'){event.preventDefault();lookup();}});
 $('backButton').addEventListener('click',()=>go(scene-1));$('nextButton').addEventListener('click',()=>go(scene+1));
 $('enButton').addEventListener('click',()=>{lang='en';render();});$('thButton').addEventListener('click',()=>{lang='th';render();});
 $('mapButton').addEventListener('click',()=>{stopMotion();renderChrome();$('mapDialog').showModal();});$('closeMap').addEventListener('click',()=>$('mapDialog').close());
 $('mapGrid').addEventListener('click',event=>{const button=event.target.closest('[data-scene]');if(button){const target=Number(button.dataset.scene);if(Number.isInteger(target)&&target>=0&&target<config.scenes.length){$('mapDialog').close();go(target);}}});
 $('sourcesButton').addEventListener('click',()=>{stopMotion();$('sourcesDialog').showModal();});$('closeSources').addEventListener('click',()=>$('sourcesDialog').close());
 $('restartButton').addEventListener('click',()=>{stopMotion();$('restartDialog').showModal();});$('cancelRestart').addEventListener('click',()=>$('restartDialog').close());$('confirmRestart').addEventListener('click',()=>{$('restartDialog').close();reset();});$('fullscreenButton').addEventListener('click',fullscreen);
 document.addEventListener('fullscreenchange',renderChrome);
 document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;const dialogs=['mapDialog','sourcesDialog','restartDialog'];const open=dialogs.find(id=>$(id).open);if(open){if(event.key==='Escape')$(open).close();return;}if(event.target.closest('input,select,textarea,[contenteditable="true"]'))return;if(event.code==='Space'&&event.target.closest('button,a'))return;const key=event.key.toLowerCase();if(['arrowright','pagedown',' ','arrowleft','pageup','home','end','f','m','s'].includes(key)){event.preventDefault();if(['arrowright','pagedown',' '].includes(key))go(scene+1);else if(['arrowleft','pageup'].includes(key))go(scene-1);else if(key==='home')go(0);else if(key==='end')go(config.scenes.length-1);else if(key==='f')fullscreen();else if(key==='m'){$('mapDialog').showModal();}else if(key==='s'){$('sourcesDialog').showModal();}}});
 if(motion.addEventListener)motion.addEventListener('change',()=>{stopMotion();renderScene();});
 render();
})();
</script>
</body></html>
